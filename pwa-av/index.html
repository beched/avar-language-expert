<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Аварский за час — говорим сразу</title>

<style>
:root{
  --bg:#10161f;--bg2:#161f2c;--card:#1a2433;--card2:#212d3f;
  --ink:#eef4fb;--muted:#93a4bd;--line:#2b384c;
  --red:#ef5466;--grn:#33c67d;--gold:#f3b13a;--blue:#57a8ff;--purp:#a78bfa;
  --av:#ffffff;--ipa:#8fe3b0;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5;padding-bottom:92px}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h2{font-size:1.25rem}h3{font-size:1.02rem;color:var(--gold)}
p{margin:.5em 0}small,.note{color:var(--muted);font-size:.82rem}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:rgba(16,22,31,.86);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:1.6rem;line-height:1}
.brand b{font-size:.98rem}.brand small{display:block;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.toggles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:.72rem;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:5px 9px;cursor:pointer;user-select:none;white-space:nowrap}
.tg b{color:var(--ink)}.tg.on{border-color:var(--grn)}.tg.on b{color:var(--ipa)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(19,26,38,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:.6rem;
  padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav.tabs .ic{font-size:1.15rem;line-height:1}
nav.tabs button.on{color:var(--ink);position:relative}
nav.tabs button.on::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:3px;background:var(--red)}

section.view{display:none;padding:16px 0 10px}
section.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.av{color:var(--av);font-weight:600}
.ipa{color:var(--ipa);font-style:italic;font-size:.9rem}
.az{color:var(--muted);font-size:.85rem}
.hide-ipa .ipa{display:none!important}
.vguide{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
.vguide td{border:1px solid var(--line);padding:6px 9px;vertical-align:middle}
.vguide .v{color:var(--gold);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin:12px 0}
.card.tight{padding:11px 13px}.card h3:first-child{margin-top:0}
.hd{display:flex;align-items:center;gap:8px;margin:22px 0 6px}
.hd .n{font-size:.72rem;color:var(--bg);background:var(--gold);border-radius:6px;padding:2px 7px;font-weight:700}
.lead{color:var(--muted);font-size:.94rem;margin:.2em 0 .8em}

.rowlist{display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);padding:9px 12px}
.row .l{min-width:0}.row .ru{font-size:.9rem}.row .ipa{font-size:.8rem}
.row .av{font-size:1.2rem;text-align:right}
.row.head{background:var(--card2);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:.8rem;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.g.on{background:var(--grn);border-color:var(--grn)}
.chip.b.on{background:var(--blue);border-color:var(--blue);color:#04203f}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--red);color:#fff;
  border:none;border-radius:12px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.grn{background:var(--grn);color:#052}.btn.gold{background:var(--gold);color:#20160a}
.btn.blk{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--blue);color:#04203f}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:110px}
.btn.sm{padding:8px 12px;font-size:.82rem;border-radius:10px}
.play{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--blue);color:#04203f;border:none;font-size:.95rem;cursor:pointer;flex:none}
.play:active{transform:scale(.9)}.play.off{background:var(--card2);color:var(--muted);cursor:default}

.callout{border-left:3px solid var(--line);background:var(--card2);border-radius:0 10px 10px 0;padding:9px 12px;margin:10px 0;font-size:.9rem}
.callout.g{border-color:var(--grn)}.callout.b{border-color:var(--blue)}.callout.r{border-color:var(--red)}

.prog{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--blue));width:0}
.tiles{display:flex;gap:8px;margin:10px 0}
.tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.4rem;color:var(--gold)}.tile small{font-size:.66rem}

.lesson{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin:8px 0;cursor:pointer}
.lesson .badge{width:34px;height:34px;border-radius:9px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:1.1rem;flex:none}
.lesson.done .badge{background:var(--grn);color:#052}.lesson.started .badge{background:var(--gold);color:#20160a}
.lesson .lt{flex:1;min-width:0}.lesson .lt b{font-size:.98rem}.lesson .lt small{display:block;color:var(--muted);font-size:.76rem}
.lesson .arrow{color:var(--muted)}
.back{color:var(--muted);cursor:pointer;font-size:.85rem;display:inline-block;margin:2px 0 6px}

.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 15px;margin:10px 0;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stage .tasktag{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stage .prompt{font-size:1.35rem;font-weight:600}
.stage .ans{font-size:1.5rem;color:var(--ipa)}
.stage .ansru{color:var(--muted);font-size:.95rem}
.grade{display:none;gap:8px;margin-top:4px}.grade.on{display:flex}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 14px;margin:6px 0;font-size:1rem;cursor:pointer;font-family:inherit}
.opt.correct{background:var(--grn);color:#052;border-color:var(--grn)}
.opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.feedback{margin:6px 0;font-weight:600}.feedback.ok{color:var(--grn)}.feedback.no{color:var(--red)}

.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 16px;margin:10px 0;text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}
.flash .kind{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.flash .big{font-size:1.9rem;font-weight:700}
.flash .tap{color:var(--muted);font-size:.8rem;margin-top:6px}
.flash .divider{border-top:1px dashed var(--line);margin:10px 0 4px;padding-top:10px}

input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0}
summary{cursor:pointer;padding:8px 0;font-weight:600}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;-webkit-overflow-scrolling:touch}
.subtabs button{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;font-family:inherit}
.subtabs button.on{background:var(--blue);color:#04203f;border-color:var(--blue)}
.letter{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}
.letter .big{font-size:1.5rem;font-weight:700;min-width:56px}
.letter .li{flex:1;min-width:0}.letter .li .ipa{font-family:ui-monospace,monospace}
.letter .ex{color:var(--muted);font-size:.82rem}
.hdrback{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  width:34px;height:34px;font-size:1.4rem;line-height:1;cursor:pointer;flex:none;font-family:inherit;padding:0}
.hdrback:active{transform:scale(.94)}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:44px;height:44px;
  border-radius:50%;background:var(--blue);color:#04203f;border:none;font-size:1.3rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.fab.show{display:flex}.fab:active{transform:scale(.9)}
</style>
</head>

</div></header>

/span></td></tr>\n</table>\n<div class=\"callout g\"><b>Про тебя.</b> Если ты говоришь о себе: мальчик/мужчина —\n«Дун … <b>вуго</b>», девочка/женщина — «Дун … <b>йиго</b>». Переключи ♂/♀ вверху — примеры изменятся!</div>\n", "words": [{"ru": "я", "av": "дун"}, {"ru": "ты", "av": "мун"}, {"ru": "он (тот)", "av": "дов", "cls": "I"}, {"ru": "она (та)", "av": "дой", "cls": "II"}, {"ru": "это (то)", "av": "доб", "cls": "III"}, {"ru": "мальчик", "av": "вас", "cls": "I"}, {"ru": "девочка", "av": "яс", "cls": "II"}, {"ru": "мужчина", "av": "бихьинчи", "cls": "I"}, {"ru": "лошадь", "av": "чу", "cls": "III"}, {"ru": "мама", "av": "эбел", "cls": "II"}, {"ru": "папа", "av": "эмен", "cls": "I"}, {"ru": "дети", "av": "лъимал", "cls": "PL"}, {"ru": "есть/является (он)", "av": "вуго"}, {"ru": "есть (она)", "av": "йиго"}, {"ru": "есть (это)", "av": "буго"}, {"ru": "есть (мн.)", "av": "руго"}], "ex": [{"t": "mcq", "q": "Как сказать «Он мальчик»?", "opts": ["Дов вас вуго", "Дой яс йиго", "Доб чу буго"], "a": 0}, {"t": "mcq", "q": "Какой показатель у III класса (вещи, животные)?", "opts": ["б", "в", "й"], "a": 0}, {"t": "say", "q": "Скажи: «Это лошадь»", "ans": "Доб чу буго"}, {"t": "mcq", "q": "Девочка Аминат говорит о себе. Как?", "opts": ["Дун яс йиго", "Дун вас вуго", "Дой яс буго"], "a": 0}, {"t": "mcq", "q": "Как сказать «я»?", "opts": ["лъимал", "дун", "тӀехь"], "a": 1}, {"t": "mcq", "q": "Как сказать «ты»?", "opts": ["рукъ", "буго", "мун"], "a": 2}], "drill": {"gen": "copula"}, "lvl": "A1"}, {"id": "greet", "emoji": "👋", "t": "Салам!", "sub": "Здравствуй, знакомимся", "teach": "\n<p class=\"lead\">Даже в «здравствуй» слышен класс! Мужчине/мальчику — <b>ВорчӀами</b>,\nженщине/девочке — <b>ЙорчӀами</b>, нескольким — <b>РорчӀами</b>.</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">ВорчӀами!</td><td>Здравствуй (мужчине)</td></tr>\n<tr><td class=\"v\">ЙорчӀами!</td><td>Здравствуй (женщине)</td></tr>\n<tr><td class=\"v\">РорчӀами!</td><td>Здравствуйте (многим)</td></tr>\n</table>\n<p>Знакомимся:</p>\n<table class=\"vguide\">\n<tr><td>Дуда цӀар щиб?</td><td>Как тебя зовут? <span class=\"az\">(букв. «твоё имя что?»)</span></td></tr>\n<tr><td>Дир цӀар … <b>буго</b></td><td>Моё имя … <span class=\"az\">(имя — вещь, III класс → буго)</span></td></tr>\n<tr><td>Дун … <b>вуго/йиго</b></td><td>Я … (мальчик → вуго, девочка → йиго)</td></tr>\n<tr><td>Щиб хӀал бугеб?</td><td>Как дела? <span class=\"az\">Ответ: ЛъикӀ буго — Хорошо</span></td></tr>\n</table>\n<div class=\"callout b\"><b>Спасибо</b> — <b>баркала</b>. <b>Да</b> — <b>гьо</b>, <b>нет</b> — <b>гьечӀо</b>.\nВежливого «вы» в аварском нет — даже старшим говорят «мун» (ты).</div>\n", "words": [{"ru": "здравствуй (м.)", "av": "ворчӀами"}, {"ru": "здравствуй (ж.)", "av": "йорчӀами"}, {"ru": "здравствуйте (мн.)", "av": "рорчӀами"}, {"ru": "имя", "av": "цӀар"}, {"ru": "как тебя зовут?", "av": "дуда цӀар щиб?"}, {"ru": "спасибо", "av": "баркала"}, {"ru": "да", "av": "гьо"}, {"ru": "нет", "av": "гьечӀо"}, {"ru": "друг", "av": "гьудул"}], "ex": [{"t": "mcq", "q": "Ты здороваешься с девочкой. Что скажешь?", "opts": ["ЙорчӀами!", "ВорчӀами!", "РорчӀами!"], "a": 0}, {"t": "say", "q": "Спроси: «Как тебя зовут?»", "ans": "Дуда цӀар щиб?"}, {"t": "mcq", "q": "«Спасибо» по-аварски —", "opts": ["Баркала", "ГьечӀо", "Гьо"], "a": 0}, {"t": "say", "q": "Мальчик Муса представляется: «Я — Муса».", "ans": "Дун Муса вуго"}, {"t": "mcq", "q": "Как сказать «здравствуй (м.)»?", "opts": ["рорчӀами", "ворчӀами", "лъимер"], "a": 1}, {"t": "mcq", "q": "Как сказать «здравствуй (ж.)»?", "opts": ["кӀудияб", "гьо", "йорчӀами"], "a": 2}], "drill": {"gen": "greet"}, "lvl": "A1"}, {"id": "this", "emoji": "👉", "t": "Гьаб, гьеб, доб", "sub": "Это… / то… + что это?", "teach": "\n<p class=\"lead\">Указательные слова тоже берут классный показатель. Для вещей (III класс) — на <b>-б</b>:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">гьаб</td><td>это (рядом)</td><td>Гьаб тӀехь буго <span class=\"az\">Это книга</span></td></tr>\n<tr><td class=\"v\">гьеб</td><td>то (чуть дальше)</td><td>Гьеб къалам буго <span class=\"az\">Это ручка</span></td></tr>\n<tr><td class=\"v\">доб</td><td>то (далеко)</td><td>Доб рукъ буго <span class=\"az\">То — дом</span></td></tr>\n</table>\n<p>Вопрос про вещь: <b>Гьаб щиб бугеб?</b> — «Это что?». Отвечаем: <b>Гьаб … буго</b>.</p>\n<div class=\"callout g\">Порядок слов простой: <b>[Это] [вещь] буго</b>. Слово «буго» всегда в конце\nи его нельзя пропускать (в отличие от русского «это — книга»).</div>\n", "words": [{"ru": "это (рядом)", "av": "гьаб", "cls": "III"}, {"ru": "то", "av": "гьеб", "cls": "III"}, {"ru": "то (далеко)", "av": "доб", "cls": "III"}, {"ru": "что это?", "av": "гьаб щиб бугеб?"}, {"ru": "книга", "av": "тӀехь", "cls": "III"}, {"ru": "ручка", "av": "къалам", "cls": "III"}, {"ru": "стол", "av": "стол", "cls": "III"}, {"ru": "дверь", "av": "нуцӀа", "cls": "III"}, {"ru": "окно", "av": "гордо", "cls": "III"}, {"ru": "вещь", "av": "жо", "cls": "III"}, {"ru": "дом", "av": "рукъ", "cls": "III"}], "ex": [{"t": "mcq", "q": "Как сказать «Это книга»?", "opts": ["Гьаб тӀехь буго", "Гьаб тӀехь вуго", "Доб яс йиго"], "a": 0}, {"t": "say", "q": "Скажи: «То — дом» (это дом вдалеке)", "ans": "Доб рукъ буго"}, {"t": "mcq", "q": "Слово «буго» ставится…", "opts": ["В конце предложения", "В начале", "Можно опустить"], "a": 0}, {"t": "mcq", "q": "Как сказать «это (рядом)»?", "opts": ["гьеб", "гьаб", "гӀурччинаб"], "a": 1}, {"t": "mcq", "q": "Как сказать «то»?", "opts": ["щуго", "стол", "гьеб"], "a": 2}, {"t": "mcq", "q": "Как сказать «то (далеко)»?", "opts": ["доб", "жо", "чан"], "a": 0}], "drill": {"gen": "thisis"}, "lvl": "A1"}, {"id": "my", "emoji": "👪", "t": "Дир, дур — моя семья", "sub": "Мой / твой + родные", "teach": "\n<p class=\"lead\"><b>Дир</b> — мой/моя/моё, <b>дур</b> — твой/твоя/твоё. Они не меняются по классу,\nно «есть» после них — меняется:</p>\n<table class=\"vguide\">\n<tr><td>Дир вац <b class=\"v\">вуго</b></td><td>У меня есть брат <span class=\"az\">(брат — I класс)</span></td></tr>\n<tr><td>Дир яц <b class=\"v\">йиго</b></td><td>У меня есть сестра <span class=\"az\">(сестра — II класс)</span></td></tr>\n<tr><td>Дир чу <b class=\"v\">буго</b></td><td>У меня есть лошадь <span class=\"az\">(вещь/животное — III)</span></td></tr>\n<tr><td>Дир лъимал <b class=\"v\">руго</b></td><td>У меня есть дети <span class=\"az\">(мн. число)</span></td></tr>\n</table>\n<div class=\"callout b\">«У меня есть …» в аварском — это просто <b>«Дир … вуго/йиго/буго/руго»</b>\n(букв. «моё … есть»). Выбирай в/й/б/р по классу того, о ком говоришь.</div>\n", "words": [{"ru": "мой", "av": "дир"}, {"ru": "твой", "av": "дур"}, {"ru": "брат", "av": "вац", "cls": "I"}, {"ru": "сестра", "av": "яц", "cls": "II"}, {"ru": "бабушка", "av": "кӀодо", "cls": "II"}, {"ru": "дедушка", "av": "кӀудада", "cls": "I"}, {"ru": "семья", "av": "хъизан", "cls": "III"}, {"ru": "ребёнок", "av": "лъимер", "cls": "III"}, {"ru": "муж", "av": "рос", "cls": "I"}, {"ru": "жена", "av": "лъади", "cls": "II"}, {"ru": "человек", "av": "чи", "cls": "I"}], "ex": [{"t": "mcq", "q": "«У меня есть сестра» —", "opts": ["Дир яц йиго", "Дир яц вуго", "Дир вац буго"], "a": 0}, {"t": "say", "q": "Скажи: «У меня есть брат»", "ans": "Дир вац вуго"}, {"t": "mcq", "q": "«Твой» по-аварски —", "opts": ["дур", "дир", "доб"], "a": 0}, {"t": "say", "q": "Скажи: «У меня есть дети»", "ans": "Дир лъимал руго"}, {"t": "mcq", "q": "Как сказать «мой»?", "opts": ["жо", "дир", "квер"], "a": 1}, {"t": "mcq", "q": "Как сказать «твой»?", "opts": ["гьекъезе", "вац", "дур"], "a": 2}], "drill": {"gen": "possess"}, "lvl": "A1"}, {"id": "adj", "emoji": "🌈", "t": "Сифатал ва кьерал", "sub": "Признаки и цвета (согласование)", "teach": "\n<p class=\"lead\">Прилагательное <b>согласуется с классом</b>: последняя буква меняется на в/й/б/л.\nСловарная форма — на <b>-б</b> (для вещей).</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">кӀудияб</td><td>большой (III)</td><td>кӀудия<b>б</b> рукъ <span class=\"az\">большой дом</span></td></tr>\n<tr><td class=\"v\">кӀудияв</td><td>большой (I, о мужчине)</td><td>кӀудия<b>в</b> вас <span class=\"az\">большой мальчик</span></td></tr>\n<tr><td class=\"v\">кӀудияй</td><td>большая (II, о женщине)</td><td>кӀудия<b>й</b> яс <span class=\"az\">большая девочка</span></td></tr>\n<tr><td class=\"v\">кӀудиял</td><td>большие (мн.)</td><td>кӀудия<b>л</b> лъимал <span class=\"az\">большие дети</span></td></tr>\n</table>\n<div class=\"callout g\">Правило простое: бери словарную форму (…аб), замени последнюю <b>б</b> на\n<b>в</b> (муж.), <b>й</b> (жен.), <b>л</b> (мн.) — и всё согласовано.</div>\n<h3>Два случая — не путай!</h3>\n<table class=\"vguide\">\n<tr><td><b>Признак</b> (перед словом, <u>без</u> «буго»)</td><td class=\"v\">лъикӀаб тӀехь</td><td>хорошая книга</td></tr>\n<tr><td></td><td class=\"v\">берцинай яс</td><td>красивая девочка</td></tr>\n<tr><td><b>Сказуемое</b> (после слова, <u>с</u> «буго»)</td><td class=\"v\">ТӀехь лъикӀаб буго</td><td>Книга хорошая</td></tr>\n<tr><td></td><td class=\"v\">Вас кӀудияв вуго</td><td>Мальчик большой</td></tr></table>\n<div class=\"callout b\">«хорошая книга» — это просто <b>словосочетание</b>: «лъикӀаб тӀехь» (без «буго»!).\nА «Книга хорошая» — это уже <b>целое предложение</b> (о чём-то говорим), тут слово ставится\nвперёд и добавляется «буго»: «ТӀехь лъикӀаб буго».</div>\n", "words": [{"ru": "хороший", "av": "лъикӀаб", "cls": "III"}, {"ru": "плохой", "av": "квешаб", "cls": "III"}, {"ru": "большой", "av": "кӀудияб", "cls": "III"}, {"ru": "маленький", "av": "гьитӀинаб", "cls": "III"}, {"ru": "новый", "av": "цӀияб", "cls": "III"}, {"ru": "красивый", "av": "берцинаб", "cls": "III"}, {"ru": "белый", "av": "хъахӀаб", "cls": "III"}, {"ru": "чёрный", "av": "чӀегӀераб", "cls": "III"}, {"ru": "красный", "av": "багӀараб", "cls": "III"}, {"ru": "жёлтый", "av": "гӀобилаб", "cls": "III"}, {"ru": "зелёный", "av": "гӀурччинаб", "cls": "III"}, {"ru": "синий", "av": "хъахӀилаб", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Большой мальчик» (словосочетание, I класс) —", "opts": ["кӀудияв вас", "кӀудияв вас вуго", "вас кӀудияв"], "a": 0}, {"t": "say", "q": "Скажи словосочетание «хорошая книга» (тӀехь — III, без «буго»!)", "ans": "лъикӀаб тӀехь"}, {"t": "say", "q": "Скажи словосочетание «красивая девочка» (яс, II, без «буго»!)", "ans": "берцинай яс"}, {"t": "mcq", "q": "Чтобы согласовать с девочкой (II), последняя буква прилагательного —", "opts": ["й", "в", "б"], "a": 0}, {"t": "say", "q": "А теперь предложение: «Мальчик большой» (вас, I)", "ans": "Вас кӀудияв вуго"}, {"t": "mcq", "q": "«Книга хорошая» (предложение) —", "opts": ["ТӀехь лъикӀаб буго", "лъикӀаб тӀехь буго", "лъикӀаб тӀехь"], "a": 0}], "drill": {"gen": "adj"}, "lvl": "A1"}, {"id": "num", "emoji": "🔢", "t": "РикӀкӀаби", "sub": "Числа 1–10 и счёт", "teach": "\n<p class=\"lead\">Считаем: числа оканчиваются на <b>-го</b>. Перед словом «-го» часто отпадает:\n<b>кӀи<span class=\"az\">-</span>го вас</b> — «два мальчика».</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">цо</td><td>1</td><td class=\"v\">анлъго</td><td>6</td></tr>\n<tr><td class=\"v\">кӀиго</td><td>2</td><td class=\"v\">анкьго</td><td>7</td></tr>\n<tr><td class=\"v\">лъабго</td><td>3</td><td class=\"v\">микьго</td><td>8</td></tr>\n<tr><td class=\"v\">ункъго</td><td>4</td><td class=\"v\">ичӀго</td><td>9</td></tr>\n<tr><td class=\"v\">щуго</td><td>5</td><td class=\"v\">анцӀго</td><td>10</td></tr>\n</table>\n<p>Вопрос «сколько?» — <b>чан?</b>. Например: <b>Чан гӀеч бугеб?</b> — «Сколько яблок?».</p>\n<div class=\"callout b\">Интересно: после 10 аварцы считают двадцатками — <b>къого</b> = 20,\n<b>кӀикъого</b> = 40 (букв. «два-двадцать»). Но для начала хватит 1–10!</div>\n", "words": [{"ru": "1", "av": "цо"}, {"ru": "2", "av": "кӀиго"}, {"ru": "3", "av": "лъабго"}, {"ru": "4", "av": "ункъго"}, {"ru": "5", "av": "щуго"}, {"ru": "6", "av": "анлъго"}, {"ru": "7", "av": "анкьго"}, {"ru": "8", "av": "микьго"}, {"ru": "9", "av": "ичӀго"}, {"ru": "10", "av": "анцӀго"}, {"ru": "сколько?", "av": "чан"}, {"ru": "глаз", "av": "бер", "cls": "III"}, {"ru": "рука", "av": "квер", "cls": "III"}, {"ru": "нога", "av": "бох", "cls": "III"}, {"ru": "голова", "av": "бетӀер", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Два» по-аварски —", "opts": ["кӀиго", "лъабго", "цо"], "a": 0}, {"t": "say", "q": "Скажи: «три дома» (рукъ)", "ans": "лъабго рукъ"}, {"t": "mcq", "q": "Что значит «чан?»", "opts": ["Сколько?", "Что?", "Где?"], "a": 0}, {"t": "say", "q": "Посчитай: цо, кӀиго, …? (назови «три»)", "ans": "лъабго"}, {"t": "mcq", "q": "Как сказать «1»?", "opts": ["квешаб", "цо", "гьой"], "a": 1}, {"t": "mcq", "q": "Как сказать «2»?", "opts": ["ччугӀа", "цӀияб", "кӀиго"], "a": 2}], "drill": {"gen": "num"}, "lvl": "A1"}, {"id": "pres", "emoji": "🍽️", "t": "Настоящее время", "sub": "Что делаю? (‑ула) + еда", "teach": "\n<p class=\"lead\">Глагол в настоящем времени оканчивается на <b>‑ула / ‑уна</b>:\n<b>цӀал‑ула</b> «читает», <b>кван‑ала</b> «ест», <b>гьекъ‑ола</b> «пьёт».</p>\n<table class=\"vguide\">\n<tr><td>цӀализе → цӀал<b class=\"v\">ула</b></td><td>читать → читает/читаю</td></tr>\n<tr><td>хъвазе → хъ<b class=\"v\">вала</b></td><td>писать → пишет</td></tr>\n<tr><td>кваназе → кван<b class=\"v\">ала</b></td><td>есть → ест</td></tr>\n</table>\n<div class=\"callout g\"><b>Важно (эргатив).</b> Кто что-то <i>делает с предметом</i>, стоит с окончанием\n<b>‑ца</b>: <b>Дица тӀехь цӀалула</b> — «Я читаю книгу» (букв. «мной книга читается»).\n«Дун» → «Ди<b>ца</b>», «мун» → «Ду<b>ца</b>».</div>\n<p>Форма глагола не зависит от класса читающего — меняется только «‑ца» у деятеля.</p>\n", "words": [{"ru": "читать", "av": "цӀализе", "cls": "III"}, {"ru": "писать", "av": "хъвазе", "cls": "III"}, {"ru": "есть/кушать", "av": "квине", "cls": "III"}, {"ru": "пить", "av": "гьекъезе", "cls": "III"}, {"ru": "знать", "av": "лъазе", "cls": "III"}, {"ru": "смотреть", "av": "балагьизе", "cls": "III"}, {"ru": "я (эрг.)", "av": "дица"}, {"ru": "ты (эрг.)", "av": "дуца"}, {"ru": "письмо", "av": "кагъат", "cls": "III"}, {"ru": "хлеб", "av": "чед", "cls": "III"}, {"ru": "вода", "av": "лъим", "cls": "III"}, {"ru": "мясо", "av": "гьан", "cls": "III"}, {"ru": "яблоко", "av": "гӀеч", "cls": "III"}, {"ru": "молоко", "av": "рахь", "cls": "III"}, {"ru": "еда", "av": "квен", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Я читаю книгу» —", "opts": ["Дица тӀехь цӀалула", "Дун тӀехь цӀалула", "Дир тӀехь буго"], "a": 0}, {"t": "say", "q": "Скажи: «Я пью воду» (гьекъезе → гьекъола)", "ans": "Дица лъим гьекъола"}, {"t": "mcq", "q": "Окончание настоящего времени —", "opts": ["‑ула/‑уна", "‑ана", "‑ила"], "a": 0}, {"t": "mcq", "q": "Как сказать «читать»?", "opts": ["багӀараб", "цӀализе", "сон"], "a": 1}, {"t": "mcq", "q": "Как сказать «писать»?", "opts": ["цӀалила", "хъахӀилаб", "хъвазе"], "a": 2}, {"t": "mcq", "q": "Как сказать «есть/кушать»?", "opts": ["квине", "лъабго", "бакъ"], "a": 0}], "drill": {"gen": "verbpres"}, "lvl": "A2"}, {"id": "want", "emoji": "🎒", "t": "Хочу и могу", "sub": "Бокьун буго / кӀола + школа", "teach": "\n<p class=\"lead\">Сказать «хочу» и «могу» — это уже настоящая речь!</p>\n<table class=\"vguide\">\n<tr><td>Дие … <b>бокьун буго</b></td><td>Я хочу … <span class=\"az\">(мне … желаемо есть)</span></td></tr>\n<tr><td>Дида … <b>кӀола</b></td><td>Я могу / умею … <span class=\"az\">(мне … по силам)</span></td></tr>\n</table>\n<p>Обрати внимание: «я» здесь — <b>дие</b> (хочу) или <b>дида</b> (могу), не «дун».\nЭто разные падежи слова «я»; пока просто запомни две готовые формулы.</p>\n<div class=\"callout b\">Пример: <b>Дие тӀехь бокьун буго</b> — «Я хочу книгу».\n<b>Дида цӀ<span class=\"v\">али</span>зе кӀола</b> — «Я умею читать».<br>\n(<b>кӀола</b> — «могу» сейчас; <b>кӀвела</b> — «смогу», будущее.)</div>\n", "words": [{"ru": "я хочу", "av": "дие … бокьун буго"}, {"ru": "я могу", "av": "дида … кӀола"}, {"ru": "мне (дат.)", "av": "дие"}, {"ru": "мне (мест.)", "av": "дида"}, {"ru": "делать", "av": "гьабизе", "cls": "III"}, {"ru": "работать", "av": "хӀалтӀизе", "cls": "III"}, {"ru": "играть", "av": "хӀазе", "cls": "III"}, {"ru": "школа", "av": "школа", "cls": "III"}, {"ru": "урок", "av": "дарс", "cls": "III"}, {"ru": "учитель", "av": "мугӀалим", "cls": "I"}, {"ru": "ученик", "av": "цӀалдохъан", "cls": "I"}, {"ru": "слово", "av": "рагӀи", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Я хочу книгу» —", "opts": ["Дие тӀехь бокьун буго", "Дун тӀехь буго", "Дир тӀехь кӀола"], "a": 0}, {"t": "say", "q": "Скажи: «Я умею читать» (наст. время)", "ans": "Дида цӀализе кӀола"}, {"t": "mcq", "q": "В формуле «хочу» слово «я» —", "opts": ["дие", "дун", "дир"], "a": 0}, {"t": "mcq", "q": "«Я умею» (сейчас) —", "opts": ["Дида … кӀола", "Дида … кӀвела", "Дун … вуго"], "a": 0}, {"t": "say", "q": "Скажи: «Я хочу воду» (лъим)", "ans": "Дие лъим бокьун буго"}, {"t": "mcq", "q": "«кӀвела» — это…", "opts": ["будущее: «смогу»", "настоящее: «могу»", "приказ"], "a": 0}], "drill": {"gen": "want"}, "lvl": "A2"}, {"id": "neg", "emoji": "🚫", "t": "Отрицание", "sub": "Нет и «не делаю» + животные", "teach": "\n<p class=\"lead\">Три способа сказать «нет»:</p>\n<table class=\"vguide\">\n<tr><td><b>гьечӀо</b></td><td>нет / отсутствует</td><td>Чу гьечӀо <span class=\"az\">Лошади нет</span></td></tr>\n<tr><td>глагол + <b>‑ро</b></td><td>не делает (наст./буд.)</td><td>цӀалула → цӀалула<b>ро</b> <span class=\"az\">не читает</span></td></tr>\n<tr><td>глагол + <b>‑чӀо</b></td><td>не сделал (прош.)</td><td>цӀали<b>чӀо</b> <span class=\"az\">не читал</span></td></tr>\n</table>\n<div class=\"callout g\"><b>гьечӀо</b> не меняется по классу — удобно! «Вас гьечӀо» (мальчика нет),\n«Яс гьечӀо» (девочки нет), «Чу гьечӀо» (лошади нет) — одинаково.</div>\n", "words": [{"ru": "нет/отсутствует", "av": "гьечӀо"}, {"ru": "собака", "av": "гьой", "cls": "III"}, {"ru": "кошка", "av": "кету", "cls": "III"}, {"ru": "корова", "av": "гӀака", "cls": "III"}, {"ru": "овца", "av": "чахъу", "cls": "III"}, {"ru": "волк", "av": "бацӀ", "cls": "III"}, {"ru": "птица", "av": "хӀинчӀ", "cls": "III"}, {"ru": "рыба", "av": "ччугӀа", "cls": "III"}, {"ru": "осёл", "av": "хӀама", "cls": "III"}, {"ru": "коза", "av": "цӀцӀе", "cls": "III"}, {"ru": "медведь", "av": "ци", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Лошади нет» —", "opts": ["Чу гьечӀо", "Чу буго", "Чу вуго"], "a": 0}, {"t": "say", "q": "Скажи: «собаки нет» (гьой)", "ans": "Гьой гьечӀо"}, {"t": "mcq", "q": "«Не читает» — какое окончание?", "opts": ["‑ро", "‑чӀо", "‑ула"], "a": 0}, {"t": "mcq", "q": "Как сказать «нет/отсутствует»?", "opts": ["бер", "гьечӀо", "щив"], "a": 1}, {"t": "mcq", "q": "Как сказать «собака»?", "opts": ["ретӀел", "бох", "гьой"], "a": 2}, {"t": "mcq", "q": "Как сказать «кошка»?", "opts": ["кету", "хъвазе", "гьанибе"], "a": 0}], "drill": {"gen": "neg"}, "lvl": "A2"}, {"id": "past", "emoji": "🕰️", "t": "Прошедшее время", "sub": "Что сделал? (‑ана) + время", "teach": "\n<p class=\"lead\">Прошедшее время — окончание <b>‑ана / ‑на</b>. У глаголов движения появляется\n<b>классный показатель</b> в начале, по тому, кто действовал:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">Дун вачӀана</td><td>Я пришёл (мальчик/мужчина, I → в‑)</td></tr>\n<tr><td class=\"v\">Дун йачӀана</td><td>Я пришла (девочка/женщина, II → й‑)</td></tr>\n<tr><td>Дица тӀехь цӀал<b class=\"v\">ана</b></td><td>Я прочитал книгу</td></tr>\n</table>\n<div class=\"callout b\">Слушай себя: если ты мальчик — «в<b>а</b>чӀана», если девочка —\n«й<b>а</b>чӀана». Переключи ♂/♀ вверху и посмотри, как меняются примеры в тренировке!</div>\n", "words": [{"ru": "пришёл/пришла", "av": "вачӀана"}, {"ru": "сделал", "av": "гьабуна"}, {"ru": "сегодня", "av": "жакъа"}, {"ru": "завтра", "av": "метер"}, {"ru": "вчера", "av": "сон"}, {"ru": "день", "av": "къо", "cls": "III"}, {"ru": "ночь", "av": "сордо", "cls": "III"}, {"ru": "утро", "av": "радал", "cls": "III"}, {"ru": "год", "av": "лъагӀел", "cls": "III"}, {"ru": "сейчас", "av": "гьанже"}], "ex": [{"t": "mcq", "q": "Мальчик говорит «Я пришёл» —", "opts": ["Дун вачӀана", "Дун йачӀана", "Дун вачӀина"], "a": 0}, {"t": "say", "q": "Девочка говорит «Я пришла»", "ans": "Дун йачӀана"}, {"t": "mcq", "q": "Окончание прошедшего времени —", "opts": ["‑ана/‑на", "‑ула", "‑ила"], "a": 0}, {"t": "mcq", "q": "Как сказать «пришёл/пришла»?", "opts": ["квине", "вачӀана", "ине"], "a": 1}, {"t": "mcq", "q": "Как сказать «сделал»?", "opts": ["мадугьал", "балагьизе", "гьабуна"], "a": 2}, {"t": "mcq", "q": "Как сказать «сегодня»?", "opts": ["жакъа", "кагъат", "яги"], "a": 0}], "drill": {"gen": "past"}, "lvl": "A2"}, {"id": "fut", "emoji": "⏭️", "t": "Будущее время", "sub": "Что сделаю? (‑ила / ‑ина) + природа", "teach": "\n<p class=\"lead\">Будущее время — окончание <b>‑ила / ‑ина</b>. Строится так же, как настоящее,\nно с другим окончанием:</p>\n<table class=\"vguide\">\n<tr><td>цӀализе → цӀал<b class=\"v\">ила</b></td><td>прочтёт / прочитаю</td></tr>\n<tr><td>гьекъезе → гьекъ<b class=\"v\">ела</b></td><td>выпьет</td></tr>\n<tr><td>босизе → бос<b class=\"v\">ила</b></td><td>возьмёт</td></tr>\n<tr><td>вачӀине → вачӀ<b class=\"v\">ина</b></td><td>придёт</td></tr>\n</table>\n<p>Как и в настоящем: деятель с предметом — в эргативе (<b>‑ца</b>):</p>\n<div class=\"callout g\"><b>Дица тӀехь цӀалила</b> — «Я прочитаю книгу».<br>\n<b>Метер дун вачӀина</b> — «Завтра я приду». (метер — завтра)</div>\n<div class=\"callout b\">Сравни три времени одного глагола: цӀал<b>ула</b> (читает) · цӀал<b>ана</b> (читал) ·\nцӀал<b>ила</b> (прочтёт). Меняется только хвостик!</div>\n", "words": [{"ru": "прочитаю (буд.)", "av": "цӀалила"}, {"ru": "выпью (буд.)", "av": "гьекъела"}, {"ru": "возьму (буд.)", "av": "босила"}, {"ru": "приду (буд.)", "av": "вачӀина"}, {"ru": "завтра", "av": "метер"}, {"ru": "гора", "av": "мегӀер", "cls": "III"}, {"ru": "небо", "av": "зоб", "cls": "III"}, {"ru": "солнце", "av": "бакъ", "cls": "III"}, {"ru": "луна", "av": "моцӀ", "cls": "III"}, {"ru": "река", "av": "гӀор", "cls": "III"}, {"ru": "дерево", "av": "гъветӀ", "cls": "III"}, {"ru": "цветок", "av": "тӀегь", "cls": "III"}, {"ru": "дождь", "av": "цӀад", "cls": "III"}, {"ru": "снег", "av": "гӀазу", "cls": "III"}], "ex": [{"t": "mcq", "q": "Окончание будущего времени —", "opts": ["‑ила/‑ина", "‑ана", "‑ула"], "a": 0}, {"t": "say", "q": "Скажи: «Я прочитаю книгу» (тӀехь)", "ans": "Дица тӀехь цӀалила"}, {"t": "mcq", "q": "«Завтра я приду» —", "opts": ["Метер дун вачӀина", "Дун вачӀана", "Дица цӀалила"], "a": 0}, {"t": "say", "q": "Скажи в будущем: «выпью воду» (лъим, гьекъезе → гьекъела)", "ans": "Дица лъим гьекъела"}, {"t": "mcq", "q": "цӀалила — это…", "opts": ["будущее (прочтёт)", "прошедшее (читал)", "настоящее (читает)"], "a": 0}, {"t": "mcq", "q": "Как сказать «прочитаю (буд.)»?", "opts": ["чед", "цӀалила", "гьединлъидал"], "a": 1}], "drill": {"gen": "future"}, "lvl": "A2"}, {"id": "imper", "emoji": "🙏", "t": "Просьбы и приказы", "sub": "Сделай! / не делай! (повелительное)", "teach": "\n<p class=\"lead\">Повелительное наклонение — как просить и командовать:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑е</td><td>переходные (с предметом)</td><td>бос<b>е</b>! <span class=\"az\">возьми!</span> · цӀал<b>е</b>! читай!</td></tr>\n<tr><td class=\"v\">‑а</td><td>многие непереходные</td><td>вачӀ<b>а</b>! <span class=\"az\">приходи!</span> · вахъ<b>а</b>! вставай!</td></tr>\n<tr><td class=\"v\">‑ай / ‑й</td><td>часть глаголов</td><td>кван<b>ай</b>! <span class=\"az\">кушай!</span> · хъв<b>ай</b>! пиши!</td></tr>\n<tr><td class=\"v\">‑ге</td><td>запрет («не…»)</td><td>цӀалу<b>ге</b>! <span class=\"az\">не читай!</span></td></tr>\n</table>\n<div class=\"callout g\">Каждый день: <b>Балагье!</b> «Смотри!», <b>Вахъа!</b> «Вставай!»,\n<b>Кванай!</b> «Кушай!», <b>ВачӀа!</b> «Иди сюда!».</div>\n<div class=\"callout b\">Осторожно с формами! <b>Кванай!</b> — «Кушай!» (приказ). А «квана» — это уже\nдругое (от «квине» — съев). Слушай окончание.</div>\n", "words": [{"ru": "возьми!", "av": "босе"}, {"ru": "читай!", "av": "цӀале"}, {"ru": "приходи!", "av": "вачӀа"}, {"ru": "вставай!", "av": "вахъа"}, {"ru": "кушай!", "av": "кванай"}, {"ru": "пиши!", "av": "хъвай"}, {"ru": "смотри!", "av": "балагье"}, {"ru": "не читай!", "av": "цӀалуге"}], "ex": [{"t": "mcq", "q": "«Возьми!» —", "opts": ["Босе!", "Босила", "БосечӀо"], "a": 0}, {"t": "say", "q": "Скажи: «Смотри!»", "ans": "Балагье"}, {"t": "mcq", "q": "«Кушай!» (приказ) —", "opts": ["Кванай!", "Квана", "Кванала"], "a": 0}, {"t": "mcq", "q": "Запрет «не читай!» — какое окончание?", "opts": ["‑ге (цӀалуге)", "‑е", "‑ила"], "a": 0}, {"t": "say", "q": "Скажи: «Пиши!» (хъвазе → хъвай)", "ans": "Хъвай"}, {"t": "mcq", "q": "«Приходи!» —", "opts": ["ВачӀа!", "ВачӀана", "ВачӀине"], "a": 0}], "drill": {"gen": "imper"}, "lvl": "A2"}, {"id": "quest", "emoji": "❓", "t": "Вопросы", "sub": "Что? кто? где? + одежда", "teach": "\n<p class=\"lead\">Вопросительные слова — половина разговора:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">щиб?</td><td>что?</td><td class=\"v\">киб?</td><td>где?</td></tr>\n<tr><td class=\"v\">щив?</td><td>кто? (о мужчине)</td><td class=\"v\">кида?</td><td>когда?</td></tr>\n<tr><td class=\"v\">щий?</td><td>кто? (о женщине)</td><td class=\"v\">щай?</td><td>почему?</td></tr>\n<tr><td class=\"v\">кин?</td><td>как?</td><td class=\"v\">чан?</td><td>сколько?</td></tr>\n</table>\n<p>Вопрос «да/нет» — частица <b>‑ищ</b> на глаголе: <b>Мун вачӀанищ?</b> — «Ты пришёл?».</p>\n<div class=\"callout b\">Заметь: «кто?» тоже с классом — <b>щив?</b> о мужчине, <b>щий?</b> о женщине,\n<b>щиб?</b> о вещи. Аварский любит классы во всём!</div>\n", "words": [{"ru": "что?", "av": "щиб"}, {"ru": "кто? (м.)", "av": "щив"}, {"ru": "кто? (ж.)", "av": "щий"}, {"ru": "где?", "av": "киб"}, {"ru": "когда?", "av": "кида"}, {"ru": "почему?", "av": "щай"}, {"ru": "как?", "av": "кин"}, {"ru": "одежда", "av": "ретӀел", "cls": "III"}, {"ru": "рубашка", "av": "гурде", "cls": "III"}, {"ru": "шапка", "av": "тӀагъур", "cls": "III"}, {"ru": "обувь", "av": "хьитал", "cls": "PL"}], "ex": [{"t": "mcq", "q": "«Где?» по-аварски —", "opts": ["киб", "щиб", "кин"], "a": 0}, {"t": "say", "q": "Спроси: «Ты пришёл?» (мальчику)", "ans": "Мун вачӀанищ?"}, {"t": "mcq", "q": "«Кто?» о девочке —", "opts": ["щий", "щив", "щиб"], "a": 0}, {"t": "mcq", "q": "Как сказать «что?»?", "opts": ["цӀалдохъан", "щиб", "кквелалде"], "a": 1}, {"t": "mcq", "q": "Как сказать «кто? (м.)»?", "opts": ["росулъ", "кету", "щив"], "a": 2}, {"t": "mcq", "q": "Как сказать «кто? (ж.)»?", "opts": ["щий", "бацӀ", "дов"], "a": 0}], "drill": {"gen": "quest"}, "lvl": "A2"}, {"id": "place", "emoji": "🧭", "t": "Где и куда", "sub": "Здесь, там, идти", "teach": "\n<p class=\"lead\">Место и движение:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">гьаниб</td><td>здесь</td><td class=\"v\">гьанибе</td><td>сюда</td></tr>\n<tr><td class=\"v\">гьениб</td><td>там</td><td class=\"v\">гьанире</td><td>туда</td></tr>\n</table>\n<p>Глагол <b>ине</b> «идти» — особенный: у него <b>нет</b> классного показателя,\nон одинаков для всех: <b>Дун ине</b> «я иду», <b>Дой ине</b> «она идёт».</p>\n<div class=\"callout g\">Сравни: «приходить» — с классом (вачӀине/йачӀине), а «идти» (ине) — без.\nНе говори «вине» или «йине» — только <b>ине</b>!</div>\n", "words": [{"ru": "здесь", "av": "гьаниб"}, {"ru": "там", "av": "гьениб"}, {"ru": "сюда", "av": "гьанибе"}, {"ru": "туда", "av": "гьанире"}, {"ru": "идти", "av": "ине"}, {"ru": "прийти", "av": "вачӀине"}, {"ru": "дорога", "av": "нух", "cls": "III"}, {"ru": "село", "av": "росу", "cls": "III"}, {"ru": "город", "av": "шагьар", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Здесь» —", "opts": ["гьаниб", "гьениб", "гьанире"], "a": 0}, {"t": "mcq", "q": "Глагол «идти» (ине)…", "opts": ["не меняется по классу", "всегда с в‑", "всегда с б‑"], "a": 0}, {"t": "say", "q": "Скажи: «Я иду» (дун)", "ans": "Дун ине"}, {"t": "mcq", "q": "Как сказать «здесь»?", "opts": ["хӀинчӀ", "гьаниб", "доб"], "a": 1}, {"t": "mcq", "q": "Как сказать «там»?", "opts": ["эмен", "цӀцӀе", "гьениб"], "a": 2}, {"t": "mcq", "q": "Как сказать «сюда»?", "opts": ["гьанибе", "гьабуна", "ворчӀами"], "a": 0}], "drill": {"gen": "place"}, "lvl": "A2"}, {"id": "talk", "emoji": "💬", "t": "Говорим!", "sub": "Собираем всё вместе", "teach": "\n<p class=\"lead\">Ты уже знаешь классы, «есть», числа, цвета, вопросы, прошедшее и будущее.\nСоберём короткий диалог:</p>\n<table class=\"vguide\">\n<tr><td>— ВорчӀами! Дуда цӀар щиб?</td><td>— Привет! Как тебя зовут?</td></tr>\n<tr><td>— Дир цӀар Муса буго. Дун цӀалдохъан вуго.</td><td>— Меня зовут Муса. Я ученик.</td></tr>\n<tr><td>— Дур чан сон бугеб?</td><td>— Сколько тебе лет? <span class=\"az\">(букв. твоих сколько лет есть)</span></td></tr>\n<tr><td>— Дир анцӀго сон буго. Баркала!</td><td>— Мне 10 лет. Спасибо!</td></tr>\n</table>\n<div class=\"callout b\">Слово <b>сон</b> здесь — «год (возраста)»: <b>анцӀго сон</b> — «десять лет».\n(То же слово может значить «вчера» — по смыслу понятно, о чём речь.)</div>\n\n<div class=\"callout b\">Продолжай тренироваться в разделе «Гьунар» (Тренировка) — там бесконечные\nзадания по всем темам. Говори вслух — так язык запоминается быстрее всего!</div>\n", "words": [{"ru": "сколько тебе лет?", "av": "дур чан сон бугеб?"}, {"ru": "мне … лет", "av": "дир … сон буго"}, {"ru": "гость", "av": "гьобол", "cls": "I"}, {"ru": "сосед", "av": "мадугьал", "cls": "I"}, {"ru": "хорошо/ладно", "av": "лъикӀ"}], "ex": [{"t": "say", "q": "Поздоровайся с девочкой и спроси имя", "ans": "ЙорчӀами! Дуда цӀар щиб?"}, {"t": "say", "q": "Скажи: «Меня зовут … , я ученик» (мальчик)", "ans": "Дир цӀар … буго. Дун цӀалдохъан вуго."}, {"t": "mcq", "q": "«Сколько тебе лет?» —", "opts": ["Дур чан сон бугеб?", "Дуда цӀар щиб?", "Мун вачӀанищ?"], "a": 0}, {"t": "mcq", "q": "Как сказать «гость»?", "opts": ["жакъа", "гьобол", "рорчӀами"], "a": 1}, {"t": "mcq", "q": "Как сказать «сосед»?", "opts": ["гьаб", "къо", "мадугьал"], "a": 2}, {"t": "mcq", "q": "Как сказать «хорошо/ладно»?", "opts": ["лъикӀ", "лъагӀел", "гордо"], "a": 0}], "drill": {"gen": "talk"}, "lvl": "A2"}, {"id": "loan", "emoji": "🔌", "t": "Заимствования", "sub": "Говори, даже если не знаешь слово", "teach": "\n<p class=\"lead\">Не знаешь аварское слово? <b>Не молчи!</b> Аварцы всегда вставляют русские,\nарабские, английские слова — и ты можешь. Главное — оформить их по-аварски. С этим приёмом\nты говоришь на любую тему уже сегодня.</p>\n<h3>Способ 1: слово + <b>гьабизе</b> («делать»)</h3>\n<table class=\"vguide\">\n<tr><td>проверка <b>гьабизе</b></td><td>проверять <span class=\"az\">(букв. «делать проверку»)</span></td></tr>\n<tr><td>ремонт <b>гьабизе</b></td><td>ремонтировать</td></tr>\n<tr><td>звонок <b>гьабизе</b></td><td>позвонить</td></tr></table>\n<h3>Способ 2 (по-нативному): корень + <b>‑изе</b></h3>\n<p>Бери русский или английский корень и делай аварский глагол на <b>‑изе</b> — а потом склоняй\nкак обычный аварский глагол!</p>\n<table class=\"vguide\">\n<tr><td>проверить → <b class=\"v\">провер‑изе</b></td><td>наст. провер‑ула, прош. провер‑ана</td></tr>\n<tr><td>англ. check → <b class=\"v\">чек‑изе</b></td><td>«чекнуть, проверить»</td></tr>\n<tr><td>гуглить → <b class=\"v\">гугл‑изе</b></td><td>«погуглить»</td></tr></table>\n<div class=\"callout g\"><b>Целая фраза:</b><br>\n<b>Дие бокьун буго провер‑изе, документалда щиб хъван бугеб‑али.</b><br>\n<span class=\"az\">«Я хочу проверить, что написано в документе».</span></div>\n<h3>Заимствованные существительные берут аварские падежи</h3>\n<table class=\"vguide\">\n<tr><td>документ → <b>документалда</b></td><td>в документе</td></tr>\n<tr><td>интернет → <b>интернеталда</b></td><td>в интернете</td></tr>\n<tr><td>телефон → <b>телефоналде</b></td><td>на телефон</td></tr></table>\n<div class=\"callout b\"><b>«‑бали / ‑али»</b> на конце глагола = русское <b>«ли»</b> (косвенный вопрос):\n<b>бугеб‑али</b> «есть ли», <b>хъван бугеб‑али</b> «написано ли». Легко запомнить — созвучно с «ли».\nМожно и <b>бугин-гьечӀин</b> «есть-нет».</div>\n<h3>Слова-связки (вставляй в речь)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">масала</td><td>например</td><td class=\"v\">амма</td><td>но, однако</td></tr>\n<tr><td class=\"v\">ва</td><td>и</td><td class=\"v\">яги</td><td>или</td></tr>\n<tr><td class=\"v\">цинги</td><td>потом, затем</td><td class=\"v\">гьединлъидал</td><td>значит, поэтому</td></tr>\n<tr><td class=\"v\">узухъда</td><td>конечно</td><td class=\"v\">хӀакъикъаталда</td><td>на самом деле</td></tr></table>\n<div class=\"callout b\">Если выучить ~1000 слов, основную грамматику и уметь вот так вставлять\nрусские/английские слова — это уже свободная живая речь (честный B1 и выше). Смешивать языки —\nнормально, это живой «суржик», на котором реально говорят.</div>\n", "words": [{"ru": "делать (универсально)", "av": "гьабизе"}, {"ru": "проверить (заимств.)", "av": "проверизе"}, {"ru": "например", "av": "масала"}, {"ru": "но, однако", "av": "амма"}, {"ru": "и", "av": "ва"}, {"ru": "или", "av": "яги"}, {"ru": "потом, затем", "av": "цинги"}, {"ru": "значит, поэтому", "av": "гьединлъидал"}, {"ru": "конечно", "av": "узухъда"}, {"ru": "на самом деле", "av": "хӀакъикъаталда"}, {"ru": "…ли (косв. вопрос)", "av": "‑бали"}, {"ru": "в документе", "av": "документалда"}], "ex": [{"t": "mcq", "q": "Как оформить русский глагол «проверить» по-аварски (2-й способ)?", "opts": ["проверизе", "проверитьун", "проверский"], "a": 0}, {"t": "say", "q": "Скажи: «Я хочу проверить» (провер‑изе)", "ans": "Дие бокьун буго проверизе"}, {"t": "mcq", "q": "«‑бали» на конце глагола значит…", "opts": ["«ли» (вопрос: есть ли…)", "приказ", "прошедшее время"], "a": 0}, {"t": "mcq", "q": "«в документе» (заимств. слово + падеж) —", "opts": ["документалда", "документlevel", "в документе"], "a": 0}, {"t": "mcq", "q": "«например» по-аварски —", "opts": ["масала", "амма", "яги"], "a": 0}, {"t": "mcq", "q": "Способ 1 вставить слово —", "opts": ["слово + гьабизе («делать»)", "убрать все гласные", "добавить ‑ский"], "a": 0}, {"t": "say", "q": "Скажи «Я хочу погуглить» (гугл‑изе)", "ans": "Дие бокьун буго гуглизе"}], "drill": {"gen": "loan"}, "lvl": "A2"}, {"id": "vforms", "emoji": "🔧", "t": "Все формы глагола", "sub": "Продвинуто: спряжение целиком", "teach": "\n<p class=\"lead\">Один глагол — много форм. Возьмём <b>цӀализе</b> «читать» и посмотрим целиком.\nМеняется только окончание (основа <b>цӀал‑</b> одна):</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">цӀал‑ула</td><td>настоящее — читает</td></tr>\n<tr><td class=\"v\">цӀал‑ана</td><td>прошедшее — читал</td></tr>\n<tr><td class=\"v\">цӀал‑ила</td><td>будущее — прочтёт</td></tr>\n<tr><td class=\"v\">цӀал‑е</td><td>приказ — читай!</td></tr>\n<tr><td class=\"v\">цӀалу‑ла‑ро</td><td>не читает (‑ро)</td></tr>\n<tr><td class=\"v\">цӀали‑чӀо</td><td>не читал (‑чӀо)</td></tr>\n<tr><td class=\"v\">цӀал‑ун</td><td>деепричастие — прочитав</td></tr>\n<tr><td class=\"v\">цӀал‑улеб</td><td>причастие — читающий</td></tr>\n<tr><td class=\"v\">цӀал‑и</td><td>масдар — чтение (имя действия)</td></tr>\n<tr><td class=\"v\">цӀал‑ани</td><td>условное — если прочтёт</td></tr>\n</table>\n<div class=\"callout g\"><b>Инфинитив ‑изе или ‑ине?</b> Большинство глаголов на <b>‑изе</b> (цӀал‑изе, гьаб‑изе),\nно часть — на <b>‑ине</b>: <b>ине</b> «идти», <b>вачӀине</b> «приходить», <b>ретӀине</b> «надевать»,\n<b>бачине</b> «вести». Спрягаются они одинаково, разница только в инфинитиве.</div>\n<div class=\"callout r\"><b>Осторожно, «ложные друзья»!</b> ‑изе и ‑ине могут дать совсем разные слова:\n<b>бахъизе</b> «снимать, вытаскивать» (и «сурат бахъизе» — рисовать / сфотографировать) ≠\n<b>бахъине</b> «вставать». Одна буква — другое слово!</div>\n", "words": [{"ru": "деепричастие: прочитав", "av": "цӀалун"}, {"ru": "причастие: читающий", "av": "цӀалулеб"}, {"ru": "масдар: чтение", "av": "цӀали"}, {"ru": "не читает", "av": "цӀалуларо"}, {"ru": "надевать (‑ине)", "av": "ретӀине"}, {"ru": "вести (‑ине, перех.)", "av": "бачине"}], "ex": [{"t": "mcq", "q": "«цӀалун» — это…", "opts": ["деепричастие: «прочитав»", "приказ", "будущее"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в прошедшее время", "ans": "цӀалана"}, {"t": "mcq", "q": "Инфинитив «приходить» —", "opts": ["вачӀине (на ‑ине)", "вачӀизе", "вачӀула"], "a": 0}, {"t": "mcq", "q": "бахъизе и бахъине —", "opts": ["разные слова (получаться / вставать)", "одно и то же", "опечатка"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в будущее время", "ans": "цӀалила"}, {"t": "mcq", "q": "Масдар (имя действия) от «цӀализе» —", "opts": ["цӀали (чтение)", "цӀале", "цӀалана"], "a": 0}], "drill": {"gen": "vform"}, "lvl": "B1"}, {"id": "cases", "emoji": "📦", "t": "Падежи существительных", "sub": "Продвинуто: кто/кого/где/куда/откуда", "teach": "\n<p class=\"lead\">В аварском ~20 падежей, но система логичная. Возьмём «я» (дун) и «стол».</p>\n<h3>Основные падежи</h3>\n<table class=\"vguide\">\n<tr><td>Абсолютив (кто/что)</td><td class=\"v\">дун</td><td>я</td></tr>\n<tr><td>Эргатив (делаю с предметом) ‑ца</td><td class=\"v\">дица</td><td>я (читаю книгу)</td></tr>\n<tr><td>Генитив (чей) ‑л</td><td class=\"v\">дир</td><td>мой</td></tr>\n<tr><td>Датив (кому) ‑е</td><td class=\"v\">дие</td><td>мне</td></tr>\n</table>\n<div class=\"callout b\"><b>Про эргатив (у Атаева).</b> У имён и людей — почти всегда <b>‑ца</b> (ГӀали‑ца, Том‑ица).\nУ указательных и прилагательных — по классу: I <b>‑с</b> (гьес «он»), II/III <b>‑лъ</b> (гьелъ «она/оно»),\nмн. <b>‑з</b> (гьез «они»). Женский и «вещный» класс тяготеют к <b>‑лъ</b>.</div>\n<h3>Местные падежи (где / куда / откуда)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">столалда</td><td>на столе (где?)</td></tr>\n<tr><td class=\"v\">столалде</td><td>на стол (куда?)</td></tr>\n<tr><td class=\"v\">столалдаса</td><td>со стола (откуда?)</td></tr>\n</table>\n<p>Полная таблица 5 серий (на / у / в среде / под / внутри) — в разделе «Справка → Грамматика».</p>\n", "words": [{"ru": "я (эрг.)", "av": "дица"}, {"ru": "мой", "av": "дир"}, {"ru": "мне", "av": "дие"}, {"ru": "у меня", "av": "дида"}, {"ru": "ко мне", "av": "диде"}, {"ru": "от меня", "av": "дидаса"}, {"ru": "на столе", "av": "столалда"}, {"ru": "на стол", "av": "столалде"}, {"ru": "со стола", "av": "столалдаса"}], "ex": [{"t": "mcq", "q": "«мой» (генитив от «я») —", "opts": ["дир", "дица", "дие"], "a": 0}, {"t": "say", "q": "Скажи «на столе» (где?)", "ans": "столалда"}, {"t": "mcq", "q": "Эргатив (кто делает) от «я» —", "opts": ["дица", "дир", "дун"], "a": 0}, {"t": "say", "q": "Скажи «со стола» (откуда?)", "ans": "столалдаса"}, {"t": "mcq", "q": "Эргатив у имён обычно на —", "opts": ["‑ца (ГӀалица)", "‑е", "‑л"], "a": 0}, {"t": "mcq", "q": "«ко мне» (куда?) —", "opts": ["диде", "дида", "дидаса"], "a": 0}], "drill": {"gen": "casemix"}, "lvl": "B1"}, {"id": "cond", "emoji": "🔀", "t": "Условное наклонение", "sub": "Продвинуто: если… / если бы…", "teach": "\n<p class=\"lead\">«Если» по-аварски — это окончания на глаголе, отдельного слова не нужно.</p>\n<h3>Реальное условие: ‑ни</h3>\n<p>От основы прошедшего (без ‑на) + <b>‑ни</b>:</p>\n<table class=\"vguide\">\n<tr><td>цӀала‑на → цӀала<b class=\"v\">ни</b></td><td>если прочтёт</td></tr>\n<tr><td>вачӀа‑на → вачӀа<b class=\"v\">ни</b></td><td>если придёт</td></tr>\n</table>\n<h3>Отрицательное условие: ‑чӀони</h3>\n<table class=\"vguide\">\n<tr><td>цӀаличӀо → цӀаличӀо<b class=\"v\">ни</b></td><td>если не прочтёт</td></tr>\n</table>\n<h3>Нереальное («если бы»): ‑арабани / ‑ебани</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">букӀарабани</td><td>если бы было</td></tr>\n<tr><td class=\"v\">букӀинчӀебани</td><td>если бы не было</td></tr>\n<tr><td class=\"v\">лъалеб букӀарабани</td><td>если бы знал(а)</td></tr>\n</table>\n<div class=\"callout g\"><b>Пример:</b> «<b>Дица гьикъичӀебани, дида лъачӀоан</b>» — «Если бы я не спросила,\n[я] не узнала бы».</div>\n", "words": [{"ru": "если прочтёт", "av": "цӀалани"}, {"ru": "если придёт", "av": "вачӀани"}, {"ru": "если не прочтёт", "av": "цӀаличӀони"}, {"ru": "если бы было", "av": "букӀарабани"}, {"ru": "если бы не было", "av": "букӀинчӀебани"}, {"ru": "если бы знал(а)", "av": "лъалеб букӀарабани"}], "ex": [{"t": "mcq", "q": "«если прочтёт» —", "opts": ["цӀалани", "цӀалила", "цӀалула"], "a": 0}, {"t": "say", "q": "Скажи «если придёт» (вачӀине)", "ans": "вачӀани"}, {"t": "mcq", "q": "«если бы было» —", "opts": ["букӀарабани", "букӀани", "букӀуна"], "a": 0}, {"t": "mcq", "q": "Отрицательное условие («если не…») — окончание", "opts": ["‑чӀони", "‑ни", "‑ила"], "a": 0}, {"t": "say", "q": "Скажи «если не прочтёт»", "ans": "цӀаличӀони"}, {"t": "mcq", "q": "Реальное условие «если» — окончание", "opts": ["‑ни", "‑ге", "‑ун"], "a": 0}], "drill": {"gen": "cond"}, "lvl": "B1"}, {"id": "converb", "emoji": "🔗", "t": "Деепричастия и связки", "sub": "B2: сделав, чтобы, поскольку, когда…", "teach": "\n<p class=\"lead\">Чтобы связывать части предложения, аварский вешает окончания прямо на глагол —\nполучаются деепричастия и «связки» (соответствуют русским «сделав», «чтобы», «поскольку»…).</p>\n<h3>Деепричастия</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ун / ‑н</td><td>сделав (прош.)</td><td>цӀал<b>ун</b> «прочитав»</td></tr>\n<tr><td class=\"v\">‑го</td><td>делая (наст.)</td><td>цӀалула<b>го</b> «читая»</td></tr>\n</table>\n<h3>Связки (обстоятельства)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑зелъун</td><td>чтобы (цель)</td><td>цӀали<b>зелъун</b> «чтобы прочитать»</td></tr>\n<tr><td class=\"v\">‑лъул</td><td>поскольку (причина)</td><td>буге<b>лъул</b> «поскольку есть»</td></tr>\n<tr><td class=\"v\">‑идал / ‑ндал</td><td>когда</td><td>вачӀи<b>ндал</b> «когда пришёл»</td></tr>\n<tr><td class=\"v\">‑зегӀан</td><td>пока не</td><td>цӀали<b>зегӀан</b> «пока не прочтёт»</td></tr>\n<tr><td class=\"v\">‑ниги</td><td>хотя</td><td>буго<b>ниги</b> «хотя есть»</td></tr>\n<tr><td class=\"v\">‑лде</td><td>до того как</td><td>кквела<b>лде</b> «до того как попало»</td></tr>\n</table>\n<div class=\"callout g\"><b>Пример:</b> «хӀалтӀулареб къо буге<b>лъул</b>, кеп гьабулел ратила» —\n«Поскольку день нерабочий, они, наверное, отдыхают».</div>\n<div class=\"callout b\">Это уже настоящий B2. Не обязательно учить всё сразу — достаточно узнавать\nэти хвостики в чужой речи и постепенно вставлять в свою.</div>\n", "words": [{"ru": "прочитав (деепр.)", "av": "цӀалун"}, {"ru": "читая (деепр.)", "av": "цӀалулаго"}, {"ru": "чтобы прочитать", "av": "цӀализелъун"}, {"ru": "поскольку есть", "av": "бугелъул"}, {"ru": "когда пришёл", "av": "вачӀиндал"}, {"ru": "пока не прочтёт", "av": "цӀализегӀан"}, {"ru": "хотя есть", "av": "бугониги"}, {"ru": "до того как", "av": "кквелалде"}], "ex": [{"t": "mcq", "q": "«прочитав» (деепричастие) —", "opts": ["цӀалун", "цӀале", "цӀалила"], "a": 0}, {"t": "mcq", "q": "«чтобы прочитать» — окончание", "opts": ["‑зелъун", "‑лъул", "‑ниги"], "a": 0}, {"t": "mcq", "q": "«поскольку, так как» — окончание", "opts": ["‑лъул", "‑идал", "‑лде"], "a": 0}, {"t": "say", "q": "Скажи «когда пришёл» (вачӀине → …ндал)", "ans": "вачӀиндал"}, {"t": "mcq", "q": "«хотя» —", "opts": ["‑ниги", "‑зегӀан", "‑го"], "a": 0}, {"t": "mcq", "q": "«читая» (одновременно) —", "opts": ["цӀалулаго", "цӀалун", "цӀалани"], "a": 0}], "drill": {"gen": "converb"}, "lvl": "B2"}, {"id": "local", "emoji": "🧭", "t": "Местные падежи: 5 серий", "sub": "B2: где именно — на/у/в/под/внутри", "teach": "\n<p class=\"lead\">Главная «фишка» аварского: локализация — где именно находится предмет.\n<b>5 серий</b> (на / у / в среде / под / внутри полого), у каждой свой суффикс, и к нему\nдобавляется направление: <b>где</b> (базовое) · <b>куда</b> (+е) · <b>откуда</b> (+а/‑са) · <b>насквозь</b> (+н).</p>\n<table class=\"vguide\">\n<tr class=\"head\"><td>Серия</td><td>где?</td><td>куда?</td><td>откуда?</td></tr>\n<tr><td><b>I</b> на, поверх <span class=\"v\">‑да</span></td><td>гъотӀо<b>да</b> «на дереве»</td><td>стол<b>алде</b></td><td>стол<b>алдаса</b></td></tr>\n<tr><td><b>II</b> у, при <span class=\"v\">‑хъ</span></td><td>къватӀа<b>хъ</b> «на улице»</td><td>…хъе</td><td>…хъа</td></tr>\n<tr><td><b>III</b> в среде <span class=\"v\">‑лъ</span></td><td>ро­су<b>лъ</b> «в селе»</td><td>лъада<b>лъе</b> «в воду»</td><td>ро­су<b>лъа</b> «из села»</td></tr>\n<tr><td><b>IV</b> под <span class=\"v\">‑кь</span></td><td>гъотӀо<b>кь</b> «под деревом»</td><td>гъотӀо<b>кье</b> «под дерево»</td><td>…кьа</td></tr>\n<tr><td><b>V</b> внутри полого <span class=\"v\">‑лъу‑</span></td><td>бочка<b>лъуб</b> «в бочке»</td><td>тумбочка<b>лъуве</b> «в тумбочку»</td><td>…лъуса</td></tr>\n</table>\n<div class=\"callout g\"><b>Как выбрать серию?</b> Смотри, ГДЕ предмет: на поверхности → ‑да, рядом → ‑хъ,\nвнутри вещества/массы → ‑лъ, под → ‑кь, внутри полого (ящик, комната, бочка) → ‑лъу‑.\nПотом добавь направление.</div>\n<div class=\"callout b\">Транслатив (‑н, «сквозь / по»): къватӀа<b>хъан</b> «по улицам». Всего получается\n~20 местных форм, но система простая: серия × направление.</div>\n", "words": [{"ru": "на дереве", "av": "гъотӀода"}, {"ru": "под деревом", "av": "гъотӀокь"}, {"ru": "под дерево", "av": "гъотӀокье"}, {"ru": "на улице", "av": "къватӀахъ"}, {"ru": "по улицам", "av": "къватӀахъан"}, {"ru": "в селе", "av": "росулъ"}, {"ru": "в воду", "av": "лъадалъе"}, {"ru": "в тумбочку", "av": "тумбочкалъуве"}, {"ru": "на горе", "av": "магӀарда"}], "ex": [{"t": "mcq", "q": "«под деревом» (серия «под») —", "opts": ["гъотӀокь", "гъотӀода", "гъотӀохъ"], "a": 0}, {"t": "mcq", "q": "«на дереве» (серия «на») —", "opts": ["гъотӀода", "гъотӀокь", "гъотӀолъ"], "a": 0}, {"t": "say", "q": "Скажи «под дерево» (куда, ‑кье)", "ans": "гъотӀокье"}, {"t": "mcq", "q": "«в воду» (в среду, куда) —", "opts": ["лъадалъе", "лъелъ", "лъадалъа"], "a": 0}, {"t": "mcq", "q": "Серия «внутри полого» (в бочке, в тумбочке) —", "opts": ["‑лъу‑", "‑да", "‑кь"], "a": 0}, {"t": "say", "q": "Скажи «на улице» (у/при, ‑хъ)", "ans": "къватӀахъ"}], "drill": {"gen": "series"}, "lvl": "B2"}], "phrases": {"Приветствие": [{"av": "ВорчӀами!", "ru": "Здравствуй (м.)"}, {"av": "ЙорчӀами!", "ru": "Здравствуй (ж.)"}, {"av": "РорчӀами!", "ru": "Здравствуйте (мн.)"}, {"av": "Ассаламу гӀалайкум!", "ru": "Мир вам! (приветствие)"}, {"av": "ВагӀалайкум салам!", "ru": "И вам мир! (ответ)"}, {"av": "Щиб хӀал бугеб?", "ru": "Как дела?"}, {"av": "ЛъикӀ буго", "ru": "Хорошо"}, {"av": "Баркала", "ru": "Спасибо"}, {"av": "Къо-мех лъикӀ!", "ru": "До свидания!"}, {"av": "Сордо лъикӀ!", "ru": "Спокойной ночи!"}], "Знакомство": [{"av": "Дуда цӀар щиб?", "ru": "Как тебя зовут?"}, {"av": "Дир цӀар … буго", "ru": "Меня зовут …"}, {"av": "Дун … вуго", "ru": "Я … (м.)"}, {"av": "Дун … йиго", "ru": "Я … (ж.)"}, {"av": "Дур чан сон бугеб?", "ru": "Сколько тебе лет?"}, {"av": "Дир … сон буго", "ru": "Мне … лет"}, {"av": "Мун киса вугев?", "ru": "Ты откуда? (м.)"}, {"av": "Дун … росулъа вуго", "ru": "Я из села … (м.)"}], "В разговоре": [{"av": "Гьо", "ru": "Да"}, {"av": "ГьечӀо", "ru": "Нет"}, {"av": "Кин?", "ru": "Как?"}, {"av": "Щиб?", "ru": "Что?"}, {"av": "Киб?", "ru": "Где?"}, {"av": "Щай?", "ru": "Почему?"}, {"av": "Дида лъалеб гьечӀо", "ru": "Я не знаю"}, {"av": "Дида бичӀчӀуларо", "ru": "Я не понимаю"}, {"av": "Цинги абе", "ru": "Повтори ещё раз"}, {"av": "ЛъикӀ", "ru": "Хорошо / ладно (ОК)"}], "Каждый день": [{"av": "Дие … бокьун буго", "ru": "Я хочу …"}, {"av": "Дида … кӀола", "ru": "Я умею …"}, {"av": "Балагье!", "ru": "Смотри!"}, {"av": "Босе!", "ru": "Возьми!"}, {"av": "Квана!", "ru": "Кушай!"}, {"av": "ВачӀа!", "ru": "Иди сюда! (м.)"}, {"av": "Дун ине", "ru": "Я иду"}, {"av": "Дун вачӀана", "ru": "Я пришёл"}]}, "verbs": [{"inf": "цӀализе", "ru": "читать", "presRu": "читаю", "pastRu": "прочитал(а)", "obj": "тӀехь", "objRu": "книгу", "pres": "цӀалула", "fut": "цӀалила", "futRu": "прочитаю", "past": "цӀалана", "imp": "цӀале", "conv": "цӀалун", "part": "цӀалулеб", "tr": true}, {"inf": "хъвазе", "ru": "писать", "presRu": "пишу", "pastRu": "написал(а)", "obj": "кагъат", "objRu": "письмо", "pres": "хъвала", "past": "хъвана", "imp": "хъвай", "tr": true}, {"inf": "кваназе", "ru": "кушать", "presRu": "ем", "pastRu": "поел(а)", "obj": "чед", "objRu": "хлеб", "pres": "кванала", "past": "кванана", "imp": "кванай", "tr": true}, {"inf": "гьекъезе", "ru": "пить", "presRu": "пью", "pastRu": "выпил(а)", "obj": "лъим", "objRu": "воду", "pres": "гьекъола", "fut": "гьекъела", "futRu": "выпью", "past": "гьекъана", "imp": "гьекъе", "tr": true}, {"inf": "балагьизе", "ru": "смотреть", "presRu": "смотрю", "pastRu": "посмотрел(а)", "obj": "", "objRu": "", "pres": "балагьула", "fut": "балагьила", "futRu": "посмотрю", "past": "балагьана", "imp": "балагье", "tr": false}, {"inf": "босизе", "ru": "брать", "presRu": "беру", "pastRu": "взял(а)", "obj": "тӀехь", "objRu": "книгу", "pres": "босула", "fut": "босила", "futRu": "возьму", "past": "босана", "imp": "босе", "tr": true}], "cases": {"pron": [{"ru": "«я» (дун)", "forms": [["я (кто?)", "дун"], ["я (эрг.)", "дица"], ["мой", "дир"], ["мне", "дие"], ["у меня", "дида"], ["ко мне", "диде"], ["от меня", "дидаса"]]}, {"ru": "«ты» (мун)", "forms": [["ты (кто?)", "мун"], ["ты (эрг.)", "дуца"], ["твой", "дур"], ["тебе", "дуе"], ["у тебя", "дуда"], ["к тебе", "дуде"], ["от тебя", "дудаса"]]}], "local": [{"ru": "стол", "forms": [["на столе (где?)", "столалда"], ["на стол (куда?)", "столалде"], ["со стола (откуда?)", "столалдаса"]]}, {"ru": "село (росу)", "forms": [["в селе (где?)", "росулъ"], ["в село (куда?)", "росулъе"], ["из села (откуда?)", "росулъа"]]}]}, "conds": [{"ru": "если прочтёт", "av": "цӀалани"}, {"ru": "если напишет", "av": "хъвани"}, {"ru": "если придёт", "av": "вачӀани"}, {"ru": "если не прочтёт", "av": "цӀаличӀони"}, {"ru": "если бы было", "av": "букӀарабани"}, {"ru": "если бы не было", "av": "букӀинчӀебани"}, {"ru": "если бы знал(а)", "av": "лъалеб букӀарабани"}], "series": [{"ru": "на дереве (на, ‑да)", "av": "гъотӀода"}, {"ru": "под деревом (под, ‑кь)", "av": "гъотӀокь"}, {"ru": "под дерево (куда, ‑кье)", "av": "гъотӀокье"}, {"ru": "на улице (у/при, ‑хъ)", "av": "къватӀахъ"}, {"ru": "по улицам (насквозь, ‑хъан)", "av": "къватӀахъан"}, {"ru": "в селе (в среде, ‑лъ)", "av": "росулъ"}, {"ru": "из села (откуда, ‑лъа)", "av": "росулъа"}, {"ru": "в воду (куда, ‑лъе)", "av": "лъадалъе"}, {"ru": "на столе (на, ‑да)", "av": "столалда"}, {"ru": "со стола (откуда, ‑даса)", "av": "столалдаса"}, {"ru": "на горе (на, ‑да)", "av": "магӀарда"}, {"ru": "в тумбочку (внутрь, ‑лъуве)", "av": "тумбочкалъуве"}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('appdata').textContent);

/* ---------------- state ---------------- */
const S = JSON.parse(localStorage.getItem('avk_state')||'{}');
if(S.ipa===undefined)S.ipa=true; if(!S.gender)S.gender='m'; if(!S.tab)S.tab='home';
function save(){localStorage.setItem('avk_state',JSON.stringify(S));}
const PROG = JSON.parse(localStorage.getItem('avk_prog')||'{}');
if(!PROG.lessons)PROG.lessons={}; if(!PROG.drill)PROG.drill={a:0,c:0,byKey:{}};
function saveProg(){localStorage.setItem('avk_prog',JSON.stringify(PROG));}
const SRS = JSON.parse(localStorage.getItem('avk_srs')||'{}');
function saveSrs(){localStorage.setItem('avk_srs',JSON.stringify(SRS));}

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* class agreement */
const CM={I:'в',II:'й',III:'б',PL:'р'};
const COP={I:'вуго',II:'йиго',III:'буго',PL:'руго'};
const DEM={I:'дов',II:'дой',III:'доб'};          // «тот»
function cop(cls){return COP[cls];}
function selfCls(){return S.gender==='f'?'II':'I';}   // класс говорящего о себе
function agreeAdj(adjB,cls){return adjB.slice(0,-1)+ (cls==='I'?'в':cls==='II'?'й':cls==='III'?'б':'л');}
const P=DATA.pools;   // {I:[{av,ru}],II,III,adj}

/* ---- Cyrillic -> IPA transliterator (built from the alphabet's own IPA map) ---- */
const nk=s=>s.toLowerCase().replace(/ӏ/g,'Ӏ');   // lowercase + canonical palochka (U+04C0)
const IPA=(()=>{
  const m={};
  const clean=ipa=>ipa.split('/')[0].trim();      // "e / je" -> "e"
  const put=(L,ipa)=>{L.split(' ').forEach(p=>{if(p)m[nk(p)]=clean(ipa);});};
  DATA.special.forEach(x=>put(x.L,x.ipa));
  DATA.alphabet.forEach(x=>put(x.L,x.ipa));
  Object.assign(m,{'е':'e','э':'e','я':'ja','ю':'ju','ё':'jo','ы':'ɨ','ь':'ʲ','ф':'f','ъ':'ʔ'});
  return m;
})();
function translit(word){
  if(!word)return '';
  const s=word.replace(/ӏ/g,'Ӏ'); let out=''; let i=0;
  while(i<s.length){
    const two=nk(s.substr(i,2));
    const one=nk(s[i]);
    if(/\s/.test(s[i])){out+=' ';i++;continue;}
    if(/[.,!?;:—…()«»"'-]/.test(s[i])){out+=s[i];i++;continue;}
    if(IPA[two]){out+=IPA[two];i+=2;}
    else if(IPA[one]){out+=IPA[one];i+=1;}
    else {out+=s[i];i++;}
  }
  return out;
}
// pronunciation span (hidden when the "Произношение" toggle is off, via .hide-ipa)
function pron(av){return `<span class="ipa">[${esc(translit(av))}]</span>`;}

/* ---------------- audio ---------------- */
let _audio=null;
function playAudio(file,btn){
  if(!file)return;
  try{ if(_audio){_audio.pause();} _audio=new Audio(file); _audio.play().catch(()=>{});

/* ---------------- progress ---------------- */
function lp(id){return PROG.lessons[id]||(PROG.lessons[id]={seen:false,done:false,a:0,c:0,miss:0});}
function recLesson(id,ok){const l=lp(id);l.seen=true;l.a++;ok?l.c++:l.miss++;recDay();saveProg();}
function recDrill(key,label,ok){const d=PROG.drill;d.a++;if(ok)d.c++;
  const e=d.byKey[key]||(d.byKey[key]={a:0,c:0,miss:0,label});e.label=label;e.a++;e[ok?'c':'miss']++;recDay();saveProg();}
/* daily streak + goal */
const DAILY_GOAL=20;
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function recDay(){if(!PROG.days)PROG.days={};const t=dkey(new Date());PROG.days[t]=(PROG.days[t]||0)+1;}
function todayCount(){return (PROG.days&&PROG.days[dkey(new Date())])||0;}
function streak(){if(!PROG.days)return 0;let s=0;const d=new Date();
  if(!PROG.days[dkey(d)])d.setDate(d.getDate()-1);        // grace: today not yet done
  while(PROG.days[dkey(d)]){s++;d.setDate(d.getDate()-1);}
  return s;}
function lessonsDone(){return Object.values(PROG.lessons).filter(l=>l.done).length;}
function acc(){const d=PROG.drill;return d.a?Math.round(100*d.c/d.a):0;}

/* wordbank of every taught item (for cards) */
function allVocab(){
  const out=[]; const seen=new Set();
  DATA.themes.forEach(t=>t.words.forEach(w=>{const k=w.av+'|'+w.ru;if(!seen.has(k)){seen.add(k);out.push({av:w.av,ru:w.ru,tag:t.title});}}));
  DATA.lessons.forEach(l=>(l.words||[]).forEach(w=>{const k=w.av+'|'+w.ru;if(!seen.has(k)){seen.add(k);out.push({av:w.av,ru:w.ru,tag:l.t});}}));
  return out;
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function ruObj(v){return v.ru==='читать'?'книгу':v.ru==='писать'?'письмо':v.ru==='есть'?'хлеб':v.ru==='пить'?'воду':'';}
function plural(ru,num){return ru;} // keep russian noun simple in gloss

function genFor(spec){
  if(!spec) return GEN.vocab(allVocab());
  if(spec.gen==='vocab') return GEN.vocab(spec.words&&spec.words.length?spec.words:allVocab());
  const f=GEN[spec.gen]; return f?f():GEN.vocab(allVocab());
}

function drillMount(id,spec,key,label){drills[id]={spec,key:key||'G:'+(spec&&spec.gen||'mix'),label:label||'Тренировка',cur:null,shown:false,typing:false,sess:{a:0,c:0}};drillNew(id);}
function normAns(s){return (s||'').toLowerCase().replace(/ӏ/g,'').replace(/ё/g,'е').replace(/[^а-я]/g,'');}
function drillMode(id,typing){const d=drills[id];if(!d)return;d.typing=typing;
  $(id+'_mSay').classList.toggle('on',!typing);$(id+'_mType').classList.toggle('on',typing);
  $(id+'_type').style.display=typing?'':'none';$(id+'_reveal').style.display=typing?'none':'';
  drillNew(id);}
function drillNew(id){const d=drills[id];d.cur=genFor(d.spec);d.shown=false;
  const inp=$(id+'_in');if(inp)inp.value='';const fb=$(id+'_fb');if(fb){fb.textContent='';fb.className='feedback';}
  drillRender(id);if(inp&&d.typing)inp.focus();}
function drillRender(id){const d=drills[id],c=d.cur;
  $(id+'_stage').innerHTML=`<div class="tasktag">${esc(c.tag||'')}</div>
    <div class="prompt">${esc(c.ru)}</div>`+
    (d.shown?`<div class="ans">${esc(c.av)}</div><div class="ipa" style="font-size:.95rem">[${esc(translit(c.av))}]</div>`+(c.audio?`<div><button class="play" onclick="playAudio('${c.audio}',this)">▶</button></div>`:''):'');
  const show=$(id+'_show');if(show)show.style.display=d.shown?'none':'';
  $(id+'_grade').classList.toggle('on',d.shown&&!d.typing);
  $(id+'_sess').textContent=d.sess.a+' сделано · '+(d.sess.a?Math.round(100*d.sess.c/d.sess.a):0)+'% верно';
}
function drillShow(id){drills[id].shown=true;drillRender(id);if(drills[id].cur.audio)playAudio(drills[id].cur.audio);
  const g=$(id+'_grade'); if(g&&g.scrollIntoView)setTimeout(()=>g.scrollIntoView({behavior:'smooth',block:'center'}),30);}
function drillGrade(id,ok){const d=drills[id];d.sess.a++;if(ok)d.sess.c++;recDrill(d.key,d.label,!!ok);drillNew(id);}
function drillCheck(id){const d=drills[id];const inp=$(id+'_in');const val=inp?inp.value:'';
  if(!val.trim())return;
  const ok=normAns(val)===normAns(d.cur.av);
  d.shown=true;d.sess.a++;if(ok)d.sess.c++;recDrill(d.key,d.label,ok);
  drillRender(id);
  const fb=$(id+'_fb');if(fb){fb.textContent=ok?'Верно! ✓ '+d.cur.av:'Не совсем. Правильно: '+d.cur.av;fb.className='feedback '+(ok?'ok':'no');}
}

/* ---- CARDS (SRS) ---- */
let deck=[],ci=0,flipped=false,cmode='all';
function everyWord(){
  const out=allVocab(); const seen=new Set(out.map(w=>w.av+'|'+w.ru));
  (DATA.freq||[]).forEach(L=>L.words.forEach(w=>{const key=w.av+'|'+w.ru;
    if(!seen.has(key)){seen.add(key);out.push({av:w.av,ru:w.ru,tag:L.title});}}));
  return out;
}
function renderCards(){
  const freqChips=(DATA.freq||[]).map(L=>`<span class="chip b ${cmode==='freq:'+L.id?'on':''}" onclick="cmSet('freq:${L.id}')">${esc(L.title)} (${L.words.length})</span>`).join('');
  $('v-cards').innerHTML=`<h2>Картал · Карточки</h2>
    <p class="lead">По частотности (реальный аварский, без русских заимствований) или по темам.</p>
    <div class="chips">
      <span class="chip ${cmode==='all'?'on':''}" onclick="cmSet('all')">Все слова</span>
      ${freqChips}
    </div>
    <div class="chips">
      ${DATA.themes.map(t=>`<span class="chip ${cmode===t.id?'on':''}" onclick="cmSet('${t.id}')">${t.emoji} ${esc(t.title)}</span>`).join('')}
    </div>
    <div id="cardbox"></div>`;
  buildDeck();showCard();
}
function cmSet(m){cmode=m;renderCards();}
function buildDeck(){
  let src;
  if(cmode==='all') src=everyWord();
  else if(cmode.startsWith('freq:')){const L=(DATA.freq||[]).find(x=>'freq:'+x.id===cmode);src=(L?L.words:[]).map(w=>({...w,tag:L?L.title:''}));}
  else src=(DATA.themes.find(t=>t.id===cmode)?.words||[]).map(w=>({...w,tag:cmode}));
  // spaced: prioritise low box
  deck=shuffle(src).sort((a,b)=>(SRS[a.av+'|'+a.ru]||0)-(SRS[b.av+'|'+b.ru]||0));
  ci=0;flipped=false;
}
function showCard(){
  const box=$('cardbox');if(!deck.length){box.innerHTML='<div class="card">Нет карточек</div>';return;}
  const c=deck[ci%deck.length];const key=c.av+'|'+c.ru;const box_=SRS[key]||0;
  box.innerHTML=`<div class="note" style="text-align:center">${(ci%deck.length)+1} / ${deck.length} · уровень ${box_}</div>
   <div class="flash" onclick="flipCard()">
     <div class="kind">${flipped?'аварский':'русский'}</div>
     <div class="big">${esc(flipped?c.av:c.ru)}</div>
     ${flipped?`<div class="ipa" style="font-size:1rem">[${esc(translit(c.av))}]</div><div class="az">${esc(c.tag||'')}</div>`:'<div class="tap">нажми, чтобы перевернуть</div>'}
   </div>
   ${flipped?`<div class="btnrow">
     <button class="btn blk" onclick="gradeCard(0)">Снова</button>
     <button class="btn" onclick="gradeCard(1)">Норм</button>
     <button class="btn grn" onclick="gradeCard(2)">Легко</button></div>`:
     `<div class="btnrow"><button class="btn blue" onclick="flipCard()">Перевернуть</button></div>`}`;
}
function flipCard(){flipped=!flipped;showCard();}
function gradeCard(g){const c=deck[ci%deck.length];const key=c.av+'|'+c.ru;
  let b=SRS[key]||0; b=g===0?Math.max(0,b-1):g===2?Math.min(5,b+2):Math.min(5,b+1);
  SRS[key]=b;saveSrs(); recDay();saveProg(); ci++;flipped=false;showCard();}

   <table class="vguide">

    <tr><td class="v">‑чӀони</td><td>«если не сделает»</td><td>цӀаличӀо‑ни</td></tr>
    <tr><td class="v">‑арабани</td><td>«если бы было»</td><td>букӀ‑арабани</td></tr>
    <tr><td class="v">‑ебани (‑чӀ…)</td><td>«если бы не было»</td><td>букӀинчӀ‑ебани</td></tr></table></details>
  <div class="callout b"><b>Инфинитив ‑изе или ‑ине.</b> Большинство глаголов на <b>‑изе</b>; часть — на <b>‑ине</b>
    (ине, вачӀине, ретӀине, бачине). Спрягаются одинаково. Но не путай: <b>бахъизе</b> «получаться» ≠
    <b>бахъине</b> «вставать»!</div>
  <div class="callout g"><b>Эргатив подробно (Атаев).</b> Имена и люди → <b>‑ца</b> (ГӀали‑ца, Том‑ица).
    Указательные и прилагательные — по классу косвенной основы: I <b>‑с</b> (гьес «он»),
    II/III <b>‑лъ</b> (гьелъ «она/оно»), мн. <b>‑з</b> (гьез «они»). Женский и «вещный» класс тяготеют к ‑лъ.</div>
  <div class="callout b"><b>Глагол «ине» (идти)</b> — без классного показателя, одинаков для всех:
    Дун ине, Дой ине. А «приходить» — с показателем: вачӀине / йачӀине / бачӀине.</div>`;
}

/* ---------------- install / platform ---------------- */
function platform(){
  const ua=(navigator.userAgent||'');
  if(/iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) return 'ios';
  if(/android/i.test(ua)) return 'android';
  return 'desktop';
}
function isStandalone(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
}
let deferredPrompt=null;
if(window.addEventListener) window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const b=$('installBtn'); if(b)b.style.display='';});
function doInstall(){ if(deferredPrompt){deferredPrompt.prompt();
  if(deferredPrompt.userChoice)deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderHome();}); } }
function installHTML(){
  if(isStandalone()) return '';
  const p=platform();
  if(p==='ios') return `<div class="callout b" style="text-align:left"><b>📲 Установить как приложение (iPhone / iPad):</b>
    <div style="margin-top:4px">1. Нажми <b>Поделиться</b> <span style="font-size:1.1em">􀈂</span> (квадрат со стрелкой ⬆️, внизу Safari).<br>
    2. Пролистай и выбери <b>«На экран «Домой»»</b>.<br>
    3. Нажми <b>«Добавить»</b> — иконка появится на рабочем столе!</div></div>`;
  if(p==='android') return `<div class="callout b" style="text-align:left"><b>📲 Установить как приложение (Android):</b>
    <div style="margin-top:4px">Нажми кнопку ниже, либо меню <b>⋮</b> в Chrome → <b>«Установить приложение»</b> (или «Добавить на главный экран»).</div>
    <button class="btn grn" id="installBtn" style="margin-top:8px;display:${deferredPrompt?'':'none'}" onclick="doInstall()">📲 Установить</button></div>`;
  return `<div class="callout b" style="text-align:left"><b>📲 Установить на компьютер:</b>
    <div style="margin-top:4px">Нажми значок установки <b>⊕</b> в адресной строке браузера (или меню → «Установить приложение…»).</div>
    <button class="btn grn" id="installBtn" style="margin-top:8px;display:${deferredPrompt?'':'none'}" onclick="doInstall()">📲 Установить</button></div>`;
}

/* ---------------- onboarding ---------------- */
function maybeOnboard(){
  if(S.onboarded)return;
  const o=document.createElement('div'); o.id='onb';
  o.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(8,11,17,.92);display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto';
  o.innerHTML=`<div class="card" style="max-width:380px;text-align:center;margin:auto">
    <div style="font-size:2.4rem">🏔️</div>
    <h2>ВорчӀами! Добро пожаловать</h2>
    <p class="lead">Это курс аварского для русскоговорящих. Ты заговоришь с первого урока.</p>
    <p class="lead">Курс подстраивается под тебя: когда говоришь <b>о себе</b>, окончания зависят от того,
      парень ты (класс I «<b>в</b>»: Дун вуго) или девушка (класс II «<b>й</b>»: Дун йиго).</p>
    <div class="btnrow" style="margin-top:6px">
      <button class="btn" onclick="pickGender('m')">♂ Я парень</button>
      <button class="btn blue" onclick="pickGender('f')">♀ Я девушка</button>
    </div>
    ${installHTML()}
    <p class="note" style="margin-top:10px">Пол можно поменять кнопкой «Я» вверху справа.
      Кнопка «Произн.» покажет произношение [IPA] у всех слов.</p></div>`;
  document.body.appendChild(o);
}
function pickGender(g){S.gender=g;S.onboarded=true;save();applyToggles();const o=$('onb');if(o&&o.remove)o.remove();renderAll();}

/* ---------------- boot ---------------- */
applyToggles();renderAll();go(S.tab);maybeOnboard();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
