<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Аварский за час — говорим сразу</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#10161f;--bg2:#161f2c;--card:#1a2433;--card2:#212d3f;
  --ink:#eef4fb;--muted:#93a4bd;--line:#2b384c;
  --red:#ef5466;--grn:#33c67d;--gold:#f3b13a;--blue:#57a8ff;--purp:#a78bfa;
  --av:#ffffff;--ipa:#8fe3b0;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5;padding-bottom:92px}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h2{font-size:1.25rem}h3{font-size:1.02rem;color:var(--gold)}
p{margin:.5em 0}small,.note{color:var(--muted);font-size:.82rem}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:rgba(16,22,31,.86);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:1.6rem;line-height:1}
.brand b{font-size:.98rem}.brand small{display:block;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.toggles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:.72rem;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:5px 9px;cursor:pointer;user-select:none;white-space:nowrap}
.tg b{color:var(--ink)}.tg.on{border-color:var(--grn)}.tg.on b{color:var(--ipa)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(19,26,38,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:.6rem;
  padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav.tabs .ic{font-size:1.15rem;line-height:1}
nav.tabs button.on{color:var(--ink);position:relative}
nav.tabs button.on::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:3px;background:var(--red)}

section.view{display:none;padding:16px 0 10px}
section.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.av{color:var(--av);font-weight:600}
.ipa{color:var(--ipa);font-style:italic;font-size:.9rem}
.az{color:var(--muted);font-size:.85rem}
.hide-ipa .ipa{display:none!important}
.vguide{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
.vguide td{border:1px solid var(--line);padding:6px 9px;vertical-align:middle}
.vguide .v{color:var(--gold);font-weight:700}
.arabtbl{font-size:.82rem}
.arabtbl td{padding:5px 7px}
.arabtbl td[lang="ar"]{color:var(--gold);white-space:nowrap;text-align:right}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin:12px 0}
.card.tight{padding:11px 13px}.card h3:first-child{margin-top:0}
.hd{display:flex;align-items:center;gap:8px;margin:22px 0 6px}
.hd .n{font-size:.72rem;color:var(--bg);background:var(--gold);border-radius:6px;padding:2px 7px;font-weight:700}
.lead{color:var(--muted);font-size:.94rem;margin:.2em 0 .8em}

.rowlist{display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);padding:9px 12px}
.row .l{min-width:0}.row .ru{font-size:.9rem}.row .ipa{font-size:.8rem}
.row .av{font-size:1.2rem;text-align:right}
.row.head{background:var(--card2);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:.8rem;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.g.on{background:var(--grn);border-color:var(--grn)}
.chip.b.on{background:var(--blue);border-color:var(--blue);color:#04203f}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--red);color:#fff;
  border:none;border-radius:12px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.grn{background:var(--grn);color:#052}.btn.gold{background:var(--gold);color:#20160a}
.btn.blk{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--blue);color:#04203f}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:110px}
.btn.sm{padding:8px 12px;font-size:.82rem;border-radius:10px}
.play{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--blue);color:#04203f;border:none;font-size:.95rem;cursor:pointer;flex:none}
.play:active{transform:scale(.9)}.play.off{background:var(--card2);color:var(--muted);cursor:default}

.callout{border-left:3px solid var(--line);background:var(--card2);border-radius:0 10px 10px 0;padding:9px 12px;margin:10px 0;font-size:.9rem}
.callout.g{border-color:var(--grn)}.callout.b{border-color:var(--blue)}.callout.r{border-color:var(--red)}

.prog{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--blue));width:0}
.tiles{display:flex;gap:8px;margin:10px 0}
.tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.4rem;color:var(--gold)}.tile small{font-size:.66rem}

.lesson{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin:8px 0;cursor:pointer}
.lesson .badge{width:34px;height:34px;border-radius:9px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:1.1rem;flex:none}
.lesson.done .badge{background:var(--grn);color:#052}.lesson.started .badge{background:var(--gold);color:#20160a}
.lesson .lt{flex:1;min-width:0}.lesson .lt b{font-size:.98rem}.lesson .lt small{display:block;color:var(--muted);font-size:.76rem}
.lesson .arrow{color:var(--muted)}
.back{color:var(--muted);cursor:pointer;font-size:.85rem;display:inline-block;margin:2px 0 6px}

.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 15px;margin:10px 0;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stage .tasktag{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stage .prompt{font-size:1.35rem;font-weight:600}
.stage .ans{font-size:1.5rem;color:var(--ipa)}
.stage .ansru{color:var(--muted);font-size:.95rem}
.grade{display:none;gap:8px;margin-top:4px}.grade.on{display:flex}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 14px;margin:6px 0;font-size:1rem;cursor:pointer;font-family:inherit}
.opt.correct{background:var(--grn);color:#052;border-color:var(--grn)}
.opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.feedback{margin:6px 0;font-weight:600}.feedback.ok{color:var(--grn)}.feedback.no{color:var(--red)}

.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 16px;margin:10px 0;text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}
.flash .kind{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.flash .big{font-size:1.9rem;font-weight:700}
.flash .tap{color:var(--muted);font-size:.8rem;margin-top:6px}
.flash .divider{border-top:1px dashed var(--line);margin:10px 0 4px;padding-top:10px}

input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0}
summary{cursor:pointer;padding:8px 0;font-weight:600}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;-webkit-overflow-scrolling:touch}
.subtabs button{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;font-family:inherit}
.subtabs button.on{background:var(--blue);color:#04203f;border-color:var(--blue)}
.letter{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}
.letter .big{font-size:1.5rem;font-weight:700;min-width:56px}
.letter .li{flex:1;min-width:0}.letter .li .ipa{font-family:ui-monospace,monospace}
.letter .ex{color:var(--muted);font-size:.82rem}
.hdrback{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  width:34px;height:34px;font-size:1.4rem;line-height:1;cursor:pointer;flex:none;font-family:inherit;padding:0}
.hdrback:active{transform:scale(.94)}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:44px;height:44px;
  border-radius:50%;background:var(--blue);color:#04203f;border:none;font-size:1.3rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.fab.show{display:flex}.fab:active{transform:scale(.9)}
</style>
</head>

  <div class="logo">🏔️</div>
  <div class="brand"><b>Аварский за час</b><small>Магӏарул мацӀ · для русскоговорящих</small></div>

</div></header>

<main class="wrap">

  <section class="view" id="v-lessons"></section>
  <section class="view" id="v-drill"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-ref"></section>

  <button data-v="ref" onclick="go('ref')"><span class="ic">📚</span>Справка</button>
</nav>

 в горле и резко выходит. Это не отдельная буква, а знак «резкого» звука.</div>\n<h3>Гласные</h3><p>Их всего пять: <b>а, е, и, о, у</b> (и «э»). Читаются чётко и коротко.</p>\n<h3>Особые согласные</h3>\n<p>Смотри таблицу ниже (вкладка «Алфавит» в справочнике всегда под рукой). Каждый звук —\nс примером-словом. Слушай и повторяй вслух.</p>\n<div class=\"callout g\"><b>Гортанные:</b> гӀ, хӀ, гъ, хъ, къ произносятся глубоко в горле —\nэто нормально, что сначала непривычно. Слушай образец и подражай.</div>\n<div class=\"callout b\"><b>Про «л»:</b> аварское <b>л</b> мягче русского твёрдого «л» — ближе к «ль».\nНапример, <b>гьабила</b> звучит почти как «гьаби<b>ля</b>». (Не путай с «лъ» — это совсем другой звук:\nглухое «л» без голоса, воздух уходит по бокам языка.)</div>\n<div class=\"callout b\"><b>ш и щ.</b> В аварском есть и <b>ш</b>, и <b>щ</b> (долгое мягкое «щ», как в «щука»). В арабизмах\nарабское <b>ش</b> обычно звучит как <b>щ</b>: «поэт» пишут и <b>шагӀир</b>, и <b>щагӀир</b>, «стихи» — <b>шигӀру</b>/<b>щигӀру</b>,\nно произносят с <b>щ</b>.</div>\n", "words": [], "ex": [{"t": "mcq", "q": "Что означает палочка «Ӏ» после буквы (кӀ, тӀ, цӀ)?", "opts": ["Резкий «щелчок» — смычка в горле", "Долгий звук", "Ударение"], "a": 0}, {"t": "mcq", "q": "Сколько гласных в аварском?", "opts": ["Пять (а,е,и,о,у)", "Десять", "Три"], "a": 0}, {"t": "mcq", "q": "Звук «лъ» — это…", "opts": ["Глухое «л» без голоса, воздух по бокам", "Мягкое ль", "Как русское л"], "a": 0}, {"t": "mcq", "q": "Звук «гӀ» (как арабский ъайн) произносится…", "opts": ["Глубоко в горле, с напряжением", "Губами", "Кончиком языка"], "a": 0}, {"t": "mcq", "q": "Чем «кӀ» отличается от «к»?", "opts": ["«кӀ» — резкий, со щелчком в горле", "Ничем", "«кӀ» — длиннее"], "a": 0}, {"t": "mcq", "q": "«хъ» — это…", "opts": ["Глубокое хриплое «х» из горла", "Мягкое х", "Обычное русское х"], "a": 0}, {"t": "say", "q": "Нажми ▶ у буквы «гӀ» в справочнике (вкладка «Алфавит») и повтори звук.", "ans": "гӀеч — яблоко (там этот н"], "a": 2}, {"t": "mcq", "q": "Как сказать «мы (без тебя)»?", "opts": ["ниж", "вацал", "дун"], "a": 0}, {"t": "mcq", "q": "Как сказать «мы (с тобой)»?", "opts": ["микьго", "нилъ", "ясалъ"], "a": 1}, {"t": "mcq", "q": "Как сказать «вы»?", "opts": ["ищ", "гьой", "нуж"], "a": 2}, {"t": "mcq", "q": "Как сказать «он (тот)»?", "opts": ["дов", "гӀеч", "къо"], "a": 0}], "drill": {"gen": "copula"}, "lvl": "A1"}, {"id": "plur", "emoji": "👥", "t": "Множественное число", "sub": "дом → дома: ‑ал / ‑ял / ‑заби", "teach": "\n<p class=\"lead\">Множественное число образуется суффиксами. Самые частые — <b>‑ал</b> (после согласной)\nи <b>‑ял</b> (после гласной).</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ал</td><td>после согласной</td><td>вас→вас<b>ал</b> «мальчики» · вац→вац<b>ал</b> «братья» · яс→яс<b>ал</b> «девочки»</td></tr>\n<tr><td class=\"v\">‑ял</td><td>после гласной</td><td>чу→чу<b>ял</b> «лошади»</td></tr>\n<tr><td class=\"v\">‑заби</td><td>люди, профессии, родня</td><td>мугӀалим→мугӀалим<b>заби</b> «учителя» · гьудул→гьудул<b>заби</b> «друзья»</td></tr>\n<tr><td class=\"v\">‑зал</td><td>часть вещей</td><td>рукъ→рукъ<b>зал</b> «дома»</td></tr>\n</table>\n<div class=\"callout b\"><b>Особые (запомнить):</b> чи→<b>чагӀи</b> «люди», эбел→<b>улбул</b> «матери»,\nгӀака→<b>гӀачи</b> «коровы», бетӀер→<b>бутӀрул</b> «головы».</div>\n<div class=\"callout g\">Со множественным «есть» — <b>руго</b>, классный показатель — <b>р</b>:\n«Дол васал <b>руго</b>» — «Это мальчики».</div>\n", "words": [{"ru": "мальчики", "av": "васал"}, {"ru": "братья", "av": "вацал"}, {"ru": "девочки", "av": "ясал", "forms": ["ясал", "ясаз", "ясазул"]}, {"ru": "лошади", "av": "чуял"}, {"ru": "учителя", "av": "мугӀалимзаби"}, {"ru": "друзья", "av": "гьудулзаби"}, {"ru": "дома", "av": "рукъзал", "forms": ["рукъзал", "рукъзабаз", "рукъзабаца", "рукъзабазул"], "ex": {"av": "рукъзал разе", "ru": "построить дом, здание"}, "alts": [{"av": "рукъ", "ex": {"av": "тӀуцаб рукъ", "ru": "низкая комната"}}, {"av": "мина", "ex": {"av": "мина базе", "ru": "(по)строить дом, жилище"}}]}, {"ru": "люди", "av": "чагӀи", "forms": ["чагӀи", "чагӀаз", "чагӀазул"]}, {"ru": "матери", "av": "улбул", "forms": ["улбул", "улбуз", "улбузул"]}], "ex": [{"t": "mcq", "q": "«мальчики» (вас + …) —", "opts": ["васал", "васзаби", "васял"], "a": 0}, {"t": "mcq", "q": "После гласной (чу «лошадь») — окончание", "opts": ["‑ял (чуял)", "‑ал", "‑зал"], "a": 0}, {"t": "mcq", "q": "«учителя» (мугӀалим) —", "opts": ["мугӀалимзаби", "мугӀалимал", "мугӀалимял"], "a": 0}, {"t": "say", "q": "Скажи «люди» (мн. от чи)", "ans": "чагӀи"}, {"t": "mcq", "q": "Как сказать «мальчики»?", "opts": ["бакъ", "васал", "гордо"], "a": 1}, {"t": "mcq", "q": "Как сказать «братья»?", "opts": ["гьанже", "баракат", "вацал"], "a": 2}, {"t": "mcq", "q": "Как сказать «девочки»?", "opts": ["ясал", "бох", "гӀелму"], "a": 0}, {"t": "mcq", "q": "Как сказать «лошади»?", "opts": ["гъветӀ", "чуял", "жакъа"], "a": 1}, {"t": "mcq", "q": "Как сказать «учителя»?", "opts": ["гьудул", "бихьинчи", "мугӀалимзаби"], "a": 2}, {"t": "mcq", "q": "Как сказать «друзья»?", "opts": ["гьудулзаби", "аллагь", "гьанже"], "a": 0}], "lvl": "A1"}, {"id": "greet", "emoji": "👋", "t": "Салам!", "sub": "Здравствуй, знакомимся", "teach": "\n<p class=\"lead\">Даже в «здравствуй» слышен класс! Мужчине/мальчику — <b>ВорчӀами</b>,\nженщине/девочке — <b>ЙорчӀами</b>, нескольким — <b>РорчӀами</b>.</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">ВорчӀами!</td><td>Здравствуй (мужчине)</td></tr>\n<tr><td class=\"v\">ЙорчӀами!</td><td>Здравствуй (женщине)</td></tr>\n<tr><td class=\"v\">РорчӀами!</td><td>Здравствуйте (многим)</td></tr>\n</table>\n<p>Знакомимся:</p>\n<table class=\"vguide\">\n<tr><td>Ду<b>да</b> цӀар щиб?</td><td>Как тебя зовут? <span class=\"az\">(букв. «на тебе имя что?»)</span></td></tr>\n<tr><td>Ди<b>да</b> цӀар … <b>буго</b></td><td>Меня зовут … <span class=\"az\">(букв. «на мне имя … есть»)</span></td></tr>\n<tr><td>Дун … <b>вуго/йиго</b></td><td>Я … (мальчик → вуго, девочка → йиго)</td></tr>\n<tr><td>Щиб хӀал бугеб?</td><td>Как дела? <span class=\"az\">Ответ: ЛъикӀ буго — Хорошо</span></td></tr>\n</table>\n<div class=\"callout g\"><b>Имя «сидит на» человеке.</b> Поэтому для имён — падеж на <b>‑да</b>:\n<b>ду<u>да</u></b> «на тебе», <b>ди<u>да</u></b> «на мне». Отсюда «Дуда цӀар щиб?» и «Дида цӀар Муса буго».\n(Сказать «Дир цӀар … буго» — «моё имя …» — тоже можно, но живая форма — с ‑да.)</div>\n<div class=\"callout b\"><b>Спасибо</b> — <b>баркала</b>. <b>Да</b> — <b>у</b> (в ответ: «У» = «Да»; <b>гьа-гьа</b> — «да-да»), <b>нет</b> — <b>гьечӀо</b>.\nВежливого «вы» в аварском нет — даже старшим говорят «мун» (ты).</div>\n<h3>Короткие реакции (в живой речи — постоянно!)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">у</td><td>да</td><td class=\"v\">уйищ?</td><td>да? правда?</td></tr>\n<tr><td class=\"v\">унго</td><td>в самом деле, точно</td><td class=\"v\">унго? · унгойищ?</td><td>в самом деле?</td></tr>\n<tr><td class=\"v\">гьайгьай · у ха!</td><td>конечно! (в жизни чаще <b>уха!</b>)</td><td class=\"v\">гьечӀо</td><td>нет</td></tr>\n<tr><td class=\"v\">дида лъаларо</td><td>я не знаю</td><td class=\"v\">гьа</td><td>ну; ага</td></tr>\n</table>\n<div class=\"callout b\">Переспрос «да? / правда?» — <b>уйищ?</b> (это «у» = да + вопрос ‑ищ). «В самом деле?» —\n<b>унго?</b> или <b>унгойищ?</b> (в некоторых диалектах — <b>иля?</b>). А «истинный, настоящий» — <b>унго-унгояб</b>.</div>\n<div class=\"callout g\"><b>Частицы — соль живой речи.</b> Их «прилепляют» к слову:\n<b>ха</b> — «же» (<b>у ха!</b> «да же!» = «конечно!»), <b>‑ищ</b> — вопрос (бугищ? «есть ли?»),\n<b>‑го</b> — усиление (унго «точно», цойго «сам»), <b>гурищ?</b> — «не так ли?, разве нет?».\nПодробнее — в уроке «Частицы».</div>\n<div class=\"callout b\"><b>Междометия.</b> <b>вай!</b> — ой!/ах! (удивление, боль, радость), <b>гьай!</b> — ай!/ах!,\n<b>эхей!</b> — эй!. А верующие часто вставляют <b>бисмиллагь</b> (перед делом), <b>алхӀамдулиллагь</b>\n(слава Богу), <b>иншааллагь</b> (даст Бог).</div>\n", "words": [{"ru": "здравствуй (м.)", "av": "ворчӀами", "ex": {"av": "ворчӀами, вац Гьимат!", "ru": "с добрым утром, брат Гимбат!"}}, {"ru": "здравствуй (ж.)", "av": "йорчӀами"}, {"ru": "здравствуйте (мн.)", "av": "рорчӀами"}, {"ru": "имя", "av": "цӀар", "forms": ["цӀар", "цӀаралъ", "цӀаралъул", "цӀарал"], "ex": {"av": "цӀар абизе", "ru": "произнести имя, назвать по имени"}}, {"ru": "как тебя зовут?", "av": "дуда цӀар щиб?"}, {"ru": "спасибо", "av": "баркала", "forms": ["баркала", "баркалаялъ", "баркалаялъул"], "ex": {"av": "баркала кьезе", "ru": "выражать, выразить благодарность, (по)благодарить; отблагодарить; объявлять, объявить благодарность"}, "alts": [{"av": "шукру", "ex": {"av": "шукру бугев", "ru": "благодарный"}}]}, {"ru": "да", "av": "у", "ex": {"av": "уйилан ккезе", "ru": "принимать, принять за чистую монету"}, "alts": [{"av": "гьедин", "ex": {"av": "гьедин буго", "ru": "так и есть"}}, {"av": "гьадин", "ex": {"av": "гьадин гьабе", "ru": "делай так"}}]}, {"ru": "да? правда?", "av": "уйищ?"}, {"ru": "в самом деле?", "av": "унго?"}, {"ru": "конечно", "av": "гьайгьай", "ex": {"av": "гьайгьай, гьедин лъикӀ", "ru": "конечно, так лучше"}, "alts": [{"av": "узухъда", "ex": {"av": "узухъда, дов витӀарав вуго", "ru": "конечно, он прав"}}]}, {"ru": "я не знаю", "av": "дида лъаларо"}, {"ru": "нет", "av": "гьечӀо", "ex": {"av": "ЖабрагӀил дарсида гьечӀо", "ru": "Джабраил отсутствует на уроке"}, "alts": [{"av": "гуро", "ex": {"av": "гуро, гуро!", "ru": "нет, нет!"}}]}, {"ru": "друг", "av": "гьудул", "forms": ["гьудул", "гьудулас", "гьудулалъ", "гьудуласул", "гьудулалъул", "гьудулзаби"], "ex": {"av": "гьудулалъул вас", "ru": "сын подруги"}, "alts": [{"av": "гьалмагъ", "ex": {"av": "гьалмагъалъул вас", "ru": "сын подруги"}}]}], "ex": [{"t": "mcq", "q": "Ты здороваешься с девочкой. Что скажешь?", "opts": ["ЙорчӀами!", "ВорчӀами!", "РорчӀами!"], "a": 0}, {"t": "say", "q": "Спроси: «Как тебя зовут?»", "ans": "Дуда цӀар щиб?"}, {"t": <table class=\"vguide\">\n<tr><td><b>Признак</b> (перед словом, <u>без</u> «буго»)</td><td class=\"v\">лъикӀаб тӀехь</td><td>хорошая книга</td></tr>\n<tr><td></td><td class=\"v\">берцинай яс</td><td>красивая девочка</td></tr>\n<tr><td><b>Сказуемое</b> (после слова, <u>с</u> «буго»)</td><td class=\"v\">ТӀехь лъикӀаб буго</td><td>Книга хорошая</td></tr>\n<tr><td></td><td class=\"v\">Вас кӀудияв вуго</td><td>Мальчик большой</td></tr></table>\n<div class=\"callout b\">«хорошая книга» — это просто <b>словосочетание</b>: «лъикӀаб тӀехь» (без «буго»!).\nА «Книга хорошая» — это уже <b>целое предложение</b> (о чём-то говорим), тут слово ставится\nвперёд и добавляется «буго»: «ТӀехь лъикӀаб буго».</div>\n<h3>Сравнение: «больше» и «самый»</h3>\n<table class=\"vguide\">\n<tr><td>сравнительная (‑даса «чем»)</td><td class=\"v\">Дун дудаса кӀудияв вуго</td><td>Я больше тебя <span class=\"az\">(букв. «от тебя большой»)</span></td></tr>\n<tr><td>превосходная (<b>бищун</b>)</td><td class=\"v\">бищун кӀудияб</td><td>самый большой</td></tr>\n</table>\n<div class=\"callout b\">«Больше, чем X» — X ставим в исходный падеж <b>‑даса</b> («от, чем»): дуда<b>са</b> «чем ты».\n«Самый» — слово <b>бищун</b> перед прилагательным: <b>бищун</b> берцинаб «самый красивый», бищун лъикӀаб «наилучший».</div>\n", "words": [{"ru": "хороший", "av": "лъикӀаб", "cls": "III", "ex": {"av": "лъикӀаб мухь", "ru": "приличная оплата"}, "alts": [{"av": "цӀакъаб", "ex": {"av": "цӀакъав чи", "ru": "очень хороший человек"}}, {"av": "сахаб", "ex": {"av": "сахав инсан", "ru": "хороший человек"}}]}, {"ru": "плохой", "av": "квешаб", "cls": "III", "forms": ["квешаб", "Квешав", "Квешас", "Квешасул"], "ex": {"av": "квешаб бакӀ", "ru": "плохое место"}, "alts": [{"av": "къадараб", "ex": {"av": "къадараб иш", "ru": "плохое дело"}}, {"av": "хашаб", "ex": {"av": "хашаб цӀали", "ru": "неважная учёба"}}]}, {"ru": "большой", "av": "кӀудияб", "cls": "III", "ex": {"av": "кӀудияв чи", "ru": "важная персона, большой человек"}, "alts": [ s=\"lead\">Глагол в настоящем времени оканчивается на <b>‑ула / ‑уна</b>:\n<b>цӀал‑ула</b> «читает», <b>кван‑ала</b> «ест», <b>гьекъ‑ола</b> «пьёт».</p>\n<table class=\"vguide\">\n<tr><td>цӀализе → цӀал<b class=\"v\">ула</b></td><td>читать → читает/читаю</td></tr>\n<tr><td>хъвазе → хъ<b class=\"v\">вала</b></td><td>писать → пишет</td></tr>\n<tr><td>кваназе → кван<b class=\"v\">ала</b></td><td>есть → ест</td></tr>\n</table>\n<div class=\"callout g\"><b>Важно (эргатив).</b> Кто <i>делает что-то с предметом</i>, стоит в <b>эргативе</b>.\nУ местоимений: «дун» → <b>дица</b>, «мун» → <b>дуца</b>: <b>Дица тӀехь цӀалула</b> — «Я читаю книгу»\n(букв. «мной книга читается»). У существительных окончание эргатива разное (‑ас / ‑алъ / ‑ца) — см. урок «Падежи».</div>\n<div class=\"callout b\"><b>Сейчас или вообще?</b> <b>цӀалула</b> — это «читает вообще, обычно» (постоянно).\nЧтобы сказать «читает <u>прямо сейчас</u>», берут причастие + «буго»: <b>цӀалулеб буго</b> «(сейчас) читает».</div>\n<p>Переходный глагол согласуется по классу с <b>дополнением</b>, а не с деятелем (подробнее — урок «Падежи»).</p>\n<div class=\"callout r\"><b>Порядок слов: глагол — в конце!</b> Аварский — язык <b>SOV</b>:\nподлежащее → дополнение → <b>глагол</b> (в русском SVO: «я <u>читаю</u> книгу»). По-аварски —\n«Дица тӀехь <u>цӀалула</u>» (я книгу <u>читаю</u>). Глагол и «буго» уходят в самый конец.\nПорядок гибкий, но по умолчанию — глагол последним.</div>\n", "words": [{"ru": "читать", "av": "цӀализе", "cls": "III", "forms": ["цӀализе", "цӀалула", "цӀалила", "цӀалана", "цӀале"], "ex": {"av": "тӀехь цӀализе", "ru": "читать книгу"}}, {"ru": "писать", "av": "хъвазе", "cls": "III", "forms": ["хъвазе", "хъвала", "хъвана", "хъвай"], "ex": {"av": "квер хъвазе", "ru": "касаться рукой"}, "alts": [{"av": "гӀунтӀизе", "ex": {"av": "тӀаде гӀунтӀизе", "ru": "настигать, настичь; наступать, наступить"}}]}, {"ru": "есть/кушать", "av": "кваназе", "cls": "III", "forms": ["кваназе", "кванала", "кванана", "кванай"], "ex" десь, там, идти", "teach": "\n<p class=\"lead\">Место и движение:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">гьаниб</td><td>здесь</td><td class=\"v\">гьанибе</td><td>сюда</td></tr>\n<tr><td class=\"v\">гьениб</td><td>там</td><td class=\"v\">гьанире</td><td>туда</td></tr>\n</table>\n<p>Глагол <b>ине</b> «идти» — особенный: у него <b>нет</b> классного показателя,\nон одинаков для всех: <b>Дун ине</b> «я иду», <b>Дой ине</b> «она идёт».</p>\n<div class=\"callout g\">Сравни: «приходить» — с классом (вачӀине / ячӀине), а «идти» (ине) — без.\nНе говори «вине» или «йине» — только <b>ине</b>!</div>\n<h3>Вверх и вниз (в горах это отдельные слова!)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">эхеде</td><td>вверх, наверх</td><td class=\"v\">эхебе</td><td>вниз</td></tr>\n</table>\n<div class=\"callout b\"><b>На горной тропе</b> дорога редко ровная — один путник идёт <b>эхеде</b> (наверх, в село),\nдругой <b>эхебе</b> (вниз). «— Мун эхеде? — У. Дун эхебе.» — «— Ты наверх? — Да. А я вниз.»\nЭти слова в паре с высотными «лъоб/гъоб» (см. урок «Гьаб, гьеб, доб»).</div>\n<h3>Послелоги (в аварском нет предлогов!)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">цебе</td><td>перед, впереди</td><td class=\"v\">нахъа</td><td>сзади; после</td></tr>\n<tr><td class=\"v\">гъоркь</td><td>под, внизу</td><td class=\"v\">тӀад</td><td>на, сверху</td></tr>\n<tr><td class=\"v\">цадахъ</td><td>вместе с</td><td class=\"v\">гӀоло</td><td>ради, для</td></tr>\n</table>\n<div class=\"callout b\">Послелог стоит <u>после</u> слова: «дида <b>цебе</b>» «передо мной», «дида <b>нахъа</b>» «за мной»,\n«столалда <b>тӀад</b>» «на столе», «дун <b>гӀоло</b>» «ради меня», «гьудулгун <b>цадахъ</b>» «вместе с другом».</div>\n", "words": [{"ru": "здесь", "av": "гьаниб", "forms": ["гьаниб", "гьанибе", "гьаниса", "гьанисан"], "ex": {"av": "гьанибго те", "ru": "оставь(те) здесь же"}, "alts": [{"av": "аниб", "ex": {"av": "эмен анив вуго", "ru": "отец здесь [есть]"}}]}, {"ru": "там", "av": "гьениб", "forms": ["гьениб", "гьенибе", "гьениса", "гьенисан"], "ex": {"av": "гьениб те", "ru": "оставь(те) там"}, "alts": [{"av": "гьадаба", "ex": {"av": "гьадаба лъе тӀехь", "ru": "книгу положи вот туда"}}, {"av": "гьунд", "ex": {"av": "гьунд бакӀ бугищ?", "ru": "там есть место?"}}]}, {"ru": "сюда", "av": "гьанибе"}, {"ru": "туда", "av": "гьанире"}, {"ru": "вверх, наверх", "av": "эхеде", "ex": {"av": "эхеде боржине", "ru": "лететь вверх"}}, {"ru": "вниз", "av": "эхебе", "ex": {"av": "эхеве вачӀа", "ru": "спускайся вниз; приходи вниз"}}, {"ru": "идти", "av": "ине", "forms": ["ине", "уна", "ина", "ана", "а"], "ex": {"av": "лъелго ине", "ru": "идти пешком"}, "alts": [{"av": "базе", "ex": {"av": "кьо базе", "ru": "проложить, построить мост"}}, {"av": "хьвадизе", "ex": {"av": "хьвадизе лъазе", "ru": "уметь вести себя"}}]}, {"ru": "прийти", "av": "вачӀине"}, {"ru": "дорога", "av": "нух", "cls": "III", "forms": ["нух", "нухалъ", "нухлул", "нухал"], "ex": {"av": "нух тезе", "ru": "пропустить, дать дорогу; пройти путь"}}, {"ru": "село", "av": "росу", "cls": "III", "forms": ["росу", "росдаца", "росдал", "росаби"], "ex": {"av": "росу тезе", "ru": "покинуть село"}}, {"ru": "город", "av": "шагьар", "cls": "III", "forms": ["шагьар", "шагьаралъ", "шагьаралъул", "шагьарал", "шагьраби"], "ex": {"av": "кӀудияб шагьар", "ru": "крупный город, большой город, мегаполис"}, "alts": [{"av": "хъала", "ex": {"av": "хъала базе", "ru": "построить крепость, укрепление, замок"}}]}], "ex": [{"t": "mcq", "q": "«Здесь» —", "opts": ["гьаниб", "гьениб", "гьанире"], "a": 0}, {"t": "mcq", "q": "«Вверх, наверх» (в село по склону) —", "opts": ["эхеде", "эхебе", "гьанибе"], "a": 0}, {"t": "mcq", "q": "Глагол «идти» (ине)…", "opts": ["не меняется по классу", "всегда с в‑", "всегда с б‑"], "a": 0}, {"t": "say", "q": "Скажи: «Я иду» (дун)", "ans": "Дун ине"}, {"t": "mcq", "q": "Как сказать «здесь»?", "opts": ["гъотӀокь", "гьаниб", "лъабго"], "a": 1}, {"t": "mcq", "q": "Как сказать «там»?", "opts": ["вуго", "инсуда", "гьениб"], "a": 2}, {"t": "mcq", "q": "Как сказать «сюда»?", "opts": ["гьанибе", "къватӀахъ", "ичӀго"], "a": 0}, {"t": "mcq", "q": "Как сказать «туда»?", "opts": ["васас", "гьанире", "гъурущ"], "a": 1}, {"t": "mcq", "q": "Как сказать «вверх, наверх»?", "opts": ["анлъго", "гурде", "эхеде"], "a": 2}, {"t": "mcq", "q": "Как сказать «вниз»?", "opts": ["эхебе", "анлъго", "гьениб"], "a": 0}], "drill": {"gen": "place"}, "lvl": "A2"}, {"id": "talk", "emoji": "💬", "t": "Рассказ о себе", "sub": "Полный разговор: кто я, откуда, семья, языки", "teach": "\n<p class=\"lead\">Собираем всё в живой разговор — рассказать о себе и <b>расспросить собеседника</b>.\nЭто и есть цель: представиться, сказать откуда ты и из какой семьи, и задать встречные вопросы.</p>\n<h3>1. Здороваемся, «как дела»</h3>\n<table class=\"vguide\">\n<tr><td>— Ассаламу гӀалайкум! / ВорчӀами!</td><td>— Здравствуй!</td></tr>\n<tr><td>— Щиб хӀал бугеб? — ЛъикӀ буго, баркала. Мунги?</td><td>— Как дела? — Хорошо, спасибо. А ты?</td></tr>\n<tr><td>— Дур эбел-эмен щиб хӀалалда ругел?</td><td>— Как твои родители? <span class=\"az\">(мама-папа)</span></td></tr>\n</table>\n<h3>2. Имя, возраст, учёба/работа</h3>\n<table class=\"vguide\">\n<tr><td>Дида цӀар … буго.</td><td>Меня зовут …</td></tr>\n<tr><td>Дир … сон буго.</td><td>Мне … лет. <span class=\"az\">(сон — «год возраста»)</span></td></tr>\n<tr><td>Дун цӀалдохъан вуго, цӀалула.</td><td>Я учусь (ученик/студент).</td></tr>\n<tr><td>Дун хӀалтӀула. / Дун … хӀалтӀухъан вуго.</td><td>Я работаю. / Я по профессии …</td></tr>\n</table>\n<h3>3. Откуда я и моя семья</h3>\n<table class=\"vguide\">\n<tr><td>Дун … росулъ гьавуна (м.) / гьаюна (ж.).</td><td>Я родился / родилась в селе …</td></tr>\n<tr><td>Дир вац вуго, яц йиго.</td><td>У меня есть брат, есть сестра.</td></tr>\n<tr><td>Дир … вацал, … яцал руго.</td><td>У меня … братьев, … сестёр.</td></tr>\n<tr><td>Дир кӀудада … росулъа вуго, кӀодо … росулъа йиго.</td><td>Мой дед — из села …, бабушка — из села …</td></tr>\n<tr><td>Дун цебе … вукӀана, гьанже … вуго.</td><td>Раньше я жил в …, сейчас живу в …</td></tr>\n</table>\n<h3>4. Языки</h3>\n<table class=\"vguide\">\n<tr><td>Дун <b>дагь</b> авар мацӀалъ кӀалъала.</td><td>Я <b>немного</b> говорю по-аварски.</td></tr>\n<tr><td>Дида авар мацӀ лъала.</td><td>Я знаю аварский. <span class=\"az\">(букв. «мне язык знается»)</span></td></tr>\n<tr><td>Дун урус, ингилис мацӀалъги кӀалъала.</td><td>Я говорю и по-русски, и по-английски.</td></tr>\n</table>\n<div class=\"callout b\"><b>«Немного»</b> — <b>дагь</b>. Глагол <b>кӀалъазе</b> «говорить» <u>непереходный</u> — поэтому «я»\nздесь <b>дун</b> (не «дица»!). «Говорить на языке X» — <b>X мацӀалъ кӀалъазе</b> (язык на ‑лъ):\nгӀурус <b>мацӀалъ</b> кӀалъазе «говорить по-русски». А «знать язык» — <b>X мацӀ лъала</b> (подлежащее\nна ‑да, <b>дида</b>): лъолда магӀарул мацӀ лъала «она говорит по-аварски».</div>\n<h3>5. Встречные вопросы — расспроси собеседника!</h3>\n<table class=\"vguide\">\n<tr><td>Мун щив вугев? / Мун щий йигей?</td><td>Ты кто? (м. / ж.)</td></tr>\n<tr><td>Мун киса вугев?</td><td>Ты откуда?</td></tr>\n<tr><td>Дур вацал-яцал ругищ?</td><td>У тебя есть братья-сёстры?</td></tr>\n<tr><td>Дуда авар мацӀ лъалищ?</td><td>Ты знаешь аварский? <span class=\"az\">(дуда — «тебе», знать)</span></td></tr>\n<tr><td>Киве мун вахъарав?</td><td>Куда идёшь / собираешься?</td></tr>\n</table>\n<div class=\"callout g\">Секрет разговора: ответь коротко и <b>задай тот же вопрос обратно</b>.\n«— Мун киса вугев? — Дун Хунзахъа. Мун киса?» — «— Ты откуда? — Я из Хунзаха. А ты?»</div>\n", "words": [{"ru": "немного", "av": "дагь", "forms": ["дагь", "дагьго"], "ex": {"av": "регьел дагь буго", "ru": "мало влаги"}, "alts": [{"av": "гьитӀин", "ex": {"av": "гьитӀин гьабизе", "ru": "уменьшать, уменьшить; убавлять, убавить"}}]}, {"ru": "меня зовут …", "av": "дида цӀар … буго"}, {"ru": "мне … лет", "av": "дир … сон буго"}, {"ru": "я родился (м.)", "av": "дун гьавуна"}, {"ru": "я родилась (ж.)", "av": "дун гьаюна"}, {"ru": "у меня есть брат", "av": "дир вац вуго"}, {"ru": "у меня есть сестра", "av": "дир яц йиго"}, {"ru": "раньше я жил", "av": "дун цебе вукӀана"}, {"ru": "сейчас", "av": "гьанже", "forms": ["гьанже", "гьанжеялде", "гьанжеялдаса"], "ex": {"av": "гьанже заман", "ru": "нынешнее время"}}, {"ru": "я немного говорю по-аварски", "av": "дун дагь авар мацӀалъ кӀалъала"}, {"ru": "я знаю аварский", "av": "дида авар мацӀ лъала"}, {"ru": "ты откуда?", "av": "мун киса вугев?"}, {"ru": "из села (откуда)", "av": "росулъа"}, {"ru": "работать", "av": "хӀалтӀизе", "forms": ["хӀалтӀизе", "хӀалтӀула", "хӀалтӀила", "хӀалтӀана", "хӀалтӀе"], "ex": {"av": "квеш хӀалтӀизе", "ru": "плохо работать"}, "alts": [{"av": "багӀаризабизе", "ex": {"av": "хӀалтӀи багӀаризабизе", "ru": "интенсивно работать"}}]}, {"ru": "говорить", "av": "кӀалъазе", "forms": ["кӀалъазе", "кӀалъала", "кӀалъана", "кӀалъай"], "ex": {"av": "бацӀцӀадго кӀалъазе", "ru": "чисто говорить"}}], "ex": [{"t": "say", "q": "Скажи: «Меня зовут …, мне 10 лет» (анцӀго)", "ans": "Дида цӀар … буго. Дир анцӀго сон буго."}, {"t": "mcq", "q": "«Я немного говорю по-аварски» (кӀалъазе непереходный!) —", "opts": ["Дун дагь авар мацӀалъ кӀалъала", "Дица авар мацӀ кӀалъала", "Дир авар мацӀ буго"], "a": 0}, {"t": "say", "q": "Скажи (мальчик): «Я родился в селе Хунзах» (Хунзахъ росулъ)", "ans": "Дун Хунзахъ росулъ гьавуна"}, {"t": "mcq", "q": "«Ты откуда?» (мужчине) —", "opts": ["Мун киса вугев?", "Дуда цӀар щиб?", "Мун щив вугев?"], "a": 0}, {"t": "mcq", "q": "«Немного» по-аварски —", "opts": ["дагь", "цӀакъ", "гӀемер"], "a": 0}, {"t": "say", "q": "Спроси собеседника: «У тебя есть братья-сёстры?»", "ans": "Дур вацал-яцал ругищ?"}, {"t": "mcq", "q": "Как сказать «немного»?", "opts": ["бер", "дагь", "вацал"], "a": 1}, {"t": "mcq", "q": "Как сказать «я родился (м.)»?", "opts": ["дун гьаюна", "гьекъела", "дун гьавуна"], "a": 2}, {"t": "mcq", "q": "Как сказать «я родилась (ж.)»?", "opts": ["дун гьаюна", "жамагӀат", "шапакъат"], "a": 0}, {"t": "mcq", "q": "Как сказать «сейчас»?", "opts": ["васас", "гьанже", "гӀазу"], "a": 1}], "drill": {"gen": "talk"}, "lvl": "A2"}, {"id": "loan", "emoji": "🔌", "t": "Заимствования", "sub": "Говори, даже если не знаешь слово", "teach": "\n<p class=\"lead\">Не знаешь аварское слово? <b>Не молчи!</b> Аварцы всегда вставляют русские,\nарабские, английские слова — и ты можешь. Главное — оформить их по-аварски. С этим приёмом\nты говоришь на любую тему уже сегодня.</p>\n<h3>Способ 1: слово + <b>гьабизе</b> («делать»)</h3>\n<table class=\"vguide\">\n<tr><td>проверка <b>гьабизе</b></td><td>проверять <span class=\"az\">(букв. «делать проверку»)</span></td></tr>\n<tr><td>ремонт <b>гьабизе</b></td><td>ремонтировать</td></tr>\n<tr><td>звонок <b>гьабизе</b></td><td>позвонить</td></tr></table>\n<h3>Способ 2 (по-нативному): корень + <b>‑изе</b></h3>\n<p>Бери русский или английский корень и делай аварский глагол на <b>‑изе</b> — а потом склоняй\nкак обычный аварский глагол!</p>\n<table class=\"vguide\">\n<tr><td>проверить → <b class=\"v\">провер‑изе</b></td><td>наст. провер‑ула, прош. провер‑ана</td></tr>\n<tr><td>англ. check → <b class=\"v\">чек‑изе</b></td><td>«чекнуть, проверить»</td></tr>\n<tr><td>гуглить → <b class=\"v\">гугл‑изе</b></td><td>«погуглить»</td></tr></table>\n<div class=\"callout g\"><b>Целая фраза:</b><br>\n<b>Дие провер‑изе бокьун буго, документалда щиб хъван бугеб‑али.</b><br>\n<span class=\"az\">«Я хочу проверить, что написано в документе».</span></div>\n<div class=\"callout r\"><b>Порядок слов: глагол — в конце!</b> Аварский — язык <b>SOV</b> (подлежащее–дополнение–глагол),\nа не SVO как русский. Сравни: рус. «я хочу <u>проверить</u>» → авар. «дие <u>провер‑изе</u> бокьун буго»\n(«хочу/буго» уходит в самый конец). Порядок гибкий, но по умолчанию — глагол в конце.</div>\n<h3>Заимствованные существительные берут аварские падежи</h3>\n<table class=\"vguide\">\n<tr><td>документ → <b>документалда</b></td><td>в документе</td></tr>\n<tr><td>интернет → <b>интернеталда</b></td><td>в интернете</td></tr>\n<tr><td>телефон → <b>телефоналде</b></td><td>на телефон</td></tr></table>\n<div class=\"callout b\"><b>«‑бали / ‑али»</b> на конце глагола = русское <b>«ли»</b> (косвенный вопрос):\n<b>бугеб‑али</b> «есть ли», <b>хъван бугеб‑али</b> «написано ли». Легко запомнить — созвучно с «ли».\nМожно и <b>бугин-гьечӀин</b> «есть-нет».</div>\n<h3>Универсальные формулы словообразования</h3>\n<p>Не зубри такие слова — <b>строй их на ходу</b> (корень аварский, русский или международный + «хвостик»):</p>\n<table class=\"vguide\">\n<tr><td>+ <b class=\"v\">‑ялъулаб</b> (‑ский)</td><td>Москва → Москваялъулаб</td><td>московский</td></tr>\n<tr><td>+ <b class=\"v\">‑кияб</b> (‑ический)</td><td>техника → техникияб · энергия → энергикияб</td><td>технический</td></tr>\n<tr><td>+ <b class=\"v\">‑лъи</b> (‑ость/‑ство)</td><td>берцинаб → берцинлъи · бечед → бечелъи</td><td>красота, богатство</td></tr>\n<tr><td>+ <b class=\"v\">‑лъизе</b> (стать…)</td><td>цо «один» → цолъизе</td><td>объединиться</td></tr>\n<tr><td>+ <b class=\"v\">‑го</b> (наречие)</td><td>лъикӀ → лъикӀго</td><td>хорошо</td></tr>\n</table>\n<div class=\"callout b\"><b>Так строится половина слов.</b> Взял корень — надел нужный хвостик: <b>‑ялъулаб / ‑кияб</b>\n(прилагательное), <b>‑лъи</b> (свойство), <b>‑лъизе</b> (стать таким), <b>‑го</b> (наречие).\nСогласуй прилагательное по классу (‑в/‑й/‑б). Это тоже «модернизация» языка.</div>\n<div class=\"callout g\"><b>Про «значит»:</b> <b>гьединлъидал</b> — «поэтому, следовательно» (вывод); в живой речи\nчасто сокращают до <b>гьелъ</b> (букв. «этим»). А глагол «означать» одним словом не сказать —\nчерез <b>магӀна</b> «смысл»: «гьелъул магӀна…» — «это значит…».</div>\n<div class=\"callout b\"><b>масала ≠ мисал:</b> <b>масала</b> — вводное «например» (араб.). А <b>мисал</b> — существительное\n«пример»: <b>мисалалъе</b> «для примера, к примеру».</div>\n<h3>Слова-связки (вставляй в речь)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">масала</td><td>например</td><td class=\"v\">амма</td><td>но, однако</td></tr>\n<tr><td class=\"v\">ва</td><td>и</td><td class=\"v\">яги</td><td>или</td></tr>\n<tr><td class=\"v\">цинги</td><td>потом, затем</td><td class=\"v\">гьединлъидал</td><td>поэтому, значит</td></tr>\n<tr><td class=\"v\">узухъда</td><td>конечно</td><td class=\"v\">хӀакъикъаталда</td><td>на самом деле</td></tr></table>\n<div class=\"callout b\">Если выучить ~1000 слов, основную грамматику и уметь вот так вставлять\nрусские/английские слова — это уже свободная живая речь (честный B1 и выше). Смешивать языки —\nнормально, это живой «суржик», на котором реально говорят.</div>\n", "words": [{"ru": "делать (универсально)", "av": "гьабизе", "forms": ["гьабизе", "гьабула", "гьабила", "гьабуна", "гьабе"], "ex": {"av": "иш гьабизе", "ru": "делать дело"}, "alts": [{"av": "бахъинабизе", "ex": {"av": "ГӀумарил устар вахъинавизе", "ru": "(с)делать, чтобы Омар стал мастером"}}, {"av": "гӀезабизе", "ex": {"av": "ахал гӀезаризе", "ru": "взращивать сады"}}]}, {"ru": "проверить (заимств.)", "av": "проверизе"}, {"ru": "например", "av": "масала"}, {"ru": "но, однако", "av": "амма", "ex": {"av": "амма хӀакъаб рагӀи", "ru": "в самом деле"}, "alts": [{"av": "но"}]}, {"ru": "и", "av": "ва", "ex": {"av": "гӀака ва бече", "ru": "корова и телёнок"}}, {"ru": "или", "av": "яги", "alts": [{"av": "яда"}]}, {"ru": "потом, затем", "av": "цинги", "ex": {"av": "цин ургъе, цинги кӀалъай", "ru": "сперва подумай, затем говори"}, "alts": [{"av": "хадуса", "ex": {"av": "ун хадуса", "ru": "после того, как ушли"}}]}, {"ru": "поэтому, значит", "av": "гьединлъидал"}, {"ru": "конечно", "av": "узухъда", "ex": {"av": "узухъда, дов витӀарав вуго", "ru": "конечно, он прав"}, "alts": [{"av": "гьайгьай", "ex": {"av": "гьайгьай, гьедин лъикӀ", "ru": "конечно, так лучше"}}]}, {"ru": "на самом деле", "av": "хӀакъикъаталда", "ex": {"av": "хӀакъикъаталда дов витӀун вуго", "ru": "в самом деле он прав"}}, {"ru": "…ли (косв. вопрос)", "av": "‑бали"}, {"ru": "в документе", "av": "документалда"}], "ex": [{"t": "mcq", "q": "Как оформить русский глагол «проверить» по-аварски (2-й способ)?", "opts": ["проверизе", "проверитьун", "проверский"], "a": 0}, {"t": "say", "q": "Скажи: «Я хочу проверить» (провер‑изе)", "ans": "Дие проверизе бокьун буго"}, {"t": "mcq", "q": "«‑бали» на конце глагола значит…", "opts": ["«ли» (вопрос: есть ли…)", "приказ", "прошедшее время"], "a": 0}, {"t": "mcq", "q": "«в документе» (заимств. слово + падеж) —", "opts": ["документалда", "документалде", "документго"], "a": 0}, {"t": "mcq", "q": "«например» по-аварски —", "opts": ["масала", "амма", "яги"], "a": 0}, {"t": "mcq", "q": "Способ 1 вставить слово —", "opts": ["слово + гьабизе («делать»)", "убрать все гласные", "добавить ‑ский"], "a": 0}, {"t": "say", "q": "Скажи «Я хочу погуглить» (гугл‑изе)", "ans": "Дие гуглизе бокьун буго"}, {"t": "mcq", "q": "Как сказать «делать (универсально)»?", "opts": ["кӀалъазе", "гьабизе", "кваназе"], "a": 1}, {"t": "mcq", "q": "Как сказать «проверить (заимств.)»?", "opts": ["гьабизе", "цӀализе", "проверизе"], "a": 2}, {"t": "mcq", "q": "Как сказать «например»?", "opts": ["масала", "макъала", "масъала"], "a": 0}], "drill": {"gen": "loan"}, "lvl": "A2"}, {"id": "vforms", "emoji": "🔧", "t": "Все формы глагола", "sub": "Продвинуто: спряжение целиком", "teach": "\n<p class=\"lead\">Один глагол — много форм. Возьмём <b>цӀализе</b> «читать» и посмотрим целиком.\nМеняется только окончание (основа <b>цӀал‑</b> одна):</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">цӀал‑ула</td><td>настоящее — читает</td></tr>\n<tr><td class=\"v\">цӀал‑ана</td><td>прошедшее — читал</td></tr>\n<tr><td class=\"v\">цӀал‑ила</td><td>будущее — прочтёт</td></tr>\n<tr><td class=\"v\">цӀал‑е</td><td>приказ — читай!</td></tr>\n<tr><td class=\"v\">цӀалу‑ла‑ро</td><td>не читает (‑ро)</td></tr>\n<tr><td class=\"v\">цӀали‑чӀо</td><td>не читал (‑чӀо)</td></tr>\n<tr><td class=\"v\">цӀал‑ун</td><td>деепричастие — прочитав</td></tr>\n<tr><td class=\"v\">цӀал‑улеб</td><td>причастие — читающий</td></tr>\n<tr><td class=\"v\">цӀал‑и</td><td>масдар — чтение (имя действия)</td></tr>\n<tr><td class=\"v\">цӀал‑ани</td><td>условное — если прочтёт</td></tr>\n</table>\n<div class=\"callout g\"><b>Инфинитив ‑изе или ‑ине?</b> Большинство глаголов на <b>‑изе</b> (цӀал‑изе, гьаб‑изе),\nно часть — на <b>‑ине</b>: <b>ине</b> «идти», <b>вачӀине</b> «приходить», <b>ретӀине</b> «надевать»,\n<b>бачине</b> «вести». Спрягаются они одинаково, разница только в инфинитиве.</div>\n<div class=\"callout r\"><b>Осторожно, «ложные друзья»!</b> ‑изе и ‑ине могут дать совсем разные слова:\n<b>бахъизе</b> «снимать, вытаскивать» (и «сурат бахъизе» — рисовать / сфотографировать) ≠\n<b>бахъине</b> «вставать». Одна буква — другое слово!</div>\n", "words": [{"ru": "деепричастие: прочитав", "av": "цӀалун"}, {"ru": "причастие: читающий", "av": "цӀалулеб"}, {"ru": "масдар: чтение", "av": "цӀали"}, {"ru": "не читает", "av": "цӀалуларо"}, {"ru": "надевать (‑ине)", "av": "ретӀине", "forms": ["ретӀине", "ретӀуна", "ретӀина", "ретӀана", "ретӀе"], "ex": {"av": "хисун ретӀине", "ru": "переодеваться, сменить одежду"}, "alts": [{"av": "тӀад", "ex": {"av": "тӀагъур тӀад лъезе", "ru": "надевать шапку"}}, {"av": "базе", "ex": {"av": "ракӀ базе", "ru": "надеяться, чувствовать опорой"}}]}, {"ru": "вести (‑ине, перех.)", "av": "бачине", "forms": ["бачине", "бачуна", "бачина", "бачана", "баче"], "ex": {"av": "газ бачине", "ru": "провести газ"}}], "ex": [{"t": "mcq", "q": "«цӀалун» — это…", "opts": ["деепричастие: «прочитав»", "приказ", "будущее"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в прошедшее время", "ans": "цӀалана"}, {"t": "mcq", "q": "Инфинитив «приходить» —", "opts": ["вачӀине (на ‑ине)", "вачӀизе", "вачӀула"], "a": 0}, {"t": "mcq", "q": "бахъизе и бахъине —", "opts": ["разные слова (получаться / вставать)", "одно и то же", "опечатка"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в будущее время", "ans": "цӀалила"}, {"t": "mcq", "q": "Масдар (имя действия) от «цӀализе» —", "opts": ["цӀали (чтение)", "цӀале", "цӀалана"], "a": 0}, {"t": "mcq", "q": "Как сказать «деепричастие: прочитав»?", "opts": ["ватӀан", "цӀалун", "гӀор"], "a": 1}, {"t": "mcq", "q": "Как сказать «причастие: читающий»?", "opts": ["лъикӀаб", "кӀудияб", "цӀалулеб"], "a": 2}, {"t": "mcq", "q": "Как сказать «масдар: чтение»?", "opts": ["цӀали", "гурищ?", "заман"], "a": 0}, {"t": "mcq", "q": "Как сказать «не читает»?", "opts": ["хӀайван", "цӀалуларо", "ги"], "a": 1}], "drill": {"gen": "vform"}, "lvl": "B1"}, {"id": "cases", "emoji": "📦", "t": "Падежи существительных", "sub": "Продвинуто: кто/кого/где/куда/откуда", "teach": "\n<p class=\"lead\">Главное правило аварского предложения: <b>падеж подлежащего выбирает глагол</b>.\nЭто сердце языка — от него зависит, как строить любую фразу.</p>\n<h3>Кто что делает: падеж подлежащего зависит от глагола</h3>\n<table class=\"vguide\">\n<tr><td>непереходный (идти, прийти)</td><td>подлежащее в <b>именительном</b></td><td>Вас <b>вачӀана</b> «мальчик пришёл»</td></tr>\n<tr><td>переходный (пахать, читать)</td><td>подлежащее в <b>эргативе</b></td><td><b>Инсуца</b> хур бекьана «отец вспахал поле»</td></tr>\n<tr><td>любить, хотеть</td><td>подлежащее в <b>дательном ‑е</b></td><td><b>Инсуе</b> вас вокьула «отец любит сына»</td></tr>\n<tr><td>видеть, знать, мочь</td><td>подлежащее в <b>местном ‑да</b></td><td><b>Дида</b> Загьра йихьана «я увидел Захру»</td></tr>\n</table>\n<h3>Эргатив: три окончания (не только ‑ца!)</h3>\n<table class=\"vguide\">\n<tr><td>I класс (мужчины) <b class=\"v\">‑ас</b></td><td class=\"v\">вас→вас<b>ас</b> · вац→вац<b>ас</b> · чи→чи<b>яс</b></td></tr>\n<tr><td>II/III класс (женщины, вещи) <b class=\"v\">‑алъ</b></td><td class=\"v\">яс→яс<b>алъ</b> · квер→квер<b>алъ</b></td></tr>\n<tr><td>имена и <b>конкретные</b> вещи <b class=\"v\">‑ца</b></td><td class=\"v\">Муса→Муса<b>ца</b> · тӀехь→тӀохь<b>оца</b></td></tr>\n</table>\n<div class=\"callout b\">По Атаеву <b>‑ца</b> — у имён и <b>конкретных</b> предметов (книга, камень), а <b>абстрактные</b>\nпонятия (радость, ум) берут <b>‑алъ</b>. «Отец» склоняется по особой основе <b>инс‑</b>: эрг. <b>инсуца</b>,\nрод. <b>инсул</b>, дат. <b>инсуе</b>, мест. <b>инсуда</b>. У «я»: эрг. <b>дица</b>, род. <b>дир</b>, дат. <b>дие</b>, мест. <b>дида</b>.</div>\n<h3>Переходный глагол согласуется с ДОПОЛНЕНИЕМ (по классу), а не с подлежащим</h3>\n<table class=\"vguide\">\n<tr><td>увидел мальчика (I)</td><td class=\"v\"><b>в</b>ихьана</td></tr>\n<tr><td>увидел девочку (II)</td><td class=\"v\"><b>й</b>ихьана</td></tr>\n<tr><td>увидел книгу/вещь (III)</td><td class=\"v\"><b>б</b>ихьана</td></tr>\n</table>\n<div class=\"callout g\">«Дица Загьра <b>й</b>ихьана» — «я увидел Захру»: показатель <b>й</b> согласуется с «Загьра»\n(женщина, II класс), а не с «дица». Скажешь про мальчика — «<b>в</b>ихьана».</div>\n<h3>Местные падежи (где / куда / откуда)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">столалда</td><td>на столе (где?)</td></tr>\n<tr><td class=\"v\">столалде</td><td>на стол (куда?)</td></tr>\n<tr><td class=\"v\">столалдаса</td><td>со стола (откуда?)</td></tr>\n</table>\n<p>Полная таблица 5 серий (на / у / в среде / под / внутри) — в разделе «Справка → Грамматика».</p>\n", "words": [{"ru": "отец (эрг.)", "av": "инсуца"}, {"ru": "отцу (дат.)", "av": "инсуе"}, {"ru": "у отца (мест.)", "av": "инсуда"}, {"ru": "мальчик (эрг.)", "av": "васас"}, {"ru": "девочка (эрг.)", "av": "ясалъ"}, {"ru": "я (эрг.)", "av": "дица", "ex": {"av": "дица кинабго бицина", "ru": "я всё расскажу"}, "alts": [{"av": "дун", "ex": {"av": "дун ячӀана", "ru": "я пришла"}}]}, {"ru": "мне", "av": "дие", "ex": {"av": "дие дой йокьула", "ru": "я её люблю"}}, {"ru": "на столе", "av": "столалда"}, {"ru": "со стола", "av": "столалдаса"}], "ex": [{"t": "mcq", "q": "Подлежащее переходного глагола (пахать, читать) — в падеже", "opts": ["эргатив", "именительный", "дательный"], "a": 0}, {"t": "mcq", "q": "«видеть, знать, мочь» — подлежащее в падеже", "opts": ["местном ‑да (дида)", "эргативе", "именительном"], "a": 0}, {"t": "mcq", "q": "Эргатив от «вас» (мальчик, I класс) —", "opts": ["васас", "васца", "васалъ"], "a": 0}, {"t": "mcq", "q": "Эргатив от «яс» (девочка) —", "opts": ["ясалъ", "ясас", "ясца"], "a": 0}, {"t": "mcq", "q": "«увидел девочку» — глагол согласуется с дополнением:", "opts": ["йихьана", "вихьана", "бихьана"], "a": 0}, {"t": "say", "q": "Скажи «со стола» (откуда?)", "ans": "столалдаса"}, {"t": "mcq", "q": "Как сказать «отец (эрг.)»?", "opts": ["гурищ?", "инсуца", "калам"], "a": 1}, {"t": "mcq", "q": "Как сказать «отцу (дат.)»?", "opts": ["квен", "гьанже", "инсуе"], "a": 2}, {"t": "mcq", "q": "Как сказать «у отца (мест.)»?", "opts": ["инсуда", "кида", "столалда"], "a": 0}, {"t": "mcq", "q": "Как сказать «мальчик (эрг.)»?", "opts": ["гӀазу", "васас", "лъагӀел"], "a": 1}], "drill": {"gen": "casemix"}, "lvl": "B1"}, {"id": "cond", "emoji": "🔀", "t": "Условное наклонение", "sub": "Продвинуто: если… / если бы…", "teach": "\n<p class=\"lead\">«Если» по-аварски — это окончания на глаголе, отдельного слова не нужно.</p>\n<h3>Реальное условие: ‑ни</h3>\n<p>От основы прошедшего (без ‑на) + <b>‑ни</b>:</p>\n<table class=\"vguide\">\n<tr><td>цӀала‑на → цӀала<b class=\"v\">ни</b></td><td>если прочтёт</td></tr>\n<tr><td>вачӀа‑на → вачӀа<b class=\"v\">ни</b></td><td>если придёт</td></tr>\n</table>\n<h3>Отрицательное условие: ‑чӀони</h3>\n<table class=\"vguide\">\n<tr><td>цӀаличӀо → цӀаличӀо<b class=\"v\">ни</b></td><td>если не прочтёт</td></tr>\n</table>\n<h3>Нереальное («если бы»): ‑арабани / ‑ебани</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">букӀарабани</td><td>если бы было</td></tr>\n<tr><td class=\"v\">букӀинчӀебани</td><td>если бы не было</td></tr>\n<tr><td class=\"v\">лъалеб букӀарабани</td><td>если бы знал(а)</td></tr>\n</table>\n<div class=\"callout g\"><b>Пример:</b> «<b>Дица гьикъарабани, дида лъалаан</b>» — «Если бы я спросил(а),\n[я] знал(а) бы». <span class=\"az\">(‑аан — ирреальный результат: <b>лъалаан</b> «знал бы».)</span></div>\n", "words": [{"ru": "если прочтёт", "av": "цӀалани"}, {"ru": "если придёт", "av": "вачӀани"}, {"ru": "если не прочтёт", "av": "цӀаличӀони"}, {"ru": "если бы было", "av": "букӀарабани"}, {"ru": "если бы не было", "av": "букӀинчӀебани"}, {"ru": "если бы знал(а)", "av": "лъалеб букӀарабани"}], "ex": [{"t": "mcq", "q": "«если прочтёт» —", "opts": ["цӀалани", "цӀалила", "цӀалула"], "a": 0}, {"t": "say", "q": "Скажи «если придёт» (вачӀине)", "ans": "вачӀани"}, {"t": "mcq", "q": "«если бы было» —", "opts": ["букӀарабани", "букӀани", "букӀуна"], "a": 0}, {"t": "mcq", "q": "Отрицательное условие («если не…») — окончание", "opts": ["‑чӀони", "‑ни", "‑ила"], "a": 0}, {"t": "say", "q": "Скажи «если не прочтёт»", "ans": "цӀаличӀони"}, {"t": "mcq", "q": "Реальное условие «если» — окончание", "opts": ["‑ни", "‑ге", "‑ун"], "a": 0}, {"t": "mcq", "q": "Как сказать «если прочтёт»?", "opts": ["гӀадин", "цӀалани", "нуцӀа"], "a": 1}, {"t": "mcq", "q": "Как сказать «если придёт»?", "opts": ["ретӀел", "гӀамал", "вачӀани"], "a": 2}, {"t": "mcq", "q": "Как сказать «если не прочтёт»?", "opts": ["цӀаличӀони", "балагье", "дир"], "a": 0}, {"t": "mcq", "q": "Как сказать «если бы было»?", "opts": ["ватӀан", "букӀарабани", "инсуца"], "a": 1}], "drill": {"gen": "cond"}, "lvl": "B1"}, {"id": "part", "emoji": "🎙️", "t": "Частицы", "sub": "ха, цин, го, ищ, дай, ян… — соль живой речи", "teach": "\n<p class=\"lead\">Частицы «прилепляются» к концу слова и придают речи живость и оттенки.\nБез них аварский звучит сухо — это первое, что выдаёт носителя.</p>\n<h3>Усиление и эмоции</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ха</td><td>же (эмфаза)</td><td>Щиб<b>ха</b> дуе къваригӀараб? «Что <b>же</b> тебе нужно?»; <b>у ха!</b> «да же!» = конечно!</td></tr>\n<tr><td class=\"v\">‑го</td><td>сам; точно, же</td><td>Мун<b>го</b> а «ты <b>сам</b> иди»; ун<b>го</b> «точно, в самом деле»</td></tr>\n<tr><td class=\"v\">‑цин</td><td>даже</td><td>ГӀумар<b>цин</b> вукӀана «<b>даже</b> Омар был»</td></tr>\n<tr><td class=\"v\">‑ги</td><td>и, тоже</td><td>Гор<b>ги</b> бана «<b>и</b> град пошёл»; дун<b>ги</b> мун<b>ги</b> «и я, и ты»</td></tr>\n</table>\n<h3>Вопрос</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ищ · ‑йищ</td><td>ли, что ли?</td><td>ТӀехь<b>ищ</b> дуца босараб? «Книгу <b>что ли</b> купил?»; уй<b>ищ</b>? «да?»</td></tr>\n<tr><td class=\"v\">‑дай</td><td>ли, что ли? <span class=\"az\">(с сомнением)</span></td><td>Кумек гьабила<b>дай</b>? «Поможет <b>ли</b>?»</td></tr>\n<tr><td class=\"v\">гурищ?</td><td>не так ли? разве нет?</td><td>Дур вац <b>гурищ</b> дов? «Это ведь твой брат, <b>не так ли</b>?»</td></tr>\n</table>\n<h3>Чужая речь: «мол» (‑ян и ‑илан)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ян</td><td>мол, дескать <span class=\"az\">(закрывает прямую цитату — на последнем слове)</span></td><td>«ЧӀа!» — <b>ян</b> абуна «‘Уймись!’, <b>мол</b>, сказал»</td></tr>\n<tr><td class=\"v\">‑илан · ‑йилан</td><td>что…, будто <span class=\"az\">(вводит пересказ целой фразы)</span></td><td>ВачӀине кколо<b>илан</b> абуна «сказал, <b>что</b> надо прийти»</td></tr>\n</table>\n<div class=\"callout b\">Разница: <b>‑ян</b> ставят прямо на процитированном слове («‘…’, мол»), а <b>‑илан</b> — после\nцелого высказывания, как «что / будто». Важно: <b>‑илан</b> несёт <b>эвиденциальность</b> — говорящий\nпередаёт <u>чужие слова / слух</u>, чего сам <u>не видел</u>. Это часть аварской «заглазности»\n(ср. заглазный оттенок у <b>гьеб</b>): «вачӀун<b>ила</b>» — «пришёл, <i>говорят</i>» (не видел сам).</div>\n<h3>Направление и мера</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑хун</td><td>в сторону, к</td><td>Школалде<b>хун</b> ина «пойду <b>в сторону</b> школы»</td></tr>\n<tr><td class=\"v\">‑гӀан</td><td>как, насколько; около</td><td>Азарго<b>гӀан</b> чи «<b>около</b> тысячи человек»</td></tr>\n<tr><td class=\"v\">‑хӀа</td><td>клятва</td><td>Аллагьас<b>хӀа</b>! «<b>Аллахом клянусь</b>!»</td></tr>\n</table>\n", "words": [{"ru": "же (частица)", "av": "ха"}, {"ru": "даже", "av": "цин", "ex": {"av": "цин чӀа", "ru": "подожди пока"}, "alts": [{"av": "нух", "ex": {"av": "цо нухалъ", "ru": "один раз"}}]}, {"ru": "и, тоже (частица)", "av": "ги"}, {"ru": "сам; точно", "av": "го"}, {"ru": "ли, что ли?", "av": "ищ"}, {"ru": "ли? (с сомнением)", "av": "дай"}, {"ru": "мол, дескать", "av": "ян"}, {"ru": "не так ли?", "av": "гурищ?"}, {"ru": "да? правда?", "av": "уйищ?"}], "ex": [{"t": "mcq", "q": "«что ЖЕ тебе нужно?» — какая частица «же»?", "opts": ["щибха", "щибго", "щибцин"], "a": 0}, {"t": "mcq", "q": "«даже Омар» —", "opts": ["ГӀумарцин", "ГӀумарги", "ГӀумарха"], "a": 0}, {"t": "mcq", "q": "«и град (тоже) пошёл» —", "opts": ["Гордги", "Гордцин", "Гордхун"], "a": 0}, {"t": "mcq", "q": "«книгу что ли купил?» — частица вопроса", "opts": ["‑ищ (тӀехьищ)", "‑го", "‑ян"], "a": 0}, {"t": "mcq", "q": "«‘уймись’, мол, сказал» — частица пересказа", "opts": ["‑ян", "‑хун", "‑гӀан"], "a": 0}, {"t": "mcq", "q": "«не так ли?, разве нет?» —", "opts": ["гурищ?", "унго", "гьайгьай"], "a": 0}, {"t": "mcq", "q": "Как сказать «же (частица)»?", "opts": ["хӀал", "ха", "гьечӀо"], "a": 1}, {"t": "mcq", "q": "Как сказать «даже»?", "opts": ["ахир", "киб", "цин"], "a": 2}, {"t": "mcq", "q": "Как сказать «и, тоже (частица)»?", "opts": ["ги", "цин", "босе"], "a": 0}, {"t": "mcq", "q": "Как сказать «сам; точно»?", "opts": ["анлъго", "го", "дида"], "a": 1}], "lvl": "B1"}, {"id": "conj", "emoji": "➕", "t": "Союзы: и, или, но", "sub": "ва, ‑ги, ‑гун, я·ялъуни, амма, гӀадин", "teach": "\n<p class=\"lead\">Союзов в аварском немного. «И» говорят двумя способами: заимствованным\n<b>ва</b> (из арабского) или исконным <b>‑ги</b>, которое вешается на <u>каждое</u> слово.</p>\n<h3>«И» — соединение</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">ва</td><td>и <span class=\"az\">(заимств.)</span></td><td>гӀака <b>ва</b> бече «корова и телёнок»</td></tr>\n<tr><td class=\"v\">‑ги … ‑ги</td><td>и <span class=\"az\">(исконное, на каждом слове)</span></td><td>дун<b>ги</b> мун<b>ги</b> «я и ты»</td></tr>\n</table>\n<div class=\"callout b\">Исконный способ — повторить <b>‑ги</b> после каждого слова: «вац<b>ги</b> яц<b>ги</b>» —\n«брат и сестра»; «гьаниб<b>ги</b> доба<b>ги</b>» — «и здесь, и там».</div>\n<h3>«С, вместе с» — послелог ‑гун / ‑гин</h3>\n<p>Исконное <b>‑гун</b> (вариант <b>‑гин</b>) — это «с / вместе с»; вешается на существительное и часто связывает слова, как «и»:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑гун · ‑гин</td><td>с, вместе с</td><td>вац<b>гун</b> «с братом»; тушбаби<b>гун</b> рагъизе «воевать с врагами»</td></tr>\n</table>\n<h3>«Или», «но», «как»</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">я … я · ялъуни · яги</td><td>или · или же</td><td><b>я</b> дун, <b>я</b> мун «или я, или ты»</td></tr>\n<tr><td class=\"v\">амма</td><td>но, однако <span class=\"az\">(араб.)</span></td><td>… <b>амма</b> хехго вусса «… но быстро возвращайся»</td></tr>\n<tr><td class=\"v\">гӀадин</td><td>как, словно</td><td>дов <b>гӀадин</b> «как он»</td></tr>\n</table>\n<div class=\"callout b\"><b>Короче и исконнее:</b> «или же» — есть короткое <b>яги</b> (= ялъуни). «Но» <b>амма</b> —\nарабское слово; исконное <b>хӀо</b> почти не встречается (его любят пуристы).</div>\n<div class=\"callout g\"><b>Важно:</b> русские «когда, если, чтобы, хотя» в аварском — это\n<u>не</u> отдельные союзы, а окончания глагола (см. урок «Деепричастия и связки»):\nвачӀи<b>ндал</b> «когда пришёл», цӀали<b>зелъун</b> «чтобы прочитать». А «потому что» есть и словом:\n<b>щайгурелъул</b>; «из-за (чего-то)» — <b>сабаблъун</b> (от араб. сабаб «причина»): гьеб <b>сабаблъун</b>\n«из-за этого». И окончание ‑лъул: буге<b>лъул</b> «поскольку есть».</div>\n", "words": [{"ru": "и (араб.)", "av": "ва", "ex": {"av": "гӀака ва бече", "ru": "корова и телёнок"}}, {"ru": "я и ты", "av": "дунги мунги"}, {"ru": "с братом", "av": "вацгун"}, {"ru": "или же", "av": "ялъуни", "alts": [{"av": "я", "ex": {"av": "досдасан я хабар гуро, я кагъат гуро", "ru": "от него нет ни ответа, ни привета; от него нет ни вести, ни письма"}}]}, {"ru": "или же (коротко)", "av": "яги", "alts": [{"av": "яда"}]}, {"ru": "но, однако", "av": "амма", "ex": {"av": "амма хӀакъаб рагӀи", "ru": "в самом деле"}, "alts": [{"av": "но"}]}, {"ru": "потому что", "av": "щайгурелъул", "alts": [{"av": "гьелдалъун"}]}, {"ru": "как, словно", "av": "гӀадин", "ex": {"av": "рохь гӀадин", "ru": "очень много; много, как деревья в лесу"}, "alts": [{"av": "бицанихъе", "ex": {"av": "бицанихъе дос жеги лъади ячун гьечӀо", "ru": "говорят, что он ещё не женат"}}]}], "ex": [{"t": "mcq", "q": "Исконное «и» — вешается на каждое слово:", "opts": ["‑ги", "ва", "амма"], "a": 0}, {"t": "mcq", "q": "«я и ты» (исконно) —", "opts": ["дунги мунги", "дун ва мун", "дун мун"], "a": 0}, {"t": "mcq", "q": "«с братом» (вместе с) —", "opts": ["вацгун", "вацги", "вац ва"], "a": 0}, {"t": "mcq", "q": "«но, однако» —", "opts": ["амма", "ялъуни", "гӀадин"], "a": 0}, {"t": "mcq", "q": "«или же» —", "opts": ["ялъуни", "ва", "‑ги"], "a": 0}, {"t": "say", "q": "Скажи «корова и телёнок» (через ва)", "ans": "гӀака ва бече"}, {"t": "mcq", "q": "Как сказать «и (араб.)»?", "opts": ["чан", "ва", "гьан"], "a": 1}, {"t": "mcq", "q": "Как сказать «я и ты»?", "opts": ["цӀализелъун", "гьанире", "дунги мунги"], "a": 2}, {"t": "mcq", "q": "Как сказать «с братом»?", "opts": ["вацгун", "ишара", "вацал"], "a": 0}, {"t": "mcq", "q": "Как сказать «или же»?", "opts": ["йорчӀами", "ялъуни", "ворчӀами"], "a": 1}], "lvl": "B1"}, {"id": "converb", "emoji": "🔗", "t": "Деепричастия и связки", "sub": "B2: сделав, чтобы, поскольку, когда…", "teach": "\n<p class=\"lead\">Чтобы связывать части предложения, аварский вешает окончания прямо на глагол —\nполучаются деепричастия и «связки» (соответствуют русским «сделав», «чтобы», «поскольку»…).</p>\n<h3>Деепричастия</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ун / ‑н</td><td>сделав (прош.)</td><td>цӀал<b>ун</b> «прочитав»</td></tr>\n<tr><td class=\"v\">‑го</td><td>делая (наст.)</td><td>цӀалула<b>го</b> «читая»</td></tr>\n</table>\n<h3>Связки (обстоятельства)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑зелъун</td><td>чтобы (цель)</td><td>цӀали<b>зелъун</b> «чтобы прочитать»</td></tr>\n<tr><td class=\"v\">‑лъул</td><td>поскольку (причина)</td><td>буге<b>лъул</b> «поскольку есть»</td></tr>\n<tr><td class=\"v\">‑идал / ‑ндал</td><td>когда</td><td>вачӀи<b>ндал</b> «когда пришёл»</td></tr>\n<tr><td class=\"v\">‑зегӀан</td><td>пока не</td><td>цӀали<b>зегӀан</b> «пока не прочтёт»</td></tr>\n<tr><td class=\"v\">‑ниги</td><td>хотя</td><td>буго<b>ниги</b> «хотя есть»</td></tr>\n<tr><td class=\"v\">‑лде</td><td>до того как</td><td>кквела<b>лде</b> «до того как попало»</td></tr>\n</table>\n<div class=\"callout g\"><b>Пример:</b> «хӀалтӀулареб къо буге<b>лъул</b>, кеп гьабулел ратила» —\n«Поскольку день нерабочий, они, наверное, отдыхают».</div>\n<div class=\"callout b\">Это уже настоящий B2. Не обязательно учить всё сразу — достаточно узнавать\nэти хвостики в чужой речи и постепенно вставлять в свою.</div>\n", "words": [{"ru": "прочитав (деепр.)", "av": "цӀалун"}, {"ru": "читая (деепр.)", "av": "цӀалулаго"}, {"ru": "чтобы прочитать", "av": "цӀализелъун"}, {"ru": "поскольку есть", "av": "бугелъул"}, {"ru": "когда пришёл", "av": "вачӀиндал"}, {"ru": "пока не прочтёт", "av": "цӀализегӀан"}, {"ru": "хотя есть", "av": "бугониги"}, {"ru": "до того как", "av": "кквелалде"}], "ex": [{"t": "mcq", "q": "«прочитав» (деепричастие) —", "opts": ["цӀалун", "цӀале", "цӀалила"], "a": 0}, {"t": "mcq", "q": "«чтобы прочитать» — окончание", "opts": ["‑зелъун", "‑лъул", "‑ниги"], "a": 0}, {"t": "mcq", "q": "«поскольку, так как» — окончание", "opts": ["‑лъул", "‑идал", "‑лде"], "a": 0}, {"t": "say", "q": "Скажи «когда пришёл» (вачӀине → …ндал)", "ans": "вачӀиндал"}, {"t": "mcq", "q": "«хотя» —", "opts": ["‑ниги", "‑зегӀан", "‑го"], "a": 0}, {"t": "mcq", "q": "«читая» (одновременно) —", "opts": ["цӀалулаго", "цӀалун", "цӀалани"], "a": 0}, {"t": "mcq", "q": "Как сказать «прочитав (деепр.)»?", "opts": ["гӀака", "цӀалун", "мурад"], "a": 1}, {"t": "mcq", "q": "Как сказать «читая (деепр.)»?", "opts": ["кӀиго", "ункъго", "цӀалулаго"], "a": 2}, {"t": "mcq", "q": "Как сказать «чтобы прочитать»?", "opts": ["цӀализелъун", "вачӀа", "кету"], "a": 0}, {"t": "mcq", "q": "Как сказать «поскольку есть»?", "opts": ["мугӀалим", "бугелъул", "улбул"], "a": 1}], "drill": {"gen": "converb"}, "lvl": "B2"}, {"id": "local", "emoji": "🧭", "t": "Местные падежи: 5 серий", "sub": "B2: где именно — на/у/в/под/внутри", "teach": "\n<p class=\"lead\">Главная «фишка» аварского: локализация — где именно находится предмет.\n<b>5 серий</b> (на / у / в среде / под / внутри полого), у каждой свой суффикс, и к нему\nдобавляется направление: <b>где</b> (базовое) · <b>куда</b> (+е) · <b>откуда</b> (+а/‑са) · <b>насквозь</b> (+н).</p>\n<table class=\"vguide\">\n<tr class=\"head\"><td>Серия</td><td>где?</td><td>куда?</td><td>откуда?</td></tr>\n<tr><td><b>I</b> на, поверх <span class=\"v\">‑да</span></td><td>гъотӀо<b>да</b> «на дереве»</td><td>стол<b>алде</b></td><td>стол<b>алдаса</b></td></tr>\n<tr><td><b>II</b> у, при <span class=\"v\">‑хъ</span></td><td>къватӀа<b>хъ</b> «на улице»</td><td>…хъе</td><td>…хъа</td></tr>\n<tr><td><b>III</b> в среде <span class=\"v\">‑лъ</span></td><td>ро­су<b>лъ</b> «в селе»</td><td>лъада<b>лъе</b> «в воду»</td><td>ро­су<b>лъа</b> «из села»</td></tr>\n<tr><td><b>IV</b> под <span class=\"v\">‑кь</span></td><td>гъотӀо<b>кь</b> «под деревом»</td><td>гъотӀо<b>кье</b> «под дерево»</td><td>…кьа</td></tr>\n<tr><td><b>V</b> внутри полого <span class=\"v\">‑лъу‑</span></td><td>бочка<b>лъуб</b> «в бочке»</td><td>тумбочка<b>лъубе</b> «в тумбочку»</td><td>…лъуса</td></tr>\n</table>\n<div class=\"callout g\"><b>Как выбрать серию?</b> Смотри, ГДЕ предмет: на поверхности → ‑да, рядом → ‑хъ,\nвнутри вещества/массы → ‑лъ, под → ‑кь, внутри полого (ящик, комната, бочка) → ‑лъу‑.\nПотом добавь направление.</div>\n<div class=\"callout b\">Транслатив (‑н, «сквозь / по»): къватӀа<b>хъан</b> «по улицам». Всего получается\n~20 местных форм, но система простая: серия × направление.</div>\n", "words": [{"ru": "на дереве", "av": "гъотӀода"}, {"ru": "под деревом", "av": "гъотӀокь"}, {"ru": "под дерево", "av": "гъотӀокье"}, {"ru": "на улице", "av": "къватӀахъ"}, {"ru": "по улицам", "av": "къватӀахъан"}, {"ru": "в селе", "av": "росулъ", "forms": ["росулъ", "росулъе", "росулъа", "росулъан"], "ex": {"av": "нижер росулъ даруяб ицц буго", "ru": "в нашем ауле минеральный источник"}, "alts": [{"av": "росноб"}]}, {"ru": "в воду", "av": "лъадалъе"}, {"ru": "в тумбочку", "av": "тумбочкалъубе"}, {"ru": "на горе", "av": "магӀарда", "forms": ["магӀарда", "магӀарде", "магӀардаса", "магӀардасан"], "ex": {"av": "магӀарда барти гӀадин", "ru": "как жеребец в горах"}, "alts": [{"av": "магӀарухъ", "ex": {"av": "магӀарухъ гӀурав чи", "ru": "человек, выросший в горах; горец"}}]}], "ex": [{"t": "mcq", "q": "«под деревом» (серия «под») —", "opts": ["гъотӀокь", "гъотӀода", "гъотӀохъ"], "a": 0}, {"t": "mcq", "q": "«на дереве» (серия «на») —", "opts": ["гъотӀода", "гъотӀокь", "гъотӀолъ"], "a": 0}, {"t": "say", "q": "Скажи «под дерево» (куда, ‑кье)", "ans": "гъотӀокье"}, {"t": "mcq", "q": "«в воду» (в среду, куда) —", "opts": ["лъадалъе", "лъелъ", "лъадалъа"], "a": 0}, {"t": "mcq", "q": "Серия «внутри полого» (в бочке, в тумбочке) —", "opts": ["‑лъу‑", "‑да", "‑кь"], "a": 0}, {"t": "say", "q": "Скажи «на улице» (у/при, ‑хъ)", "ans": "къватӀахъ"}, {"t": "mcq", "q": "Как сказать «на дереве»?", "opts": ["анкьго", "гъотӀода", "узухъда"], "a": 1}, {"t": "mcq", "q": "Как сказать «под деревом»?", "opts": ["кӀудада", "микьго", "гъотӀокь"], "a": 2}, {"t": "mcq", "q": "Как сказать «под дерево»?", "opts": ["гъотӀокье", "гьава", "цӀалуларо"], "a": 0}, {"t": "mcq", "q": "Как сказать «на улице»?", "opts": ["гъотӀода", "къватӀахъ", "кквелалде"], "a": 1}], "drill": {"gen": "series"}, "lvl": "B2"}, {"id": "arab", "emoji": "☪️", "t": "Арабизмы", "sub": "C1: книжная лексика и её арабский первоисточник", "teach": "\n<p class=\"lead\">Сотни лет через Коран и науку в аварский вошли <b>арабизмы</b> — они и есть «высокий стиль»:\nна них говорит газета, книга, проповедь. Выучив их, вы <u>одновременно</u> набираете и арабский словарь.</p>\n<div class=\"callout b\"><b>Как читать таблицу:</b> аварское слово · значение · <b>арабский оригинал с огласовкой</b> ·\nтранскрипция и (если сместилось) исходный смысл + форма. <b>Если исходный смысл не указан — значит,\nв арабском значение <u>такое же</u>, как в аварском.</b> Например <b>ихванал</b> «братья» — это аварское\nмножественное <b>‑ал</b>, надетое на арабское <b>إِخْوَان</b> <i>iḵwān</i>, которое само уже мн. число от <b>أخ</b>\n<i>aḵ</i> «брат» — двойное множественное!</div>\n<div class=\"callout g\"><b>Смысл часто сместился.</b> захӀмат в аварском — «труд, старание», а в арабском\n<b>زَحْمَة</b> <i>zaḥma</i> — «теснота, давка». Слова пришли века назад и «застыли» в старом значении.</div>\n<div class=\"callout b\"><b>Как узнавать арабизмы.</b> Глаголы из арабского не заимствовались — брали\n<b>отглагольные имена (масдары)</b>: عِلْم <i>ʿilm</i> → гӀелму, فِكْر <i>fikr</i> → пикру, تَأْرِيخ\n<i>taʾrīḵ</i> → тарих. Прилагательные получают классные окончания <b>‑ав/‑ай/‑аб/‑ал</b>:\nعَزِيز <i>ʿazīz</i> → гӀазизав. Множественное — аварское <b>‑ал</b>: хабар → хабар<b>ал</b>. А глагол\nделают через <b>гьабизе</b>: хӀадур <b>гьабизе</b> «подготовить».</div>\n<h3>Топ‑72 самых частых арабизмов (по корпусу газеты «ХӀакъикъат»)</h3>\n<p class=\"az\">Этот список покрывает огромную долю арабизмов в прессе. Всю массу (сотни слов, делённые\nна <b>частые</b> и <b>редкие</b>) учи в разделе <b>«Картал»</b> — там на обороте карточки полный арабский разбор.\nОтдельная тренировка — в <b>«Гьунар»</b> (чип «☪️ Арабизмы»).</p>\n<table class=\"vguide arabtbl\">\n<tr class=\"head\"><td>авар.</td><td>значение</td><td>عربي</td><td>транскрипция · форма</td></tr>\n<tr><td class=\"v\">амма</td><td>но, однако</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">أَمَّا</td><td class=\"az\">ammā · что касается… то…<br>заимствован без частицы فَ fa; корень (частица)</td></tr><tr><td class=\"v\">гӀумру</td><td>жизнь, возраст</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">عُمْر</td><td class=\"az\">ʿumr<br>корень ʿ-m-r «жить, процветать»</td></tr><tr><td class=\"v\">халкъ</td><td>народ, люди</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">خَلْق</td><td class=\"az\">ḵalq · творение, создание<br>корень ḵ-l-q «создавать»</td></tr><tr><td class=\"v\">тарих</td><td>история; дата, летосчисление</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">تَارِيخ</td><td class=\"az\">tārīḵ<br>корень ʾ-r-ḵ «датировать» (анки-глосса «цифра» — ошибка)</td></tr><tr><td class=\"v\">заман</td><td>время, эпоха</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">زَمَان</td><td class=\"az\">zamān<br>корень z-m-n</td></tr><tr><td class=\"v\">аллагь</td><td>Бог, Аллах</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">اللّٰه</td><td class=\"az\">allāh<br>al- + ʾilāh «божество», корень ʾ-l-h</td></tr><tr><td class=\"v\">хабар</td><td>весть, новость, известие</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">خَبَر</td><td class=\"az\">ḵabar<br>корень ḵ-b-r; мн. أخبار aḵbār</td></tr><tr><td class=\"v\">расул</td><td>посланник, пророк</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">رَسُول</td><td class=\"az\">rasūl<br>корень r-s-l «посылать» (ср. рисала «послание»)</td></tr><tr><td class=\"v\">къадар</td><td>судьба, рок, предопределение</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">قَدَر</td><td class=\"az\">qadar · мера, количество<br>корень q-d-r «мочь, определять»</td></tr><tr><td class=\"v\">хӀакъикъат</td><td>истина, суть, реальность</td><td dir=\"rtl\" lang=\"ar\" style=\"font-size:1.15rem\">حَقِيقَة</td><td class=\"az\">ḥaqīqa<br>корень ḥ-q-q «быть истинным»</td></tr><tr><td class=\"v\">миллат</td><td>нация, народ</td><td dir=\"rtl\" l
