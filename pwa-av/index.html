<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Аварский за час — говорим сразу</title>

<style>
:root{
  --bg:#10161f;--bg2:#161f2c;--card:#1a2433;--card2:#212d3f;
  --ink:#eef4fb;--muted:#93a4bd;--line:#2b384c;
  --red:#ef5466;--grn:#33c67d;--gold:#f3b13a;--blue:#57a8ff;--purp:#a78bfa;
  --av:#ffffff;--ipa:#8fe3b0;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5;padding-bottom:92px}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h2{font-size:1.25rem}h3{font-size:1.02rem;color:var(--gold)}
p{margin:.5em 0}small,.note{color:var(--muted);font-size:.82rem}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:rgba(16,22,31,.86);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:1.6rem;line-height:1}
.brand b{font-size:.98rem}.brand small{display:block;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.toggles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:.72rem;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:5px 9px;cursor:pointer;user-select:none;white-space:nowrap}
.tg b{color:var(--ink)}.tg.on{border-color:var(--grn)}.tg.on b{color:var(--ipa)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(19,26,38,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:.6rem;
  padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav.tabs .ic{font-size:1.15rem;line-height:1}
nav.tabs button.on{color:var(--ink);position:relative}
nav.tabs button.on::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:3px;background:var(--red)}

section.view{display:none;padding:16px 0 10px}
section.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.av{color:var(--av);font-weight:600}
.ipa{color:var(--ipa);font-style:italic;font-size:.9rem}
.az{color:var(--muted);font-size:.85rem}
.hide-ipa .ipa{display:none!important}
.vguide{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
.vguide td{border:1px solid var(--line);padding:6px 9px;vertical-align:middle}
.vguide .v{color:var(--gold);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin:12px 0}
.card.tight{padding:11px 13px}.card h3:first-child{margin-top:0}
.hd{display:flex;align-items:center;gap:8px;margin:22px 0 6px}
.hd .n{font-size:.72rem;color:var(--bg);background:var(--gold);border-radius:6px;padding:2px 7px;font-weight:700}
.lead{color:var(--muted);font-size:.94rem;margin:.2em 0 .8em}

.rowlist{display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);padding:9px 12px}
.row .l{min-width:0}.row .ru{font-size:.9rem}.row .ipa{font-size:.8rem}
.row .av{font-size:1.2rem;text-align:right}
.row.head{background:var(--card2);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:.8rem;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.g.on{background:var(--grn);border-color:var(--grn)}
.chip.b.on{background:var(--blue);border-color:var(--blue);color:#04203f}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--red);color:#fff;
  border:none;border-radius:12px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.grn{background:var(--grn);color:#052}.btn.gold{background:var(--gold);color:#20160a}
.btn.blk{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--blue);color:#04203f}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:110px}
.btn.sm{padding:8px 12px;font-size:.82rem;border-radius:10px}
.play{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--blue);color:#04203f;border:none;font-size:.95rem;cursor:pointer;flex:none}
.play:active{transform:scale(.9)}.play.off{background:var(--card2);color:var(--muted);cursor:default}

.callout{border-left:3px solid var(--line);background:var(--card2);border-radius:0 10px 10px 0;padding:9px 12px;margin:10px 0;font-size:.9rem}
.callout.g{border-color:var(--grn)}.callout.b{border-color:var(--blue)}.callout.r{border-color:var(--red)}

.prog{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--blue));width:0}
.tiles{display:flex;gap:8px;margin:10px 0}
.tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.4rem;color:var(--gold)}.tile small{font-size:.66rem}

.lesson{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin:8px 0;cursor:pointer}
.lesson .badge{width:34px;height:34px;border-radius:9px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:1.1rem;flex:none}
.lesson.done .badge{background:var(--grn);color:#052}.lesson.started .badge{background:var(--gold);color:#20160a}
.lesson .lt{flex:1;min-width:0}.lesson .lt b{font-size:.98rem}.lesson .lt small{display:block;color:var(--muted);font-size:.76rem}
.lesson .arrow{color:var(--muted)}
.back{color:var(--muted);cursor:pointer;font-size:.85rem;display:inline-block;margin:2px 0 6px}

.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 15px;margin:10px 0;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stage .tasktag{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stage .prompt{font-size:1.35rem;font-weight:600}
.stage .ans{font-size:1.5rem;color:var(--ipa)}
.stage .ansru{color:var(--muted);font-size:.95rem}
.grade{display:none;gap:8px;margin-top:4px}.grade.on{display:flex}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 14px;margin:6px 0;font-size:1rem;cursor:pointer;font-family:inherit}
.opt.correct{background:var(--grn);color:#052;border-color:var(--grn)}
.opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.feedback{margin:6px 0;font-weight:600}.feedback.ok{color:var(--grn)}.feedback.no{color:var(--red)}

.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 16px;margin:10px 0;text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}
.flash .kind{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.flash .big{font-size:1.9rem;font-weight:700}
.flash .tap{color:var(--muted);font-size:.8rem;margin-top:6px}
.flash .divider{border-top:1px dashed var(--line);margin:10px 0 4px;padding-top:10px}

input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0}
summary{cursor:pointer;padding:8px 0;font-weight:600}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;-webkit-overflow-scrolling:touch}
.subtabs button{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;font-family:inherit}
.subtabs button.on{background:var(--blue);color:#04203f;border-color:var(--blue)}
.letter{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}
.letter .big{font-size:1.5rem;font-weight:700;min-width:56px}
.letter .li{flex:1;min-width:0}.letter .li .ipa{font-family:ui-monospace,monospace}
.letter .ex{color:var(--muted);font-size:.82rem}
.hdrback{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  width:34px;height:34px;font-size:1.4rem;line-height:1;cursor:pointer;flex:none;font-family:inherit;padding:0}
.hdrback:active{transform:scale(.94)}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:44px;height:44px;
  border-radius:50%;background:var(--blue);color:#04203f;border:none;font-size:1.3rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.fab.show{display:flex}.fab:active{transform:scale(.9)}
</style>
</head>

</div></header>

кое х"], "a": 0}, {"t": "say", "q": "Нажми ▶ у буквы «гӀ» в справочнике (вкладка «Алфавит») и повтори звук.", "ans": "гӀеч — яблоко (там этот звук)"}], "drill": {"gen": "alpha"}, "lvl": "A0"}, {"id": "class", "emoji": "👦👧", "t": "Классал ва «вуго»", "sub": "Три класса и слово «есть»", "teach": "\n<p class=\"lead\">В аварском у каждого существительного есть <b>класс</b> (похоже на род).\nКласс показывает не сама буква слова, а «классный показатель» — <b>в / й / б</b>:</p>\n<table class=\"vguide\">\n<tr><td><b>I класс</b> — <span class=\"v\">в</span></td><td>мужчины, мальчики</td><td>вас <span class=\"az\">мальчик</span></td></tr>\n<tr><td><b>II класс</b> — <span class=\"v\">й</span></td><td>женщины, девочки</td><td>яс <span class=\"az\">девочка</span></td></tr>\n<tr><td><b>III класс</b> — <span class=\"v\">б</span></td><td>вещи, животные, всё остальное</td><td>чу <span class=\"az\">лошадь</span></td></tr>\n<tr><td><b>Мн. число</b> — <span class=\"v\">р</span></td><td>много кого/чего угодно</td><td>лъимал <span class=\"az\">дети</span></td></tr>\n</table>\n<p>Слово <b>«есть / является»</b> тоже меняется по классу — это одно из самых нужных слов:</p>\n<table class=\"vguide\">\n<tr><td>I (он)</td><td class=\"v\">вуго</td><td>Дов вас <b>вуго</b> <span class=\"az\">Он мальчик</span></td></tr>\n<tr><td>II (она)</td><td class=\"v\">йиго</td><td>Дой яс <b>йиго</b> <span class=\"az\">Она девочка</span></td></tr>\n<tr><td>III (это)</td><td class=\"v\">буго</td><td>Доб чу <b>буго</b> <span class=\"az\">Это лошадь</span></td></tr>\n<tr><td>мн.</td><td class=\"v\">руго</td><td>Дол лъимал <b>руго</b> <span class=\"az\">Это дети</span></td></tr>\n</table>\n<div class=\"callout g\"><b>Про тебя.</b> Если ты говоришь о себе: мальчик/мужчина —\n«Дун … <b>вуго</b>», девочка/женщина — «Дун … <b>йиго</b>». Переключи ♂/♀ вверху — примеры изменятся!</div>\n", "words": [{"ru": "я", "av": "дун"}, {"ru": "ты", "av": "мун"}, {"ru": "он (тот)", "av": "дов", "cls": "I"}, {"ru": "она (та)", "av": → йиго)</td></tr>\n<tr><td>Щиб хӀал бугеб?</td><td>Как дела? <span class=\"az\">Ответ: ЛъикӀ буго — Хорошо</span></td></tr>\n</table>\n<div class=\"callout g\"><b>Имя «сидит на» человеке.</b> Поэтому для имён — падеж на <b>‑да</b>:\n<b>ду<u>да</u></b> «на тебе», <b>ди<u>да</u></b> «на мне». Отсюда «Дуда цӀар щиб?» и «Дида цӀар Муса буго».\n(Сказать «Дир цӀар … буго» — «моё имя …» — тоже можно, но живая форма — с ‑да.)</div>\n<div class=\"callout b\"><b>Спасибо</b> — <b>баркала</b>. <b>Да</b> — <b>гьо</b>, <b>нет</b> — <b>гьечӀо</b>.\nВежливого «вы» в аварском нет — даже старшим говорят «мун» (ты).</div>\n", "words": [{"ru": "здравствуй (м.)", "av": "ворчӀами"}, {"ru": "здравствуй (ж.)", "av": "йорчӀами"}, {"ru": "здравствуйте (мн.)", "av": "рорчӀами"}, {"ru": "имя", "av": "цӀар"}, {"ru": "как тебя зовут?", "av": "дуда цӀар щиб?"}, {"ru": "спасибо", "av": "баркала"}, {"ru": "да", "av": "гьо"}, {"ru": "нет", "av": "гьечӀо"}, {"ru": "друг", "av": "гьудул"}], "ex": [{"t": "mcq", "q": "Ты здороваешься с девочкой. Что скажешь?", "opts": ["ЙорчӀами!", "ВорчӀами!", "РорчӀами!"], "a": 0}, {"t": "say", "q": "Спроси: «Как тебя зовут?»", "ans": "Дуда цӀар щиб?"}, {"t": "mcq", "q": "«Спасибо» по-аварски —", "opts": ["Баркала", "ГьечӀо", "Гьо"], "a": 0}, {"t": "say", "q": "Мальчик Муса представляется: «Я — Муса».", "ans": "Дун Муса вуго"}, {"t": "mcq", "q": "Как сказать «здравствуй (м.)»?", "opts": ["рорчӀами", "ворчӀами", "лъимер"], "a": 1}, {"t": "mcq", "q": "Как сказать «здравствуй (ж.)»?", "opts": ["кӀудияб", "гьо", "йорчӀами"], "a": 2}], "drill": {"gen": "greet"}, "lvl": "A1"}, {"id": "this", "emoji": "👉", "t": "Гьаб, гьеб, доб", "sub": "Это… / то… + что это?", "teach": "\n<p class=\"lead\">Указательные слова тоже берут классный показатель. Для вещей (III класс) — на <b>-б</b>:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">гьаб</td><td>это (рядом)</td><td>Гьаб тӀехь буго <span class=\"az\">Это книга</span></td></tr>\n<tr><td class=\"v\">гьеб</td><td>то (чуть дальше)</td><td>Гьеб къалам буго <span class=\"az\">Это ручка</span></td></tr>\n<tr><td class=\"v\">доб</td><td>то (далеко)</td><td>Доб рукъ буго <span class=\"az\">То — дом</span></td></tr>\n</table>\n<p>Вопрос про вещь: <b>Гьаб щиб бугеб?</b> — «Это что?». Отвечаем: <b>Гьаб … буго</b>.</p>\n<div class=\"callout g\">Порядок слов простой: <b>[Это] [вещь] буго</b>. Слово «буго» всегда в конце\nи его нельзя пропускать (в отличие от русского «это — книга»).</div>\n", "words": [{"ru": "это (рядом)", "av": "гьаб", "cls": "III"}, {"ru": "то", "av": "гьеб", "cls": "III"}, {"ru": "то (далеко)", "av": "доб", "cls": "III"}, {"ru": "что это?", "av": "гьаб щиб бугеб?"}, {"ru": "книга", "av": "тӀехь", "cls": "III"}, {"ru": "ручка", "av": "къалам", "cls": "III"}, {"ru": "стол", "av": "стол", "cls": "III"}, {"ru": "дверь", "av": "нуцӀа", "cls": "III"}, {"ru": "окно", "av": "гордо", "cls": "III"}, {"ru": "вещь", "av": "жо", "cls": "III"}, {"ru": "дом", "av": "рукъ", "cls": "III"}], "ex": [{"t": "mcq", "q": "Как сказать «Это книга»?", "opts": ["Гьаб тӀехь буго", "Гьаб тӀехь вуго", "Доб яс йиго"], "a": 0}, {"t": "say", "q": "Скажи: «То — дом» (это дом вдалеке)", "ans": "Доб рукъ буго"}, {"t": "mcq", "q": "Слово «буго» ставится…", "opts": ["В конце предложения", "В начале", "Можно опустить"], "a": 0}, {"t": "mcq", "q": "Как сказать «это (рядом)»?", "opts": ["гьеб", "гьаб", "гӀурччинаб"], "a": 1}, {"t": "mcq", "q": "Как сказать «то»?", "opts": ["щуго", "стол", "гьеб"], "a": 2}, {"t": "mcq", "q": "Как сказать «то (далеко)»?", "opts": ["доб", "жо", "чан"], "a": 0}], "drill": {"gen": "thisis"}, "lvl": "A1"}, {"id": "my", "emoji": "👪", "t": "Дир, дур — моя семья", "sub": "Мой / твой + родные", "teach": "\n<p class=\"lead\"><b>Дир</b> — мой/моя/моё, <b>дур</b> — твой/твоя/твоё. Они не меняются по классу,\nно «есть» после них — меняется:</p>\n<table class=\"vguide\">\n<tr><td>Дир вац <b class=\"v\">вуго</b></td><td>У меня есть брат <span class=\"az\">(брат — I класс)</span></td></tr>\n<tr><td>Дир яц <b class=\"v\">йиго</b></td><td>У меня есть сестра <span class=\"az\">(сестра — II класс)</span></td></tr>\n<tr><td>Дир чу <b class=\"v\">буго</b></td><td>У меня есть лошадь <span class=\"az\">(вещь/животное — III)</span></td></tr>\n<tr><td>Дир лъимал <b class=\"v\">руго</b></td><td>У меня есть дети <span class=\"az\">(мн. число)</span></td></tr>\n</table>\n<div class=\"callout b\">«У меня есть …» в аварском — это просто <b>«Дир … вуго/йиго/буго/руго»</b>\n(букв. «моё … есть»). Выбирай в/й/б/р по классу того, о ком говоришь.</div>\n", "words": [{"ru": "мой", "av": "дир"}, {"ru": "твой", "av": "дур"}, {"ru": "брат", "av": "вац", "cls": "I"}, {"ru": "сестра", "av": "яц", "cls": "II"}, {"ru": "бабушка", "av": "кӀодо", "cls": "II"}, {"ru": "дедушка", "av": "кӀудада", "cls": "I"}, {"ru": "семья", "av": "хъизан", "cls": "III"}, {"ru": "ребёнок", "av": "лъимер", "cls": "III"}, {"ru": "муж", "av": "рос", "cls": "I"}, {"ru": "жена", "av": "лъади", "cls": "II"}, {"ru": "человек", "av": "чи", "cls": "I"}], "ex": [{"t": "mcq", "q": "«У меня есть сестра» —", "opts": ["Дир яц йиго", "Дир яц вуго", "Дир вац буго"], "a": 0}, {"t": "say", "q": "Скажи: «У меня есть брат»", "ans": "Дир вац вуго"}, {"t": "mcq", "q": "«Твой» по-аварски —", "opts": ["дур", "дир", "доб"], "a": 0}, {"t": "say", "q": "Скажи: «У меня есть дети»", "ans": "Дир лъимал руго"}, {"t": "mcq", "q": "Как сказать «мой»?", "opts": ["жо", "дир", "квер"], "a": 1}, {"t": "mcq", "q": "Как сказать «твой»?", "opts": ["гьекъезе", "вац", "дур"], "a": 2}], "drill": {"gen": "possess"}, "lvl": "A1"}, {"id": "adj", "emoji": "🌈", "t": "Сифатал ва кьерал", "sub": "Признаки и цвета (согласование)", "teach": "\n<p class=\"lead\">Прилагательное <b>согласуется с классом</b>: последняя буква меняется на в/й/б/л.\nСловарная форма — на <b>-б</b> (для вещей).</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">кӀудияб</td><td>большой (III)</td><td>кӀудия<b>б</b> рукъ <span class=\"az\">большой дом</span></td></tr>\n<tr><td class=\"v\">кӀудияв</td><td>большой (I, о мужчине)</td><td>кӀудия<b>в</b> вас <span class=\"az\">большой мальчик</span></td></tr>\n<tr><td class=\"v\">кӀудияй</td><td>большая (II, о женщине)</td><td>кӀудия<b>й</b> яс <span class=\"az\">большая девочка</span></td></tr>\n<tr><td class=\"v\">кӀудиял</td><td>большие (мн.)</td><td>кӀудия<b>л</b> лъимал <span class=\"az\">большие дети</span></td></tr>\n</table>\n<div class=\"callout g\">Правило простое: бери словарную форму (…аб), замени последнюю <b>б</b> на\n<b>в</b> (муж.), <b>й</b> (жен.), <b>л</b> (мн.) — и всё согласовано.</div>\n<h3>Два случая — не путай!</h3>\n<table class=\"vguide\">\n<tr><td><b>Признак</b> (перед словом, <u>без</u> «буго»)</td><td class=\"v\">лъикӀаб тӀехь</td><td>хорошая книга</td></tr>\n<tr><td></td><td class=\"v\">берцинай яс</td><td>красивая девочка</td></tr>\n<tr><td><b>Сказуемое</b> (после слова, <u>с</u> «буго»)</td><td class=\"v\">ТӀехь лъикӀаб буго</td><td>Книга хорошая</td></tr>\n<tr><td></td><td class=\"v\">Вас кӀудияв вуго</td><td>Мальчик большой</td></tr></table>\n<div class=\"callout b\">«хорошая книга» — это просто <b>словосочетание</b>: «лъикӀаб тӀехь» (без «буго»!).\nА «Книга хорошая» — это уже <b>целое предложение</b> (о чём-то говорим), тут слово ставится\nвперёд и добавляется «буго»: «ТӀехь лъикӀаб буго».</div>\n", "words": [{"ru": "хороший", "av": "лъикӀаб", "cls": "III"}, {"ru": "плохой", "av": "квешаб", "cls": "III"}, {"ru": "большой", "av": "кӀудияб", "cls": "III"}, {"ru": "маленький", "av": "гьитӀинаб", "cls": "III"}, {"ru": "новый", "av": "цӀияб", "cls": "III"}, {"ru": "красивый", "av": "берцинаб", "cls": "III"}, {"ru": "белый", "av": "хъахӀаб", "cls": "III"}, {"ru": "чёрный", "av": "чӀегӀераб", "cls": "III"}, {"ru": "красный", "av": "багӀараб", "cls": "III"}, {"ru": "жёлтый", "av": "гӀобилаб", "cls": "III"}, {"ru": "зелёный", "av": "гӀурччинаб", "cls": "III"}, {"ru": "синий", "av": "хъахӀилаб", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Большой мальчик» (словосочетание, I класс) —", "opts": ["кӀудияв вас", "кӀудияв вас вуго", "вас кӀудияв"], "a": 0}, {"t": "say", "q": "Скажи словосочетание «хорошая книга» (тӀехь — III, без «буго»!)", "ans": "лъикӀаб тӀехь"}, {"t": "say", "q": "Скажи словосочетание «красивая девочка» (яс, II, без «буго»!)", "ans": "берцинай яс"}, {"t": "mcq", "q": "Чтобы согласовать с девочкой (II), последняя буква прилагательного —", "opts": ["й", "в", "б"], "a": 0}, {"t": "say", "q": "А теперь предложение: «Мальчик большой» (вас, I)", "ans": "Вас кӀудияв вуго"}, {"t": "mcq", "q": "«Книга хорошая» (предложение) —", "opts": ["ТӀехь лъикӀаб буго", "лъикӀаб тӀехь буго", "лъикӀаб тӀехь"], "a": 0}], "drill": {"gen": "adj"}, "lvl": "A1"}, {"id": "num", "emoji": "🔢", "t": "РикӀкӀаби", "sub": "Числа 1–10 и счёт", "teach": "\n<p class=\"lead\">Считаем: числа оканчиваются на <b>-го</b>. Перед словом «-го» часто отпадает:\n<b>кӀи<span class=\"az\">-</span>го вас</b> — «два мальчика».</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">цо</td><td>1</td><td class=\"v\">анлъго</td><td>6</td></tr>\n<tr><td class=\"v\">кӀиго</td><td>2</td><td class=\"v\">анкьго</td><td>7</td></tr>\n<tr><td class=\"v\">лъабго</td><td>3</td><td class=\"v\">микьго</td><td>8</td></tr>\n<tr><td class=\"v\">ункъго</td><td>4</td><td class=\"v\">ичӀго</td><td>9</td></tr>\n<tr><td class=\"v\">щуго</td><td>5</td><td class=\"v\">анцӀго</td><td>10</td></tr>\n</table>\n<p>Вопрос «сколько?» — <b>чан?</b>. Например: <b>Чан гӀеч бугеб?</b> — «Сколько яблок?».</p>\n<div class=\"callout b\">Интересно: после 10 аварцы считают двадцатками — <b>къого</b> = 20,\n<b>кӀикъого</b> = 40 (букв. «два-двадцать»). Но для начала хватит 1–10!</div>\n", "words": [{"ru": "1", "av": "цо"}, {"ru": "2", "av": "кӀиго"}, {"ru": "3", "av": "лъабго"}, {"ru": "4", "av": "ункъго"}, {"ru": "5", "av": "щуго"}, {"ru": "6", "av": "анлъго"}, {"ru": "7", "av": "анкьго"}, {"ru": "8", "av": "микьго"}, {"ru": "9", "av": "ичӀго"}, {"ru": "10", "av": "анцӀго"}, {"ru": "сколько?", "av": "чан"}, {"ru": "глаз", "av": "бер", "cls": "III"}, {"ru": "рука", "av": "квер", "cls": "III"}, {"ru": "нога", "av": "бох", "cls": "III"}, {"ru": "голова", "av": "бетӀер", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Два» по-аварски —", "opts": ["кӀиго", "лъабго", "цо"], "a": 0}, {"t": "say", "q": "Скажи: «три дома» (рукъ)", "ans": "лъабго рукъ"}, {"t": "mcq", "q": "Что значит «чан?»", "opts": ["Сколько?", "Что?", "Где?"], "a": 0}, {"t": "say", "q": "Посчитай: цо, кӀиго, …? (назови «три»)", "ans": "лъабго"}, {"t": "mcq", "q": "Как сказать «1»?", "opts": ["квешаб", "цо", "гьой"], "a": 1}, {"t": "mcq", "q": "Как сказать «2»?", "opts": ["ччугӀа", "цӀияб", "кӀиго"], "a": 2}], "drill": {"gen": "num"}, "lvl": "A1"}, {"id": "pres", "emoji": "🍽️", "t": "Настоящее время", "sub": "Что делаю? (‑ула) + еда", "teach": "\n<p class=\"lead\">Глагол в настоящем времени оканчивается на <b>‑ула / ‑уна</b>:\n<b>цӀал‑ула</b> «читает», <b>кван‑ала</b> «ест», <b>гьекъ‑ола</b> «пьёт».</p>\n<table class=\"vguide\">\n<tr><td>цӀализе → цӀал<b class=\"v\">ула</b></td><td>читать → читает/читаю</td></tr>\n<tr><td>хъвазе → хъ<b class=\"v\">вала</b></td><td>писать → пишет</td></tr>\n<tr><td>кваназе → кван<b class=\"v\">ала</b></td><td>есть → ест</td></tr>\n</table>\n<div class=\"callout g\"><b>Важно (эргатив).</b> Кто что-то <i>делает с предметом</i>, стоит с окончанием\n<b>‑ца</b>: <b>Дица тӀехь цӀалула</b> — «Я читаю книгу» (букв. «мной книга читается»).\n«Дун» → «Ди<b>ца</b>», «мун» → «Ду<b>ца</b>».</div>\n<p>Форма глагола не зависит от класса читающего — меняется только «‑ца» у деятеля.</p>\n<div class=\"callout r\"><b>Порядок слов: глагол — в конце!</b> Аварский — язык <b>SOV</b>:\nподлежащее → дополнение → <b>глагол</b> (в русском SVO: «я <u>читаю</u> книгу»). По-аварски —\n«Дица тӀехь <u>цӀалула</u>» (я книгу <u>читаю</u>). Глагол и «буго» уходят в самый конец.\nПорядок гибкий, но по умолчанию — глагол последним.</div>\n", "words": [{"ru": "читать", "av": "цӀализе", "cls": "III"}, {"ru": "писать", "av": "хъвазе", "cls": "III"}, {"ru": "есть/кушать", "av": "квине", "cls": "III"}, {"ru": "пить", "av": "гьекъезе", "cls": "III"}, {"ru": "знать", "av": "лъазе", "cls": "III"}, {"ru": "смотреть", "av": "балагьизе", "cls": "III"}, {"ru": "я (эрг.)", "av": "дица"}, {"ru": "ты (эрг.)", "av": "дуца"}, {"ru": "письмо", "av": "кагъат", "cls": "III"}, {"ru": "хлеб", "av": "чед", "cls": "III"}, {"ru": "вода", "av": "лъим", "cls": "III"}, {"ru": "мясо", "av": "гьан", "cls": "III"}, {"ru": "яблоко", "av": "гӀеч", "cls": "III"}, {"ru": "молоко", "av": "рахь", "cls": "III"}, {"ru": "еда", "av": "квен", "cls": "III"}], "ex": [{"t": "mcq", "q": "«Я читаю книгу» —", "opts": ["Дица тӀехь цӀалула", "Дун тӀехь цӀалула", "Дир тӀехь буго"], "a": 0}, {"t": "say", "q": "Скажи: «Я пью воду» (гьекъезе → гьекъола)", "ans": "Дица лъим гьекъола"}, {"t": "mcq", "q": "Окончание настоящего времени —", "opts": ["‑ула/‑уна", "‑ана", "‑ила"], "a": 0}, {"t": "mcq", "q": "Как сказать «читать»?", "opts": ["багӀараб", "цӀализе", "сон"], "a": 1}, {"t": "mcq", "q": "Как сказать «писать»?", "opts": ["цӀалила", "хъахӀилаб", "хъвазе"], "a": 2}, {"t": "mcq", "q": "Как сказать «есть/кушать»?", "opts": ["квине", "лъабго", "бакъ"], "a": 0}], "drill": {"gen": "verbpres"}, "lvl": "A2"}, {"id": "want", "emoji": "🎒", "t": "Хочу и могу", "sub": "Бокьун буго / кӀола + школа", "teach": "\n<p class=\"lead\">Сказать «хочу» и «могу» — это уже настоящая речь!</p>\n<table class=\"vguide\">\n<tr><td>Дие … <b>бокьун буго</b></td><td>Я хочу … <span class=\"az\">(мне … желаемо есть)</span></td></tr>\n<tr><td>Дида … <b>кӀола</b></td><td>Я могу / умею … <span class=\"az\">(мне … по силам)</span></td></tr>\n</table>\n<p>Обрати внимание: «я» здесь — <b>дие</b> (хочу) или <b>дида</b> (могу), не «дун».\nЭто разные падежи слова «я»; пока просто запомни две готовые формулы.</p>\n<div class=\"callout b\">Пример: <b>Дие тӀехь бокьун буго</b> — «Я хочу книгу».\n<b>Дида цӀ<span class=\"v\">али</span>зе кӀола</b> — «Я умею читать».<br>\n(<b>кӀола</b> — «могу» сейчас; n<div class=\"callout b\">Осторожно с формами! <b>Кванай!</b> — «Кушай!» (приказ). А «квана» — это уже\nдругое (от «квине» — съев). Слушай окончание.</div>\n", "words": [{"ru": "возьми!", "av": "босе"}, {"ru": "читай!", "av": "цӀале"}, {"ru": "приходи!", "av": "вачӀа"}, {"ru": "вставай!", "av": "вахъа"}, {"ru": "кушай!", "av": "кванай"}, {"ru": "пиши!", "av": "хъвай"}, {"ru": "смотри!", "av": "балагье"}, {"ru": "не читай!", "av": "цӀалуге"}], "ex": [{"t": "mcq", "q": "«Возьми!» —", "opts": ["Босе!", "Босила", "БосечӀо"], "a": 0}, {"t": "say", "q": "Скажи: «Смотри!»", "ans": "Балагье"}, {"t": "mcq", "q": "«Кушай!» (приказ) —", "opts": ["Кванай!", "Квана", "Кванала"], "a": 0}, {"t": "mcq", "q": "Запрет «не читай!» — какое окончание?", "opts": ["‑ге (цӀалуге)", "‑е", "‑ила"], "a": 0}, {"t": "say", "q": "Скажи: «Пиши!» (хъвазе → хъвай)", "ans": "Хъвай"}, {"t": "mcq", "q": "«Приходи!» —", "opts": ["ВачӀа!", "ВачӀана", "ВачӀине"], "a": 0}], "drill": {"gen": "imper"}, "lvl": "A2"}, {"id": "quest", "emoji": "❓", "t": "Вопросы", "sub": "Что? кто? где? + одежда", "teach": "\n<p class=\"lead\">Вопросительные слова — половина разговора:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">щиб?</td><td>что?</td><td class=\"v\">киб?</td><td>где?</td></tr>\n<tr><td class=\"v\">щив?</td><td>кто? (о мужчине)</td><td class=\"v\">кида?</td><td>когда?</td></tr>\n<tr><td class=\"v\">щий?</td><td>кто? (о женщине)</td><td class=\"v\">щай?</td><td>почему?</td></tr>\n<tr><td class=\"v\">кин?</td><td>как?</td><td class=\"v\">чан?</td><td>сколько?</td></tr>\n</table>\n<p>Вопрос «да/нет» — частица <b>‑ищ</b> на глаголе: <b>Мун вачӀанищ?</b> — «Ты пришёл?».</p>\n<div class=\"callout b\">Заметь: «кто?» тоже с классом — <b>щив?</b> о мужчине, <b>щий?</b> о женщине,\n<b>щиб?</b> о вещи. Аварский любит классы во всём!</div>\n", "words": [{"ru": "что?", "av": "щиб"}, {"ru": "кто? (м.)", "av": "щив"}, {"ru": "кто? (ж.)", "av": "щий"}, {"ru": "где?", "av": "киб"}, {"ru": "когда?", "av": "кида"}, {"ru":  б‑"], "a": 0}, {"t": "say", "q": "Скажи: «Я иду» (дун)", "ans": "Дун ине"}, {"t": "mcq", "q": "Как сказать «здесь»?", "opts": ["хӀинчӀ", "гьаниб", "доб"], "a": 1}, {"t": "mcq", "q": "Как сказать «там»?", "opts": ["эмен", "цӀцӀе", "гьениб"], "a": 2}, {"t": "mcq", "q": "Как сказать «сюда»?", "opts": ["гьанибе", "гьабуна", "ворчӀами"], "a": 0}], "drill": {"gen": "place"}, "lvl": "A2"}, {"id": "talk", "emoji": "💬", "t": "Говорим!", "sub": "Собираем всё вместе", "teach": "\n<p class=\"lead\">Ты уже знаешь классы, «есть», числа, цвета, вопросы, прошедшее и будущее.\nСоберём короткий диалог:</p>\n<table class=\"vguide\">\n<tr><td>— ВорчӀами! Дуда цӀар щиб?</td><td>— Привет! Как тебя зовут?</td></tr>\n<tr><td>— Дида цӀар Муса буго. Дун цӀалдохъан вуго.</td><td>— Меня зовут Муса. Я ученик.</td></tr>\n<tr><td>— Дур чан сон бугеб?</td><td>— Сколько тебе лет? <span class=\"az\">(букв. твоих сколько лет есть)</span></td></tr>\n<tr><td>— Дир анцӀго сон буго. Баркала!</td><td>— Мне 10 лет. Спасибо!</td></tr>\n</table>\n<div class=\"callout b\">Слово <b>сон</b> здесь — «год (возраста)»: <b>анцӀго сон</b> — «десять лет».\n(То же слово может значить «вчера» — по смыслу понятно, о чём речь.)</div>\n\n<div class=\"callout b\">Продолжай тренироваться в разделе «Гьунар» (Тренировка) — там бесконечные\nзадания по всем темам. Говори вслух — так язык запоминается быстрее всего!</div>\n", "words": [{"ru": "сколько тебе лет?", "av": "дур чан сон бугеб?"}, {"ru": "мне … лет", "av": "дир … сон буго"}, {"ru": "гость", "av": "гьобол", "cls": "I"}, {"ru": "сосед", "av": "мадугьал", "cls": "I"}, {"ru": "хорошо/ладно", "av": "лъикӀ"}], "ex": [{"t": "say", "q": "Поздоровайся с девочкой и спроси имя", "ans": "ЙорчӀами! Дуда цӀар щиб?"}, {"t": "say", "q": "Скажи: «Меня зовут … , я ученик» (мальчик)", "ans": "Дида цӀар … буго. Дун цӀалдохъан вуго."}, {"t": "mcq", "q": "«Сколько тебе лет?» —", "opts": ["Дур чан сон бугеб?", "Дуда цӀар щиб?", "Мун вачӀанищ?"], "a": 0}, {"t": "mcq", "q": "Как сказать «гость»?", "opts": ["жакъа", "гьобол", "рорчӀами"], "a": 1}, {"t": "mcq", "q": "Как сказать «сосед»?", "opts": ["гьаб", "къо", "мадугьал"], "a": 2}, {"t": "mcq", "q": "Как сказать «хорошо/ладно»?", "opts": ["лъикӀ", "лъагӀел", "гордо"], "a": 0}], "drill": {"gen": "talk"}, "lvl": "A2"}, {"id": "loan", "emoji": "🔌", "t": "Заимствования", "sub": "Говори, даже если не знаешь слово", "teach": "\n<p class=\"lead\">Не знаешь аварское слово? <b>Не молчи!</b> Аварцы всегда вставляют русские,\nарабские, английские слова — и ты можешь. Главное — оформить их по-аварски. С этим приёмом\nты говоришь на любую тему уже сегодня.</p>\n<h3>Способ 1: слово + <b>гьабизе</b> («делать»)</h3>\n<table class=\"vguide\">\n<tr><td>проверка <b>гьабизе</b></td><td>проверять <span class=\"az\">(букв. «делать проверку»)</span></td></tr>\n<tr><td>ремонт <b>гьабизе</b></td><td>ремонтировать</td></tr>\n<tr><td>звонок <b>гьабизе</b></td><td>позвонить</td></tr></table>\n<h3>Способ 2 (по-нативному): корень + <b>‑изе</b></h3>\n<p>Бери русский или английский корень и делай аварский глагол на <b>‑изе</b> — а потом склоняй\nкак обычный аварский глагол!</p>\n<table class=\"vguide\">\n<tr><td>проверить → <b class=\"v\">провер‑изе</b></td><td>наст. провер‑ула, прош. провер‑ана</td></tr>\n<tr><td>англ. check → <b class=\"v\">чек‑изе</b></td><td>«чекнуть, проверить»</td></tr>\n<tr><td>гуглить → <b class=\"v\">гугл‑изе</b></td><td>«погуглить»</td></tr></table>\n<div class=\"callout g\"><b>Целая фраза:</b><br>\n<b>Дие провер‑изе бокьун буго, документалда щиб хъван бугеб‑али.</b><br>\n<span class=\"az\">«Я хочу проверить, что написано в документе».</span></div>\n<div class=\"callout r\"><b>Порядок слов: глагол — в конце!</b> Аварский — язык <b>SOV</b> (подлежащее–дополнение–глагол),\nа не SVO как русский. Сравни: рус. «я хочу <u>проверить</u>» → авар. «дие <u>провер‑изе</u> бокьун буго»\n(«хочу/буго» уходит в самый конец). Порядок гибкий, но по умолчанию — глагол в конце.</div>\n<h3>Заимствованные существительные берут аварские падежи</h3>\n<table class=\"vguide\">\n<tr><td>документ → <b>документалда</b></td><td>в документе</td></tr>\n<tr><td>интернет → <b>интернеталда</b></td><td>в интернете</td></tr>\n<tr><td>телефон → <b>телефоналде</b></td><td>на телефон</td></tr></table>\n<div class=\"callout b\"><b>«‑бали / ‑али»</b> на конце глагола = русское <b>«ли»</b> (косвенный вопрос):\n<b>бугеб‑али</b> «есть ли», <b>хъван бугеб‑али</b> «написано ли». Легко запомнить — созвучно с «ли».\nМожно и <b>бугин-гьечӀин</b> «есть-нет».</div>\n<h3>Универсальные формулы словообразования</h3>\n<p>Не зубри такие слова — <b>строй их на ходу</b> (корень аварский, русский или международный + «хвостик»):</p>\n<table class=\"vguide\">\n<tr><td>+ <b class=\"v\">‑ялъулаб</b> (‑ский)</td><td>Москва → Москваялъулаб</td><td>московский</td></tr>\n<tr><td>+ <b class=\"v\">‑кияб</b> (‑ический)</td><td>техника → тезникияб · энергия → энергикияб</td><td>технический</td></tr>\n<tr><td>+ <b class=\"v\">‑лъи</b> (‑ость/‑ство)</td><td>берцинаб → берцинлъи · бечед → бечелъи</td><td>красота, богатство</td></tr>\n<tr><td>+ <b class=\"v\">‑лъизе</b> (стать…)</td><td>цо «один» → цолъизе</td><td>объединиться</td></tr>\n<tr><td>+ <b class=\"v\">‑го</b> (наречие)</td><td>лъикӀ → лъикӀго</td><td>хорошо</td></tr>\n</table>\n<div class=\"callout b\"><b>Так строится половина слов.</b> Взял корень — надел нужный хвостик: <b>‑ялъулаб / ‑кияб</b>\n(прилагательное), <b>‑лъи</b> (свойство), <b>‑лъизе</b> (стать таким), <b>‑го</b> (наречие).\nСогласуй прилагательное по классу (‑в/‑й/‑б). Это тоже «модернизация» языка.</div>\n<div class=\"callout g\"><b>Про «значит»:</b> <b>гьединлъидал</b> — прежде всего «поэтому, следовательно» (союз-вывод).\nА глагол «означать» одним словом не сказать — через <b>магӀна</b> «смысл»: «гьелъул магӀна…» — «это значит…».</div>\n<h3>Слова-связки (вставляй в речь)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">масала</td><td>например</td><td class=\"v\">амма</td><td>но, однако</td></tr>\n<tr><td class=\"v\">ва</td><td>и</td><td class=\"v\">яги</td><td>или</td></tr>\n<tr><td class=\"v\">цинги</td><td>потом, затем</td><td class=\"v\">гьединлъидал</td><td>поэтому, значит</td></tr>\n<tr><td class=\"v\">узухъда</td><td>конечно</td><td class=\"v\">хӀакъикъаталда</td><td>на самом деле</td></tr></table>\n<div class=\"callout b\">Если выучить ~1000 слов, основную грамматику и уметь вот так вставлять\nрусские/английские слова — это уже свободная живая речь (честный B1 и выше). Смешивать языки —\nнормально, это живой «суржик», на котором реально говорят.</div>\n", "words": [{"ru": "делать (универсально)", "av": "гьабизе"}, {"ru": "проверить (заимств.)", "av": "проверизе"}, {"ru": "например", "av": "масала"}, {"ru": "но, однако", "av": "амма"}, {"ru": "и", "av": "ва"}, {"ru": "или", "av": "яги"}, {"ru": "потом, затем", "av": "цинги"}, {"ru": "поэтому, значит", "av": "гьединлъидал"}, {"ru": "конечно", "av": "узухъда"}, {"ru": "на самом деле", "av": "хӀакъикъаталда"}, {"ru": "…ли (косв. вопрос)", "av": "‑бали"}, {"ru": "в документе", "av": "документалда"}], "ex": [{"t": "mcq", "q": "Как оформить русский глагол «проверить» по-аварски (2-й способ)?", "opts": ["проверизе", "проверитьун", "проверский"], "a": 0}, {"t": "say", "q": "Скажи: «Я хочу проверить» (провер‑изе)", "ans": "Дие проверизе бокьун буго"}, {"t": "mcq", "q": "«‑бали» на конце глагола значит…", "opts": ["«ли» (вопрос: есть ли…)", "приказ", "прошедшее время"], "a": 0}, {"t": "mcq", "q": "«в документе» (заимств. слово + падеж) —", "opts": ["документалда", "документlevel", "в документе"], "a": 0}, {"t": "mcq", "q": "«например» по-аварски —", "opts": ["масала", "амма", "яги"], "a": 0}, {"t": "mcq", "q": "Способ 1 вставить слово —", "opts": ["слово + гьабизе («делать»)", "убрать все гласные", "добавить ‑ский"], "a": 0}, {"t": "say", "q": "Скажи «Я хочу погуглить» (гугл‑изе)", "ans": "Дие гуглизе бокьун буго"}], "drill": {"gen": "loan"}, "lvl": "A2"}, {"id": "vforms", "emoji": "🔧", "t": "Все формы глагола", "sub": "Продвинуто: спряжение целиком", "teach": "\n<p class=\"lead\">Один глагол — много форм. Возьмём <b>цӀализе</b> «читать» и посмотрим целиком.\nМеняется только окончание (основа <b>цӀал‑</b> одна):</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">цӀал‑ула</td><td>настоящее — читает</td></tr>\n<tr><td class=\"v\">цӀал‑ана</td><td>прошедшее — читал</td></tr>\n<tr><td class=\"v\">цӀал‑ила</td><td>будущее — прочтёт</td></tr>\n<tr><td class=\"v\">цӀал‑е</td><td>приказ — читай!</td></tr>\n<tr><td class=\"v\">цӀалу‑ла‑ро</td><td>не читает (‑ро)</td></tr>\n<tr><td class=\"v\">цӀали‑чӀо</td><td>не читал (‑чӀо)</td></tr>\n<tr><td class=\"v\">цӀал‑ун</td><td>деепричастие — прочитав</td></tr>\n<tr><td class=\"v\">цӀал‑улеб</td><td>причастие — читающий</td></tr>\n<tr><td class=\"v\">цӀал‑и</td><td>масдар — чтение (имя действия)</td></tr>\n<tr><td class=\"v\">цӀал‑ани</td><td>условное — если прочтёт</td></tr>\n</table>\n<div class=\"callout g\"><b>Инфинитив ‑изе или ‑ине?</b> Большинство глаголов на <b>‑изе</b> (цӀал‑изе, гьаб‑изе),\nно часть — на <b>‑ине</b>: <b>ине</b> «идти», <b>вачӀине</b> «приходить», <b>ретӀине</b> «надевать»,\n<b>бачине</b> «вести». Спрягаются они одинаково, разница только в инфинитиве.</div>\n<div class=\"callout r\"><b>Осторожно, «ложные друзья»!</b> ‑изе и ‑ине могут дать совсем разные слова:\n<b>бахъизе</b> «снимать, вытаскивать» (и «сурат бахъизе» — рисовать / сфотографировать) ≠\n<b>бахъине</b> «вставать». Одна буква — другое слово!</div>\n", "words": [{"ru": "деепричастие: прочитав", "av": "цӀалун"}, {"ru": "причастие: читающий", "av": "цӀалулеб"}, {"ru": "масдар: чтение", "av": "цӀали"}, {"ru": "не читает", "av": "цӀалуларо"}, {"ru": "надевать (‑ине)", "av": "ретӀине"}, {"ru": "вести (‑ине, перех.)", "av": "бачине"}], "ex": [{"t": "mcq", "q": "«цӀалун» — это…", "opts": ["деепричастие: «прочитав»", "приказ", "будущее"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в прошедшее время", "ans": "цӀалана"}, {"t": "mcq", "q": "Инфинитив «приходить» —", "opt esRu": "пью", "pastRu": "выпил(а)", "obj": "лъим", "objRu": "воду", "pres": "гьекъола", "fut": "гьекъела", "futRu": "выпью", "past": "гьекъана", "imp": "гьекъе", "tr": true}, {"inf": "балагьизе", "ru": "смотреть", "presRu": "смотрю", "pastRu": "посмотрел(а)", "obj": "", "objRu": "", "pres": "балагьула", "fut": "балагьила", "futRu": "посмотрю", "past": "балагьана", "imp": "балагье", "tr": false}, {"inf": "босизе", "ru": "брать", "presRu": "беру", "pastRu": "взял(а)", "obj": "тӀехь", "objRu": "книгу", "pres": "босула", "fut": "босила", "futRu": "возьму", "past": "босана", "imp": "босе", "tr": true}], "cases": {"pron": [{"ru": "«я» (дун)", "forms": [["я (кто?)", "дун"], ["я (эрг.)", "дица"], ["мой", "дир"], ["мне", "дие"], ["у меня", "дида"], ["ко мне", "диде"], ["от меня", "дидаса"]]}, {"ru": "«ты» (мун)", "forms": [["ты (кто?)", "мун"], ["ты (эрг.)", "дуца"], ["твой", "дур"], ["тебе", "дуе"], ["у тебя", "дуда"], ["к тебе", "дуде"], ["от тебя", "дудаса"]]}], "local": [{"ru": "стол", "forms": [["на столе (где?)", "столалда"], ["на стол (куда?)", "столалде"], ["со стола (откуда?)", "столалдаса"]]}, {"ru": "село (росу)", "forms": [["в селе (где?)", "росулъ"], ["в село (куда?)", "росулъе"], ["из села (откуда?)", "росулъа"]]}]}, "conds": [{"ru": "если прочтёт", "av": "цӀалани"}, {"ru": "если напишет", "av": "хъвани"}, {"ru": "если придёт", "av": "вачӀани"}, {"ru": "если не прочтёт", "av": "цӀаличӀони"}, {"ru": "если бы было", "av": "букӀарабани"}, {"ru": "если бы не было", "av": "букӀинчӀебани"}, {"ru": "если бы знал(а)", "av": "лъалеб букӀарабани"}], "series": [{"ru": "на дереве (на, ‑да)", "av": "гъотӀода"}, {"ru": "под деревом (под, ‑кь)", "av": "гъотӀокь"}, {"ru": "под дерево (куда, ‑кье)", "av": "гъотӀокье"}, {"ru": "на улице (у/при, ‑хъ)", "av": "къватӀахъ"}, {"ru": "по улицам (насквозь, ‑хъан)", "av": "къватӀахъан"}, {"ru": "в селе (в среде, ‑лъ)", "av": "росулъ"}, {"ru": "из села (откуда, ‑лъа)", "av": "росулъа"}, {"ru": "в воду (куда, ‑лъе)", "av": "лъадалъе"}, {"ru": "на столе (на, ‑да)", "av": "столалда"}, {"ru": "со стола (откуда, ‑даса)", "av": "столалдаса"}, {"ru": "на горе (на, ‑да)", "av": "магӀарда"}, {"ru": "в тумбочку (внутрь, ‑лъубе)", "av": "тумбочкалъубе"}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('appdata').textContent);

/* ---------------- state ---------------- */
const S = JSON.parse(localStorage.getItem('avk_state')||'{}');
if(S.ipa===undefined)S.ipa=true; if(!S.gender)S.gender='m'; if(!S.tab)S.tab='home';
function save(){localStorage.setItem('avk_state',JSON.stringify(S));}
const PROG = JSON.parse(localStorage.getItem('avk_prog')||'{}');
if(!PROG.lessons)PROG.lessons={}; if(!PROG.drill)PROG.drill={a:0,c:0,byKey:{}};
function saveProg(){localStorage.setItem('avk_prog',JSON.stringify(PROG));}
const SRS = JSON.parse(localStorage.getItem('avk_srs')||'{}');
function saveSrs(){localStorage.setItem('avk_srs',JSON.stringify(SRS));}

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* class agreement */
const CM={I:'в',II:'й',III:'б',PL:'р'};
const COP={I:'вуго',II:'йиго',III:'буго',PL:'руго'};
const DEM={I:'дов',II:'дой',III:'доб'};          // «тот»
function cop(cls){return COP[cls];}
function selfCls(){return S.gender==='f'?'II':'I';}   // класс говорящего о себе
function agreeAdj(adjB,cls){return adjB.slice(0,-1)+ (cls==='I'?'в':cls==='II'?'й':cls==='III'?'б':'л');}
const P=DATA.pools;   // {I:[{av,ru}],II,III,adj}

/* ---- Cyrillic -> IPA transliterator (built from the alphabet's own IPA map) ---- */
const nk=s=>s.toLowerCase().replace(/ӏ/g,'Ӏ');   // lowercase + canonical palochka (U+04C0)
const IPA=(()=>{
  const m={};
  const clean=ipa=>ipa.split('/')[0].trim();      // "e / je" -> "e"
  const put=(L,ipa)=>{L.split(' ').forEach(p=>{if(p)m[nk(p)]=clean(ipa);});};
  DATA.special.forEach(x=>put(x.L,x.ipa));
  DATA.alphabet.forEach(x=>put(x.L,x.ipa));
  Object.assign(m,{'е':'e','э':'e','я':'ja','ю':'ju','ё':'jo','ы':'ɨ','ь':'ʲ','ф':'f','ъ':'ʔ'});
  return m;
})();
function translit(word){
  if(!word)return '';
  const s=word.replace(/ӏ/g,'Ӏ'); let out=''; let i=0;
  while(i<s.length){
    const two=nk(s.substr(i,2));
    const one=nk(s[i]);
    if(/\s/.test(s[i])){out+=' ';i++;continue;}
    if(/[.,!?;:—…()«»"'-]/.test(s[i])){out+=s[i];i++;continue;}
    if(IPA[two]){out+=IPA[two];i+=2;}
    else if(IPA[one]){out+=IPA[one];i+=1;}
    else {out+=s[i];i++;}
  }
  return out;
}
// pronunciation span (hidden when the "Произношение" toggle is off, via .hide-ipa)
function pron(av){return `<span class="ipa">[${esc(translit(av))}]</span>`;}

/* ---------------- audio ---------------- */
let _audio=null;
function playAudio(file,btn){
  if(!file)return;
  try{ if(_audio){_audio.pause();} _audio=new Audio(file); _audio.play().catch(()=>{});
    if(btn){btn.textContent='🔊';setTimeout(()=>btn.textContent='▶',700);} }catch(e){}
}

/* ---------------- toggles ---------------- */
function applyToggles(){
  document.body.classList.toggle('hide-ipa',!S.ipa);
  $('ipaState').textContent=S.ipa?'ON':'OFF';
  $('tgIpa').classList.toggle('on',S.ipa);
  $('genState').textContent=S.gender==='m'?'♂ м':'♀ ж';
  $('tgGen').classList.toggle('on',S.gender==='f');
}
function toggleIpa(){S.ipa=!S.ipa;save();applyToggles();}
function toggleGender(){S.gender=S.gender==='m'?'f':'m';save();applyToggles();renderAll();}

/* ---------------- progress ---------------- */
function lp(id){return PROG.lessons[id]||(PROG.lessons[id]={seen:false,done:false,a:0,c:0,miss:0});}
function recLesson(id,ok){const l=lp(id);l.seen=true;l.a++;ok?l.c++:l.miss++;recDay();saveProg();}
function recDrill(key,label,ok){const d=PROG.drill;d.a++;if(ok)d.c++;
  const e=d.byKey[key]||(d.byKey[key]={a:0,c:0,miss:0,label});e.label=label;e.a++;e[ok?'c':'miss']++;recDay();saveProg();}
/* daily streak + goal */
const DAILY_GOAL=20;
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function recDay(){if(!PROG.days)PROG.days={};const t=dkey(new Date());PROG.days[t]=(PROG.days[t]||0)+1;}
function todayCount(){return (PROG.days&&PROG.days[dkey(new Date())])||0;}
function streak(){if(!PROG.days)return 0;let s=0;const d=new Date();
  if(!PROG.days[dkey(d)])d.setDate(d.getDate()-1);        // grace: today not yet done
  while(PROG.days[dkey(d)]){s++;d.setDate(d.getDate()-1);}
  return s;}
function lessonsDone(){return Object.values(PROG.lessons).filter(l=>l.done).length;}
function acc(){const d=PROG.drill;return d.a?Math.round(100*d.c/d.a):0;}

/* wordbank of every taught item (for cards) */
function allVocab(){
  const out=[]; const seen=new Set();
  DATA.themes.forEach(t=>t.words.forEach(w=>{const k=w.av+'|'+w.ru;if(!seen.has(k)){seen.add(k);out.push({av:w.av,ru:w.ru,tag:t.title});}}));
  DATA.lessons.forEach(l=>(l.words||[]).forEach(w=>{const k=w.av+'|'+w.ru;if(!seen.has(k)){seen.add(k);out.push({av:w.av,ru:w.ru,tag:l.t});}}));
  return out;
}

/* ================= DRILL GENERATORS ================= */
/* each returns {ru, av, tag} — ru shown, av produced */
const GEN={
 alpha(){const x=pick(DATA.special.concat(DATA.alphabet.filter(a=>a.audio)));
   return {ru:'Как звучит «'+x.L.split(' ')[0]+'»? (пример: '+x.ex+' — '+x.exru+')',
           av:x.hint+'  ['+x.ipa+']', tag:'звук', audio:x.audio};},
 copula(){const r=Math.random();
   if(r<0.5){const c=selfCls();const w=pick(c==='II'?P.selfII:P.selfI);
     return {ru:'Я '+w.ru,av:'Дун '+w.av+' '+cop(c),tag:'вуго/йиго'};}
   const cls=pick(['I','II','III']);const w=pick(P[cls]);
   return {ru:(cls==='I'?'Он ':cls==='II'?'Она ':'Это ')+w.ru,av:DEM[cls]+' '+w.av+' '+cop(cls),tag:'классы'};},
 greet(){const g=pick([
     {ru:'Здравствуй (девочке)',av:'ЙорчӀами!'},{ru:'Здравствуй (мальчику)',av:'ВорчӀами!'},
     {ru:'Здравствуйте (многим)',av:'РорчӀами!'},{ru:'Как тебя зовут?',av:'Дуда цӀар щиб?'},
     {ru:'Спасибо',av:'Баркала'},{ru:'Как дела?',av:'Щиб хӀал бугеб?'},{ru:'Хорошо',av:'ЛъикӀ буго'},
     {ru:'Я '+(S.gender==='f'?'(девочка)':'(мальчик)')+' — Муса/Аминат',av:'Дун '+(S.gender==='f'?'Аминат йиго':'Муса вуго')}]);
   return {...g,tag:'приветствие'};},
 thisis(){const w=pick(P.III);return {ru:'Это '+w.ru,av:'Гьаб '+w.av+' буго',tag:'это…'};},
 possess(){const cls=pick(['I','II','III']);const w=pick(P[cls]);
   return {ru:'У меня есть '+w.ru,av:'Дир '+w.av+' '+cop(cls),tag:'дир…'};},
 adj(){const cls=pick(['I','II','III']);const w=pick(P[cls]);
   const pool=cls==='III'?P.adj:P.adj.filter(a=>a.p);const a=pick(pool);
   // predicative: [noun] [agreed adjective] [copula] = «Вас гьитӀинав вуго» (Мальчик маленький)
   return {ru:cap(w.ru)+' — '+a.ru+' (какой?)',av:cap(w.av)+' '+agreeAdj(a.av,cls)+' '+cop(cls),tag:'сказуемое'};},
 num(){const num=pick(DATA.numbers);const w=pick(P.III);
   return {ru:num.ru+' × '+w.ru,av:num.av+' '+w.av,tag:'счёт'};},
 verbpres(){const v=pick(DATA.verbs);
   if(v.tr)return {ru:'Я '+v.presRu+' '+v.objRu,av:'Дица '+v.obj+' '+v.pres,tag:'наст. время'};
   return {ru:'Я '+v.presRu,av:'Дун '+v.pres,tag:'наст. время'};},
 want(){if(Math.random()<0.5){const v=pick(DATA.verbs.filter(v=>v.tr));
     return {ru:'Я хочу '+v.objRu,av:'Дие '+v.obj+' бокьун буго',tag:'хочу'};}
   const v=pick(DATA.verbs);return {ru:'Я умею '+v.ru,av:'Дида '+v.inf+' кӀола',tag:'могу'};},
 neg(){if(Math.random()<0.5){const cls=pick(['I','II','III']);const w=pick(P[cls]);
     return {ru:cap(w.ru)+' — нет',av:cap(w.av)+' гьечӀо',tag:'нет'};}
   const v=pick(DATA.verbs);return {ru:'Я не '+v.presRu,av:'Дун '+v.pres+'ро',tag:'‑ро'};},
 past(){if(Math.random()<0.55){const c=selfCls();
     return {ru:'Я '+(S.gender==='f'?'пришла':'пришёл'),av:'Дун '+(c==='II'?'йачӀана':'вачӀана'),tag:'прош. время'};}
   const v=pick(DATA.verbs.filter(v=>v.tr));return {ru:'Я '+v.pastRu+' '+v.objRu,av:'Дица '+v.obj+' '+v.past,tag:'прош. время'};},
 imper(){const g=pick([{ru:'Возьми!',av:'Босе!'},{ru:'Смотри!',av:'Балагье!'},{ru:'Кушай!',av:'Кванай!'},
     {ru:'Приходи!',av:'ВачӀа!'},{ru:'Пиши!',av:'Хъвай!'},{ru:'Читай!',av:'ЦӀале!'},
     {ru:'Вставай!',av:'Вахъа!'},{ru:'Не читай!',av:'ЦӀалуге!'},{ru:'Давай! (дай)',av:'Кье!'}]);return {...g,tag:'просьба'};},
 future(){const v=pick(DATA.verbs.filter(x=>x.fut));
   if(v.tr)return {ru:'Я '+v.futRu+' '+v.objRu,av:'Дица '+v.obj+' '+v.fut,tag:'буд. время'};
   return {ru:'Я '+v.futRu,av:'Дун '+v.fut,tag:'буд. время'};},
 vform(){const v=pick(DATA.verbs);
   const F=[['настоящее (делает)',v.pres],['прошедшее (сделал)',v.past],['приказ (сделай!)',v.imp],
     ['отрицание наст. (не делает)',v.pres+'ро'],['если … (условное)',v.past.replace(/на$/,'ни')]];
   if(v.fut)F.push(['будущее (сделает)',v.fut]);
   if(v.conv)F.push(['деепричастие (сделав)',v.conv]);
   if(v.part)F.push(['причастие (…ющий)',v.part]);
   const f=pick(F);
   return {ru:v.ru+' («'+v.inf+'») → '+f[0],av:f[1],tag:'формы глагола'};},
 cases(){const p=pick(DATA.cases.pron);const c=pick(p.forms);
   return {ru:p.ru+' → '+c[0],av:c[1],tag:'падежи'};},
 localcase(){const nn=pick(DATA.cases.local);const c=pick(nn.forms);
   return {ru:nn.ru+' → '+c[0],av:c[1],tag:'местные падежи'};},
 cond(){return {...pick(DATA.conds),tag:'условное'};},
 casemix(){return Math.random()<0.5?GEN.cases():GEN.localcase();},
 series(){const s=pick(DATA.series);return {ru:s.ru,av:s.av,tag:'местные падежи'};},
 converb(){return {...pick([
     {ru:'прочитав (деепр.)',av:'цӀалун'},{ru:'читая (деепр.)',av:'цӀалулаго'},
     {ru:'чтобы прочитать',av:'цӀализелъун'},{ru:'поскольку есть',av:'бугелъул'},
     {ru:'когда пришёл',av:'вачӀиндал'},{ru:'пока не прочтёт',av:'цӀализегӀан'},
     {ru:'хотя есть',av:'бугониги'},{ru:'до того как попало',av:'кквелалде'}]),tag:'связки'};},
 quest(){const g=pick([{ru:'что?',av:'щиб?'},{ru:'кто? (о мужчине)',av:'щив?'},{ru:'кто? (о женщине)',av:'щий?'},
     {ru:'где?',av:'киб?'},{ru:'когда?',av:'кида?'},{ru:'как?',av:'кин?'},{ru:'почему?',av:'щай?'},{ru:'сколько?',av:'чан?'}]);
   return {...g,tag:'вопрос'};},
 place(){const g=pick([{ru:'здесь',av:'гьаниб'},{ru:'там',av:'гьениб'},{ru:'сюда',av:'гьанибе'},{ru:'туда',av:'гьанире'},
     {ru:'Я иду',av:'Дун ине'},{ru:'Она идёт',av:'Дой ине'}]);return {...g,tag:'место'};},
 loan(){return {...pick([
     {ru:'Я хочу проверить (провер‑изе)',av:'Дие проверизе бокьун буго'},
     {ru:'Я хочу погуглить (гугл‑изе)',av:'Дие гуглизе бокьун буго'},
     {ru:'сделать ремонт',av:'ремонт гьабизе'},
     {ru:'позвонить (звонок сделать)',av:'звонок гьабизе'},
     {ru:'в документе',av:'документалда'},{ru:'в интернете',av:'интернеталда'},
     {ru:'что написано? (написано ли)',av:'Щиб хъван бугебали?'},
     {ru:'например',av:'масала'},{ru:'но, однако',av:'амма'},{ru:'или',av:'яги'},
     {ru:'потом, затем',av:'цинги'},{ru:'конечно',av:'узухъда'},{ru:'поэтому, значит',av:'гьединлъидал'}]),tag:'заимствования'};},
 talk(){return pick([GEN.greet(),GEN.copula(),GEN.possess(),GEN.num(),GEN.past(),GEN.quest(),GEN.loan()]);},
 vocab(words){const w=pick(words);return {ru:w.ru,av:w.av,tag:'слова'};},
};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function capital(s){return cap(s);}
function ruObj(v){return v.ru==='читать'?'книгу':v.ru==='писать'?'письмо':v.ru==='есть'?'хлеб':v.ru==='пить'?'воду':'';}
function plural(ru,num){return ru;} // keep russian noun simple in gloss

function genFor(spec){
  if(!spec) return GEN.vocab(allVocab());
  if(spec.gen==='vocab') return GEN.vocab(spec.words&&spec.words.length?spec.words:allVocab());
  const f=GEN[spec.gen]; return f?f():GEN.vocab(allVocab());
}

const drills={};
function drillHTML(id){return `
 <div class="chips" style="justify-content:center;margin-bottom:2px">
   <span class="chip on" id="${id}_mSay" onclick="drillMode('${id}',false)">🗣️ Сказать</span>
   <span class="chip b" id="${id}_mType" onclick="drillMode('${id}',true)">⌨️ Печатать</span>
 </div>
 <div class="stage" id="${id}_stage"></div>
 <div class="feedback" id="${id}_fb" style="text-align:center"></div>
 <div id="${id}_type" style="display:none">
   <input type="text" id="${id}_in" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Напиши по-аварски…" onkeydown="if(event.key==='Enter')drillCheck('${id}')">
   <div class="btnrow" style="margin-top:8px">
     <button class="btn blue" onclick="drillCheck('${id}')">Проверить</button>
     <button class="btn ghost" onclick="drillNew('${id}')">↻ Дальше</button></div>
 </div>
 <div id="${id}_reveal">
   <div class="btnrow">
     <button class="btn blue" onclick="drillShow('${id}')" id="${id}_show">Показать ответ</button>
     <button class="btn ghost" onclick="drillNew('${id}')">↻ Дальше</button>
   </div>
   <div class="grade" id="${id}_grade">
     <button class="btn blk" style="flex:1" onclick="drillGrade('${id}',0)">Не смог</button>
     <button class="btn grn" style="flex:1" onclick="drillGrade('${id}',1)">Смог ✓</button>
   </div>
 </div>
 <div class="note" id="${id}_sess" style="text-align:center">0 сделано</div>`;}
function drillMount(id,spec,key,label){drills[id]={spec,key:key||'G:'+(spec&&spec.gen||'mix'),label:label||'Тренировка',cur:null,shown:false,typing:false,sess:{a:0,c:0}};drillNew(id);}
function normAns(s){return (s||'').toLowerCase().replace(/ӏ/g,'').replace(/ё/g,'е').replace(/[^а-я]/g,'');}
function drillMode(id,typing){const d=drills[id];if(!d)return;d.typing=typing;
  $(id+'_mSay').classList.toggle('on',!typing);$(id+'_mType').classList.toggle('on',typing);
  $(id+'_type').style.display=typing?'':'none';$(id+'_reveal').style.display=typing?'none':'';
  drillNew(id);}
function drillNew(id){const d=drills[id];d.cur=genFor(d.spec);d.shown=false;
  const inp=$(id+'_in');if(inp)inp.value='';const fb=$(id+'_fb');if(fb){fb.textContent='';fb.className='feedback';}
  drillRender(id);if(inp&&d.typing)inp.focus();}
function drillRender(id){const d=drills[id],c=d.cur;
  $(id+'_stage').innerHTML=`<div class="tasktag">${esc(c.tag||'')}</div>
    <div class="prompt">${esc(c.ru)}</div>`+
    (d.shown?`<div class="ans">${esc(c.av)}</div><div class="ipa" style="font-size:.95rem">[${esc(translit(c.av))}]</div>`+(c.audio?`<div><button class="play" onclick="playAudio('${c.audio}',this)">▶</button></div>`:''):'');
  const show=$(id+'_show');if(show)show.style.display=d.shown?'none':'';
  $(id+'_grade').classList.toggle('on',d.shown&&!d.typing);
  $(id+'_sess').textContent=d.sess.a+' сделано · '+(d.sess.a?Math.round(100*d.sess.c/d.sess.a):0)+'% верно';
}
function drillShow(id){drills[id].shown=true;drillRender(id);if(drills[id].cur.audio)playAudio(drills[id].cur.audio);
  const g=$(id+'_grade'); if(g&&g.scrollIntoView)setTimeout(()=>g.scrollIntoView({behavior:'smooth',block:'center'}),30);}
function drillGrade(id,ok){const d=drills[id];d.sess.a++;if(ok)d.sess.c++;recDrill(d.key,d.label,!!ok);drillNew(id);}
function drillCheck(id){const d=drills[id];const inp=$(id+'_in');const val=inp?inp.value:'';
  if(!val.trim())return;
  const ok=normAns(val)===normAns(d.cur.av);
  d.shown=true;d.sess.a++;if(ok)d.sess.c++;recDrill(d.key,d.label,ok);
  drillRender(id);
  const fb=$(id+'_fb');if(fb){fb.textContent=ok?'Верно! ✓ '+d.cur.av:'Не совсем. Правильно: '+d.cur.av;fb.className='feedback '+(ok?'ok':'no');}
}

function everyWord(){
  const out=allVocab(); const map=new Map(out.map(w=>[w.av+'|'+w.ru,w]));
  (DATA.freq||[]).forEach(L=>L.words.forEach(w=>{const key=w.av+'|'+w.ru;
    const e=map.get(key);
    if(e){ if(w.ex&&!e.ex)e.ex=w.ex; if(w.forms&&!e.forms)e.forms=w.forms; if(w.alts&&!e.alts)e.alts=w.alts; }
    else { const n={...w,tag:L.title}; map.set(key,n); out.push(n); }
  }));
  return out;
}

      <span class="chip b ${cardDir==='ru2av'?'on':''}" onclick="cardDirSet('ru2av')">Рус → Авар</span>
      <span class="chip b ${cardDir==='av2ru'?'on':''}" onclick="cardDirSet('av2ru')">Авар → Рус</span>
    </div>
    <div class="chips">
      <span class="chip ${cmode==='all'?'on':''}" onclick="cmSet('all')">Все слова</span>
      ${freqChips}
    </div>
    <div class="chips">
      ${DATA.themes.map(t=>`<span class="chip ${cmode===t.id?'on':''}" onclick="cmSet('${t.id}')">${t.emoji} ${esc(t.title)}</span>`).join('')}
    </div>
    <div id="cardbox"></div>`;
  buildDeck();showCard();
}
function cmSet(m){cmode=m;renderCards();}
function cardDirSet(d){cardDir=d;flipped=false;renderCards();}
function buildDeck(){
  let src;
  if(cmode==='all') src=everyWord();
  else if(cmode.startsWith('freq:')){const L=(DATA.freq||[]).find(x=>'freq:'+x.id===cmode);src=(L?L.words:[]).map(w=>({...w,tag:L?L.title:''}));}
  else src=(DATA.themes.find(t=>t.id===cmode)?.words||[]).map(w=>({...w,tag:cmode}));
  // spaced: prioritise low box
  deck=shuffle(src).sort((a,b)=>(SRS[a.av+'|'+a.ru]||0)-(SRS[b.av+'|'+b.ru]||0));
  ci=0;flipped=false;
}
function cardReveal(c){
  // rich back of the card: pronunciation, synonyms, dictionary forms, usage example
  let h=`<div class="ipa" style="font-size:1rem">[${esc(translit(c.av))}]</div>`;
  if(c.alts&&c.alts.length) h+=`<div class="az" style="margin-top:4px">синонимы: ${c.alts.map(esc).join(', ')}</div>`;
  if(c.forms&&c.forms.length>1) h+=`<div class="divider"></div><div class="az" style="font-size:.8rem">формы: <span class="av" style="font-weight:400">${c.forms.slice(0,6).map(esc).join(' · ')}</span></div>`;
  if(c.ex) h+=`<div class="divider"></div><div class="av" style="font-size:1.05rem">${esc(c.ex.av)}</div><div class="az">${esc(c.ex.ru)}</div>`;
  h+=`<div class="az" style="margin-top:6px;font-size:.72rem">${esc(c.tag||'')}</div>`;
  return h;
}
function showCard(){
  const box=$('cardbox');if(!deck.length){box.innerHTML='<div class="card">Нет карточек</div>';return;}
  const c=deck[ci%deck.length];const key=c.av+'|'+c.ru;const box_=SRS[key]||0;
  const front = cardDir==='av2ru' ? c.av : c.ru;
  const back  = cardDir==='av2ru' ? c.ru : c.av;
  box.innerHTML=`<div class="note" style="text-align:center">${(ci%deck.length)+1} / ${deck.length} · уровень ${box_}</div>
   <div class="flash" onclick="flipCard()">
     <div class="kind">${flipped?(cardDir==='av2ru'?'перевод':'аварский'):(cardDir==='av2ru'?'аварский':'русский')}</div>
     <div class="big">${esc(flipped?back:front)}${(!flipped&&cardDir==='av2ru')?`<div class="ipa" style="font-size:.9rem">[${esc(translit(c.av))}]</div>`:''}</div>
     ${flipped?cardReveal(c):'<div class="tap">нажми, чтобы перевернуть</div>'}
   </div>
   ${flipped?`<div class="btnrow" id="cardGrade">
     <button class="btn blk" onclick="gradeCard(0)">Снова</button>
     <button class="btn" onclick="gradeCard(1)">Норм</button>
     <button class="btn grn" onclick="gradeCard(2)">Легко</button></div>`:
     `<div class="btnrow"><button class="btn blue" onclick="flipCard()">Перевернуть</button></div>`}`;
}
function flipCard(){flipped=!flipped;showCard();
  if(flipped){const g=$('cardGrade'); if(g&&g.scrollIntoView)setTimeout(()=>g.scrollIntoView({behavior:'smooth',block:'end'}),40);}}
function gradeCard(g){const c=deck[ci%deck.length];const key=c.av+'|'+c.ru;
  let b=SRS[key]||0; b=g===0?Math.max(0,b-1):g===2?Math.min(5,b+2):Math.min(5,b+1);
  SRS[key]=b;saveSrs(); recDay();saveProg(); ci++;flipped=false;showCard();}

/* ---------------- install / platform ---------------- */
function platform(){
  const ua=(navigator.userAgent||'');
  if(/iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) return 'ios';
  if(/android/i.test(ua)) return 'android';
  return 'desktop';
}
function isStandalone(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
}
let deferredPrompt=null;
if(window.addEventListener) window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const b=$('installBtn'); if(b)b.style.display='';});
function doInstall(){ if(deferredPrompt){deferredPrompt.prompt();
  if(deferredPrompt.userChoice)deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderHome();}); } }
function installHTML(){
  if(isStandalone()) return '';
  const p=platform();
  if(p==='ios') return `<div class="callout b" style="text-align:left"><b>📲 Установить как приложение (iPhone / iPad):</b>
    <div style="margin-top:4px">1. Нажми <b>Поделиться</b> <span style="font-size:1.1em">􀈂</span> (квадрат со стрелкой ⬆️, внизу Safari).<br>
    2. Пролистай и выбери <b>«На экран «Домой»»</b>.<br>
    3. Нажми <b>«Добавить»</b> — иконка появится на рабочем столе!</div></div>`;
  if(p==='android') return `<div class="callout b" style="text-align:left"><b>📲 Установить как приложение (Android):</b>
    <div style="margin-top:4px">Нажми кнопку ниже, либо меню <b>⋮</b> в Chrome → <b>«Установить приложение»</b> (или «Добавить на главный экран»).</div>
    <button class="btn grn" id="installBtn" style="margin-top:8px;display:${deferredPrompt?'':'none'}" onclick="doInstall()">📲 Установить</button></div>`;
  return `<div class="callout b" style="text-align:left"><b>📲 Установить на компьютер:</b>
    <div style="margin-top:4px">Нажми значок установки <b>⊕</b> в адресной строке браузера (или меню → «Установить приложение…»).</div>
    <button class="btn grn" id="installBtn" style="margin-top:8px;display:${deferredPrompt?'':'none'}" onclick="doInstall()">📲 Установить</button></div>`;
}

/* ---------------- onboarding ---------------- */
function maybeOnboard(){
  if(S.onboarded)return;
  const o=document.createElement('div'); o.id='onb';
  o.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(8,11,17,.92);display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto';
  o.innerHTML=`<div class="card" style="max-width:380px;text-align:center;margin:auto">
    <div style="font-size:2.4rem">🏔️</div>
    <h2>ВорчӀами! Добро пожаловать</h2>
    <p class="lead">Это курс аварского для русскоговорящих. Ты заговоришь с первого урока.</p>
    <p class="lead">Курс подстраивается под тебя: когда говоришь <b>о себе</b>, окончания зависят от того,
      парень ты (класс I «<b>в</b>»: Дун вуго) или девушка (класс II «<b>й</b>»: Дун йиго).</p>
    <div class="btnrow" style="margin-top:6px">
      <button class="btn" onclick="pickGender('m')">♂ Я парень</button>
      <button class="btn blue" onclick="pickGender('f')">♀ Я девушка</button>
    </div>
    ${installHTML()}
    <p class="note" style="margin-top:10px">Пол можно поменять кнопкой «Я» вверху справа.
      Кнопка «Произн.» покажет произношение [IPA] у всех слов.</p></div>`;
  document.body.appendChild(o);
}
function pickGender(g){S.gender=g;S.onboarded=true;save();applyToggles();const o=$('onb');if(o&&o.remove)o.remove();renderAll();}

/* ---------------- boot ---------------- */
applyToggles();renderAll();go(S.tab);maybeOnboard();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
