<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Аварский за час — говорим сразу</title>

<style>
:root{
  --bg:#10161f;--bg2:#161f2c;--card:#1a2433;--card2:#212d3f;
  --ink:#eef4fb;--muted:#93a4bd;--line:#2b384c;
  --red:#ef5466;--grn:#33c67d;--gold:#f3b13a;--blue:#57a8ff;--purp:#a78bfa;
  --av:#ffffff;--ipa:#8fe3b0;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.5;padding-bottom:92px}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
h2{font-size:1.25rem}h3{font-size:1.02rem;color:var(--gold)}
p{margin:.5em 0}small,.note{color:var(--muted);font-size:.82rem}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);
  background:rgba(16,22,31,.86);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:1.6rem;line-height:1}
.brand b{font-size:.98rem}.brand small{display:block;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.toggles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tg{font-size:.72rem;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:5px 9px;cursor:pointer;user-select:none;white-space:nowrap}
.tg b{color:var(--ink)}.tg.on{border-color:var(--grn)}.tg.on b{color:var(--ipa)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:rgba(19,26,38,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:.6rem;
  padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav.tabs .ic{font-size:1.15rem;line-height:1}
nav.tabs button.on{color:var(--ink);position:relative}
nav.tabs button.on::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:3px;background:var(--red)}

section.view{display:none;padding:16px 0 10px}
section.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.av{color:var(--av);font-weight:600}
.ipa{color:var(--ipa);font-style:italic;font-size:.9rem}
.az{color:var(--muted);font-size:.85rem}
.hide-ipa .ipa{display:none!important}
.vguide{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
.vguide td{border:1px solid var(--line);padding:6px 9px;vertical-align:middle}
.vguide .v{color:var(--gold);font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin:12px 0}
.card.tight{padding:11px 13px}.card h3:first-child{margin-top:0}
.hd{display:flex;align-items:center;gap:8px;margin:22px 0 6px}
.hd .n{font-size:.72rem;color:var(--bg);background:var(--gold);border-radius:6px;padding:2px 7px;font-weight:700}
.lead{color:var(--muted);font-size:.94rem;margin:.2em 0 .8em}

.rowlist{display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);padding:9px 12px}
.row .l{min-width:0}.row .ru{font-size:.9rem}.row .ipa{font-size:.8rem}
.row .av{font-size:1.2rem;text-align:right}
.row.head{background:var(--card2);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px}
.tag{display:inline-block;font-size:.62rem;padding:1px 6px;border-radius:5px;background:var(--card2);color:var(--muted);border:1px solid var(--line);margin-left:6px;vertical-align:middle}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:.8rem;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.g.on{background:var(--grn);border-color:var(--grn)}
.chip.b.on{background:var(--blue);border-color:var(--blue);color:#04203f}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--red);color:#fff;
  border:none;border-radius:12px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.grn{background:var(--grn);color:#052}.btn.gold{background:var(--gold);color:#20160a}
.btn.blk{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.blue{background:var(--blue);color:#04203f}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:110px}
.btn.sm{padding:8px 12px;font-size:.82rem;border-radius:10px}
.play{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  background:var(--blue);color:#04203f;border:none;font-size:.95rem;cursor:pointer;flex:none}
.play:active{transform:scale(.9)}.play.off{background:var(--card2);color:var(--muted);cursor:default}

.callout{border-left:3px solid var(--line);background:var(--card2);border-radius:0 10px 10px 0;padding:9px 12px;margin:10px 0;font-size:.9rem}
.callout.g{border-color:var(--grn)}.callout.b{border-color:var(--blue)}.callout.r{border-color:var(--red)}

.prog{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--blue));width:0}
.tiles{display:flex;gap:8px;margin:10px 0}
.tile{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font-size:1.4rem;color:var(--gold)}.tile small{font-size:.66rem}

.lesson{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin:8px 0;cursor:pointer}
.lesson .badge{width:34px;height:34px;border-radius:9px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:1.1rem;flex:none}
.lesson.done .badge{background:var(--grn);color:#052}.lesson.started .badge{background:var(--gold);color:#20160a}
.lesson .lt{flex:1;min-width:0}.lesson .lt b{font-size:.98rem}.lesson .lt small{display:block;color:var(--muted);font-size:.76rem}
.lesson .arrow{color:var(--muted)}
.back{color:var(--muted);cursor:pointer;font-size:.85rem;display:inline-block;margin:2px 0 6px}

.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 15px;margin:10px 0;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stage .tasktag{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stage .prompt{font-size:1.35rem;font-weight:600}
.stage .ans{font-size:1.5rem;color:var(--ipa)}
.stage .ansru{color:var(--muted);font-size:.95rem}
.grade{display:none;gap:8px;margin-top:4px}.grade.on{display:flex}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:12px 14px;margin:6px 0;font-size:1rem;cursor:pointer;font-family:inherit}
.opt.correct{background:var(--grn);color:#052;border-color:var(--grn)}
.opt.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.feedback{margin:6px 0;font-weight:600}.feedback.ok{color:var(--grn)}.feedback.no{color:var(--red)}

.flash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 16px;margin:10px 0;text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer}
.flash .kind{font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.flash .big{font-size:1.9rem;font-weight:700}
.flash .tap{color:var(--muted);font-size:.8rem;margin-top:6px}
.flash .divider{border-top:1px dashed var(--line);margin:10px 0 4px;padding-top:10px}

input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:8px 0}
summary{cursor:pointer;padding:8px 0;font-weight:600}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;-webkit-overflow-scrolling:touch}
.subtabs button{white-space:nowrap;background:var(--card2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.82rem;cursor:pointer;font-family:inherit}
.subtabs button.on{background:var(--blue);color:#04203f;border-color:var(--blue)}
.letter{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0}
.letter .big{font-size:1.5rem;font-weight:700;min-width:56px}
.letter .li{flex:1;min-width:0}.letter .li .ipa{font-family:ui-monospace,monospace}
.letter .ex{color:var(--muted);font-size:.82rem}
.hdrback{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  width:34px;height:34px;font-size:1.4rem;line-height:1;cursor:pointer;flex:none;font-family:inherit;padding:0}
.hdrback:active{transform:scale(.94)}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;width:44px;height:44px;
  border-radius:50%;background:var(--blue);color:#04203f;border:none;font-size:1.3rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.fab.show{display:flex}.fab:active{transform:scale(.9)}
</style>
</head>

  <div class="logo">🏔️</div>
  <div class="brand"><b>Аварский за час</b><small>Магӏарул мацӀ · для русскоговорящих</small></div>

</div></header>

<main class="wrap">

</nav>

рский аварским. Нажми ▶, чтобы услышать.</p>\n<div class=\"callout b\"><b>Палочка «Ӏ»</b> после буквы (кӀ, тӀ, цӀ, чӀ, къ…) — это резкий «щелчок»:\nвоздух зажимается в горле и резко выходит. Это не отдельная буква, а знак «резкого» звука.</div>\n<h3>Гласные</h3><p>Их всего пять: <b>а, е, и, о, у</b> (и «э»). Читаются чётко и коротко.</p>\n<h3>Особые согласные</h3>\n<p>Смотри таблицу ниже (вкладка «Алфавит» в справочнике всегда под рукой). Каждый звук —\nс примером-словом. Слушай и повторяй вслух.</p>\n<div class=\"callout g\"><b>Гортанные:</b> гӀ, хӀ, гъ, хъ, къ произносятся глубоко в горле —\nэто нормально, что сначала непривычно. Слушай образец и подражай.</div>\n<div class=\"callout b\"><b>Про «л»:</b> аварское <b>л</b> мягче русского твёрдого «л» — ближе к «ль».\nНапример, <b>гьабила</b> звучит почти как «гьаби<b>ля</b>». (Не путай с «лъ» — это совсем другой звук:\nглухое «л» без голоса, воздух уходит по бокам языка.)</div>\n", "words": [], "ex": [{"t": "mcq", "q": "Что означает палочка «Ӏ» после буквы (кӀ, тӀ, цӀ)?", "opts": ["Резкий «щелчок» — смычка в горле", "Долгий звук", "Ударение"], "a": 0}, {"t": "mcq", "q": "Сколько гласных в аварском?", "opts": ["Пять (а,е,и,о,у)", "Десять", "Три"], "a": 0}, {"t": "mcq", "q": "Звук «лъ» — это…", "opts": ["Глухое «л» без голоса, воздух по бокам", "Мягкое ль", "Как русское л"], "a": 0}, {"t": "mcq", "q": "Звук «гӀ» (как арабский ъайн) произносится…", "opts": ["Глубоко в горле, с напряжением", "Губами", "Кончиком языка"], "a": 0}, {"t": "mcq", "q": "Чем «кӀ» отличается от «к»?", "opts": ["«кӀ» — резкий, со щелчком в горле", "Ничем", "«кӀ» — длиннее"], "a": 0}, {"t": "mcq", "q": "«хъ» — это…", "opts": ["Глубокое хриплое «х» из горла", "Мягкое х", "Обычное русское х"], "a": 0}, {"t": "say", "q": "Нажми ▶ у буквы «гӀ» в справочнике (вкладка «Алфавит») и повтори звук.", "ans": "гӀеч — яблоко (там этот звук)"}], "drill": {"gen": "alpha"}, "lvl": "A0"}, {"id": "class", "emoji": "👦👧", "t": "Классал ва «вуго»", "sub": "Три класса и слово «есть»", "teach": "\n<p class=\"lead\">В аварском у каждого существительного есть <b>класс</b> (похоже на род).\nКласс показывает не сама буква слова, а «классный показатель» — <b>в / й / б</b>:</p>\n<table class=\"vguide\">\n<tr><td><b>I класс</b> — <span class=\"v\">в</span></td><td>мужчины, мальчики</td><td>вас <span class=\"az\">мальчик</span></td></tr>\n<tr><td><b>II класс</b> — <span class=\"v\">й</span></td><td>женщины, девочки</td><td>яс <span class=\"az\">девочка</span></td></tr>\n<tr><td><b>III класс</b> — <span class=\"v\">б</span></td><td>вещи, животные, всё остальное</td><td>чу <span class=\"az\">лошадь</span></td></tr>\n<tr><td><b>Мн. число</b> — <span class=\"v\">р</span></td><td>много кого/чего угодно</td><td>лъимал <span class=\"az\">дети</span></td></tr>\n</table>\n<p>Слово <b>«есть / является»</b> тоже меняется по классу — это одно из самых нужных слов:</p>\n<table class=\"vguide\">\n<tr><td>I (он)</td><td class=\"v\">вуго</td><td>Дов вас <b>вуго</b> <span class=\"az\">Он мальчик</span></td></tr>\n<tr><td>II (она)</td><td class=\"v\">йиго</td><td>Дой яс <b>йиго</b> <span class=\"az\">Она девочка</span></td></tr>\n<tr><td>III (это)</td><td class=\"v\">буго</td><td>Доб чу <b>буго</b> <span class=\"az\">Это лошадь</span></td></tr>\n<tr><td>мн.</td><td class=\"v\">руго</td><td>Дол лъимал <b>руго</b> <span class=\"az\">Это дети</span></td></tr>\n</table>\n<div class=\"callout g\"><b>Про тебя.</b> Если ты говоришь о себе: мальчик/мужчина —\n«Дун … <b>вуго</b>», девочка/женщина — «Дун … <b>йиго</b>». Переключи ♂/♀ вверху — примеры изменятся!</div>\n<h3>Личные местоимения</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">дун / мун</td><td>я / ты</td></tr>\n<tr><td class=\"v\">ниж / нилъ</td><td>мы (без тебя) / мы (вместе с тобой)</td></tr>\n<tr><td class=\"v\">нуж</td><td>вы</td></tr>\n</table>\n<div class=\"callout b\">В аварском <b>два «мы»</b>: <b>ниж</b> — без собеседника («мы, но не ты»),\n<b>нилъ</b> — включая собеседника («мы с тобой»).  дома: ‑ал / ‑ял / ‑заби", "teach": "\n<p class=\"lead\">Множественное число образуется суффиксами. Самые частые — <b>‑ал</b> (после согласной)\nи <b>‑ял</b> (после гласной).</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ал</td><td>после согласной</td><td>вас→вас<b>ал</b> «мальчики» · вац→вац<b>ал</b> «братья» · яс→яс<b>ал</b> «девочки»</td></tr>\n<tr><td class=\"v\">‑ял</td><td>после гласной</td><td>чу→чу<b>ял</b> «лошади»</td></tr>\n<tr><td class=\"v\">‑заби</td><td>люди, профессии, родня</td><td>мугӀалим→мугӀалим<b>заби</b> «учителя» · гьудул→гьудул<b>заби</b> «друзья»</td></tr>\n<tr><td class=\"v\">‑зал</td><td>часть вещей</td><td>рукъ→рукъ<b>зал</b> «дома»</td></tr>\n</table>\n<div class=\"callout b\"><b>Особые (запомнить):</b> чи→<b>чагӀи</b> «люди», эбел→<b>улбул</b> «матери»,\nгӀака→<b>гӀачи</b> «коровы», бетӀер→<b>бутӀрул</b> «головы».</div>\n<div class=\"callout g\">Со множественным «есть» — <b>руго</b>, классный показатель — <b>р</b>:\n«Дол васал <b>руго</b>» — «Это мальчики».</div>\n", "words": [{"ru": "мальчики", "av": "васал"}, {"ru": "братья", "av": "вацал"}, {"ru": "девочки", "av": "ясал", "forms": ["ясал", "ясаз", "ясазул"]}, {"ru": "лошади", "av": "чуял"}, {"ru": "учителя", "av": "мугӀалимзаби"}, {"ru": "друзья", "av": "гьудулзаби"}, {"ru": "дома", "av": "рукъзал", "forms": ["рукъзал", "рукъзабаз", "рукъзабаца", "рукъзабазул"], "ex": {"av": "рукъзал разе", "ru": "построить дом, здание"}, "alts": [{"av": "рукъ", "ex": {"av": "тӀуцаб рукъ", "ru": "низкая комната"}}, {"av": "мина", "ex": {"av": "мина базе", "ru": "(по)строить дом, жилище"}}]}, {"ru": "люди", "av": "чагӀи", "forms": ["чагӀи", "чагӀаз", "чагӀазул"]}, {"ru": "матери", "av": "улбул", "forms": ["улбул", "улбуз", "улбузул"]}], "ex": [{"t": "mcq", "q": "«мальчики» (вас + …) —", "opts": ["васал", "васзаби", "васял"], "a": 0}, {"t": "mcq", "q": "После гласной (чу «лошадь») — окончание", "opts": ["‑ял (чуял)", "‑ал", "‑зал"], "a": 0}, {"t": "mcq", "q": "«учителя» (мугӀалим) —", "opts": [" ьные слова тоже берут классный показатель. Для вещей (III класс) — на <b>-б</b>:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">гьаб</td><td>это (рядом)</td><td>Гьаб тӀехь буго <span class=\"az\">Это книга</span></td></tr>\n<tr><td class=\"v\">гьеб</td><td>то (чуть дальше)</td><td>Гьеб къалам буго <span class=\"az\">Это ручка</span></td></tr>\n<tr><td class=\"v\">доб</td><td>то (далеко)</td><td>Доб рукъ буго <span class=\"az\">То — дом</span></td></tr>\n</table>\n<p>Вопрос про вещь: <b>Гьаб щиб бугеб?</b> — «Это что?». Отвечаем: <b>Гьаб … буго</b>.</p>\n<h3>…а «то» различают ещё и по высоте (в горах это важно!)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">доб</td><td>то — далеко, на <b>том же уровне</b></td></tr>\n<tr><td class=\"v\">лъоб</td><td>то — <b>выше</b> меня (вверху по склону, на полке)</td></tr>\n<tr><td class=\"v\">гъоб</td><td>то — <b>ниже</b> меня (внизу под склоном)</td></tr>\n</table>\n<div class=\"callout b\">В горном ауле это ежедневная логика: <b>доб</b> — на одном уровне, <b>лъоб</b> — что выше,\n<b>гъоб</b> — что ниже. По той же схеме меняются начала <b>гьа‑ / до‑ / лъо‑ / гъо‑</b> и в других указательных.</div>\n<div class=\"callout g\">Порядок слов простой: <b>[Это] [вещь] буго</b>. Слово «буго» всегда в конце\nи его нельзя пропускать (в отличие от русского «это — книга»).</div>\n", "words": [{"ru": "это (рядом)", "av": "гьаб", "cls": "III", "forms": ["гьаб", "гьалъ", "гьалъул", "гьабги"], "ex": {"av": "гьаб кули", "ru": "этот хутор"}, "alts": [{"av": "гьеб", "ex": {"av": "гьеб къоялъ", "ru": "в этот день"}}, {"av": "гьав", "ex": {"av": "гьав вас", "ru": "этот мальчик"}}]}, {"ru": "то", "av": "гьеб", "cls": "III", "forms": ["гьеб", "гьелъ", "гьелъул", "гьел"], "ex": {"av": "гьеб къоялъ", "ru": "в этот день"}, "alts": [{"av": "гьаб", "ex": {"av": "гьаб кули", "ru": "этот хутор"}}, {"av": "гьав", "ex": {"av": "гьав вас", "ru": "этот мальчик"}}]}, {"ru": "то (далеко)", "av": "доб", "cls": "III", "forms": ["доб", "долъ", "долъул"], "ex"  "a": 0}, {"t": "say", "q": "Скажи: «Я иду» (дун)", "ans": "Дун ине"}, {"t": "mcq", "q": "Как сказать «здесь»?", "opts": ["гьениб", "гьаниб", "анцӀго"], "a": 1}, {"t": "mcq", "q": "Как сказать «там»?", "opts": ["гьанибе", "анцӀго", "гьениб"], "a": 2}], "drill": {"gen": "place"}, "lvl": "A2"}, {"id": "talk", "emoji": "💬", "t": "Говорим!", "sub": "Собираем всё вместе", "teach": "\n<p class=\"lead\">Ты уже знаешь классы, «есть», числа, цвета, вопросы, прошедшее и будущее.\nСоберём короткий диалог:</p>\n<table class=\"vguide\">\n<tr><td>— ВорчӀами! Дуда цӀар щиб?</td><td>— Привет! Как тебя зовут?</td></tr>\n<tr><td>— Дида цӀар Муса буго. Дун цӀалдохъан вуго.</td><td>— Меня зовут Муса. Я ученик.</td></tr>\n<tr><td>— Дур чан сон бугеб?</td><td>— Сколько тебе лет? <span class=\"az\">(букв. твоих сколько лет есть)</span></td></tr>\n<tr><td>— Дир анцӀго сон буго. Баркала!</td><td>— Мне 10 лет. Спасибо!</td></tr>\n</table>\n<div class=\"callout b\">Слово <b>сон</b> здесь — «год (возраста)»: <b>анцӀго сон</b> — «десять лет».\n(То же слово может значить «вчера» — по смыслу понятно, о чём речь.)</div>\n\n<div class=\"callout b\">Продолжай тренироваться в разделе «Гьунар» (Тренировка) — там бесконечные\nзадания по всем темам. Говори вслух — так язык запоминается быстрее всего!</div>\n", "words": [{"ru": "сколько тебе лет?", "av": "дур чан сон бугеб?"}, {"ru": "мне … лет", "av": "дир … сон буго"}, {"ru": "гость", "av": "гьобол", "cls": "I", "forms": ["гьобол", "гьоболас", "гьоболалъ", "гьоболасул", "гьоболалъул", "гьалбал"], "ex": {"av": "хирияв гьобол", "ru": "дорогой гость"}}, {"ru": "сосед", "av": "мадугьал", "cls": "I", "forms": ["мадугьал", "мадугьалас", "мадугьалалъ", "мадугьаласул", "мадугьалалъул", "мадугьалзаби"], "ex": {"av": "лъикӀав мадугьал", "ru": "добрый сосед"}}, {"ru": "хорошо/ладно", "av": "лъикӀ", "ex": {"av": "цӀакъ лъикӀ", "ru": "очень хорошо; отлично, превосходно"}, "alts": [{"av": "берцин", "ex": {"av": "берцинго кӀалъазе заман гӀечӀо", "ru": "не хватило времени хорошенько поговорить"}}]}], "ex": [{"t": "say", "q": "Поздоровайся с девочкой и спроси имя", "ans": "ЙорчӀами! Дуда цӀар щиб?"}, {"t": "say", "q": "Скажи: «Меня зовут … , я ученик» (мальчик)", "ans": "Дида цӀар … буго. Дун цӀалдохъан вуго."}, {"t": "mcq", "q": "«Сколько тебе лет?» —", "opts": ["Дур чан сон бугеб?", "Дуда цӀар щиб?", "Мун вачӀанищ?"], "a": 0}, {"t": "mcq", "q": "Как сказать «гость»?", "opts": ["къалам", "гьобол", "вачӀина"], "a": 1}, {"t": "mcq", "q": "Как сказать «сосед»?", "opts": ["гьобол", "цӀалун", "мадугьал"], "a": 2}, {"t": "mcq", "q": "Как сказать «хорошо/ладно»?", "opts": ["лъикӀ", "кин", "гӀака"], "a": 0}], "drill": {"gen": "talk"}, "lvl": "A2"}, {"id": "loan", "emoji": "🔌", "t": "Заимствования", "sub": "Говори, даже если не знаешь слово", "teach": "\n<p class=\"lead\">Не знаешь аварское слово? <b>Не молчи!</b> Аварцы всегда вставляют русские,\nарабские, английские слова — и ты можешь. Главное — оформить их по-аварски. С этим приёмом\nты говоришь на любую тему уже сегодня.</p>\n<h3>Способ 1: слово + <b>гьабизе</b> («делать»)</h3>\n<table class=\"vguide\">\n<tr><td>проверка <b>гьабизе</b></td><td>проверять <span class=\"az\">(букв. «делать проверку»)</span></td></tr>\n<tr><td>ремонт <b>гьабизе</b></td><td>ремонтировать</td></tr>\n<tr><td>звонок <b>гьабизе</b></td><td>позвонить</td></tr></table>\n<h3>Способ 2 (по-нативному): корень + <b>‑изе</b></h3>\n<p>Бери русский или английский корень и делай аварский глагол на <b>‑изе</b> — а потом склоняй\nкак обычный аварский глагол!</p>\n<table class=\"vguide\">\n<tr><td>проверить → <b class=\"v\">провер‑изе</b></td><td>наст. провер‑ула, прош. провер‑ана</td></tr>\n<tr><td>англ. check → <b class=\"v\">чек‑изе</b></td><td>«чекнуть, проверить»</td></tr>\n<tr><td>гуглить → <b class=\"v\">гугл‑изе</b></td><td>«погуглить»</td></tr></table>\n<div class=\"callout g\"><b>Целая фраза:</b><br>\n<b>Дие провер‑изе бокьун буго, документалда щиб хъван бугеб‑али.</b><br>\n<span class=\"az\">«Я хочу проверить, что написано в документе».</span></div>\n<div class=\"callout r\"><b>Порядок слов: глагол — в конце!</b> Аварский — язык <b>SOV</b> (подлежащее–дополнение–глагол),\nа не SVO как русский. Сравни: рус. «я хочу <u>проверить</u>» → авар. «дие <u>провер‑изе</u> бокьун буго»\n(«хочу/буго» уходит в самый конец). Порядок гибкий, но по умолчанию — глагол в конце.</div>\n<h3>Заимствованные существительные берут аварские падежи</h3>\n<table class=\"vguide\">\n<tr><td>документ → <b>документалда</b></td><td>в документе</td></tr>\n<tr><td>интернет → <b>интернеталда</b></td><td>в интернете</td></tr>\n<tr><td>телефон → <b>телефоналде</b></td><td>на телефон</td></tr></table>\n<div class=\"callout b\"><b>«‑бали / ‑али»</b> на конце глагола = русское <b>«ли»</b> (косвенный вопрос):\n<b>бугеб‑али</b> «есть ли», <b>хъван бугеб‑али</b> «написано ли». Легко запомнить — созвучно с «ли».\nМожно и <b>бугин-гьечӀин</b> «есть-нет».</div>\n<h3>Универсальные формулы словообразования</h3>\n<p>Не зубри такие слова — <b>строй их на ходу</b> (корень аварский, русский или международный + «хвостик»):</p>\n<table class=\"vguide\">\n<tr><td>+ <b class=\"v\">‑ялъулаб</b> (‑ский)</td><td>Москва → Москваялъулаб</td><td>московский</td></tr>\n<tr><td>+ <b class=\"v\">‑кияб</b> (‑ический)</td><td>техника → техникияб · энергия → энергикияб</td><td>технический</td></tr>\n<tr><td>+ <b class=\"v\">‑лъи</b> (‑ость/‑ство)</td><td>берцинаб → берцинлъи · бечед → бечелъи</td><td>красота, богатство</td></tr>\n<tr><td>+ <b class=\"v\">‑лъизе</b> (стать…)</td><td>цо «один» → цолъизе</td><td>объединиться</td></tr>\n<tr><td>+ <b class=\"v\">‑го</b> (наречие)</td><td>лъикӀ → лъикӀго</td><td>хорошо</td></tr>\n</table>\n<div class=\"callout b\"><b>Так строится половина слов.</b> Взял корень — надел нужный хвостик: <b>‑ялъулаб / ‑кияб</b>\n(прилагательное), <b>‑лъи</b> (свойство), <b>‑лъизе</b> (стать таким), <b>‑го</b> (наречие).\nСогласуй прилагательное по классу (‑в/‑й/‑б). Это тоже «модернизация» языка.</div>\n<div class=\"callout g\"><b>Про «значит»:</b> <b>гьединлъидал</b> — «поэтому, следовательно» (вывод); в живой речи\nчасто сокращают до <b>гьелъ</b> (букв. «этим»). А глагол «означать» одним словом не сказать —\nчерез <b>магӀна</b> «смысл»: «гьелъул магӀна…» — «это значит…».</div>\n<div class=\"callout b\"><b>масала ≠ мисал:</b> <b>масала</b> — вводное «например» (араб.). А <b>мисал</b> — существительное\n«пример»: <b>мисалалъе</b> «для примера, к примеру».</div>\n<h3>Слова-связки (вставляй в речь)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">масала</td><td>например</td><td class=\"v\">амма</td><td>но, однако</td></tr>\n<tr><td class=\"v\">ва</td><td>и</td><td class=\"v\">яги</td><td>или</td></tr>\n<tr><td class=\"v\">цинги</td><td>потом, затем</td><td class=\"v\">гьединлъидал</td><td>поэтому, значит</td></tr>\n<tr><td class=\"v\">узухъда</td><td>конечно</td><td class=\"v\">хӀакъикъаталда</td><td>на самом деле</td></tr></table>\n<div class=\"callout b\">Если выучить ~1000 слов, основную грамматику и уметь вот так вставлять\nрусские/английские слова — это уже свободная живая речь (честный B1 и выше). Смешивать языки —\nнормально, это живой «суржик», на котором реально говорят.</div>\n", "words": [{"ru": "делать (универсально)", "av": "гьабизе", "forms": ["гьабизе", "гьабула", "гьабила", "гьабуна", "гьабе"], "ex": {"av": "иш гьабизе", "ru": "делать дело"}, "alts": [{"av": "бахъинабизе", "ex": {"av": "ГӀумарил устар вахъинавизе", "ru": "(с)делать, чтобы Омар стал мастером"}}, {"av": "гӀезабизе", "ex": {"av": "ахал гӀезаризе", "ru": "взращивать сады"}}]}, {"ru": "проверить (заимств.)", "av": "проверизе"}, {"ru": "например", "av": "масала"}, {"ru": "но, однако", "av": "амма", "ex": {"av": "амма хӀакъаб рагӀи", "ru": "в самом деле"}, "alts": [{"av": "но"}]}, {"ru": "и", "av": "ва", "ex": {"av": "гӀака ва бече", "ru": "корова и телёнок"}}, {"ru": "или", "av": "яги", "alts": [{"av": "яда"}]}, {"ru": "потом, затем", "av": "цинги", "ex": {"av": "цин ургъе, цинги кӀалъай", "ru": "сперва подумай, затем говори"}, "alts": [{"av": "хадуса", "ex": {"av": "ун хадуса", "ru": "после того, как ушли"}}]}, {"ru": "поэтому, значит", "av": "гьединлъидал"}, {"ru": "конечно", "av": "узухъда", "ex": {"av": "узухъда, дов витӀарав вуго", "ru": "конечно, он прав"}, "alts": [{"av": "гьайгьай", "ex": {"av": "гьайгьай, гьедин лъикӀ", "ru": "конечно, так лучше"}}]}, {"ru": "на самом деле", "av": "хӀакъикъаталда", "ex": {"av": "хӀакъикъаталда дов витӀун вуго", "ru": "в самом деле он прав"}}, {"ru": "…ли (косв. вопрос)", "av": "‑бали"}, {"ru": "в документе", "av": "документалда"}], "ex": [{"t": "mcq", "q": "Как оформить русский глагол «проверить» по-аварски (2-й способ)?", "opts": ["проверизе", "проверитьун", "проверский"], "a": 0}, {"t": "say", "q": "Скажи: «Я хочу проверить» (провер‑изе)", "ans": "Дие проверизе бокьун буго"}, {"t": "mcq", "q": "«‑бали» на конце глагола значит…", "opts": ["«ли» (вопрос: есть ли…)", "приказ", "прошедшее время"], "a": 0}, {"t": "mcq", "q": "«в документе» (заимств. слово + падеж) —", "opts": ["документалда", "документалде", "документго"], "a": 0}, {"t": "mcq", "q": "«например» по-аварски —", "opts": ["масала", "амма", "яги"], "a": 0}, {"t": "mcq", "q": "Способ 1 вставить слово —", "opts": ["слово + гьабизе («делать»)", "убрать все гласные", "добавить ‑ский"], "a": 0}, {"t": "say", "q": "Скажи «Я хочу погуглить» (гугл‑изе)", "ans": "Дие гуглизе бокьун буго"}], "drill": {"gen": "loan"}, "lvl": "A2"}, {"id": "vforms", "emoji": "🔧", "t": "Все формы глагола", "sub": "Продвинуто: спряжение целиком", "teach": "\n<p class=\"lead\">Один глагол — много форм. Возьмём <b>цӀализе</b> «читать» и посмотрим целиком.\nМеняется только окончание (основа <b>цӀал‑</b> одна):</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">цӀал‑ула</td><td>настоящее — читает</td></tr>\n<tr><td class=\"v\">цӀал‑ана</td><td>прошедшее — читал</td></tr>\n<tr><td class=\"v\">цӀал‑ила</td><td>будущее — прочтёт</td></tr>\n<tr><td class=\"v\">цӀал‑е</td><td>приказ — читай!</td></tr>\n<tr><td class=\"v\">цӀалу‑ла‑ро</td><td>не читает (‑ро)</td></tr>\n<tr><td class=\"v\">цӀали‑чӀо</td><td>не читал (‑чӀо)</td></tr>\n<tr><td class=\"v\">цӀал‑ун</td><td>деепричастие — прочитав</td></tr>\n<tr><td class=\"v\">цӀал‑улеб</td><td>причастие — читающий</td></tr>\n<tr><td class=\"v\">цӀал‑и</td><td>масдар — чтение (имя действия)</td></tr>\n<tr><td class=\"v\">цӀал‑ани</td><td>условное — если прочтёт</td></tr>\n</table>\n<div class=\"callout g\"><b>Инфинитив ‑изе или ‑ине?</b> Большинство глаголов на <b>‑изе</b> (цӀал‑изе, гьаб‑изе),\nно часть — на <b>‑ине</b>: <b>ине</b> «идти», <b>вачӀине</b> «приходить», <b>ретӀине</b> «надевать»,\n<b>бачине</b> «вести». Спрягаются они одинаково, разница только в инфинитиве.</div>\n<div class=\"callout r\"><b>Осторожно, «ложные друзья»!</b> ‑изе и ‑ине могут дать совсем разные слова:\n<b>бахъизе</b> «снимать, вытаскивать» (и «сурат бахъизе» — рисовать / сфотографировать) ≠\n<b>бахъине</b> «вставать». Одна буква — другое слово!</div>\n", "words": [{"ru": "деепричастие: прочитав", "av": "цӀалун"}, {"ru": "причастие: читающий", "av": "цӀалулеб"}, {"ru": "масдар: чтение", "av": "цӀали"}, {"ru": "не читает", "av": "цӀалуларо"}, {"ru": "надевать (‑ине)", "av": "ретӀине", "forms": ["ретӀине", "ретӀуна", "ретӀина", "ретӀана", "ретӀе"], "ex": {"av": "хисун ретӀине", "ru": "переодеваться, сменить одежду"}, "alts": [{"av": "тӀад", "ex": {"av": "тӀагъур тӀад лъезе", "ru": "надевать шапку"}}, {"av": "базе", "ex": {"av": "ракӀ базе", "ru": "надеяться, чувствовать опорой"}}]}, {"ru": "вести (‑ине, перех.)", "av": "бачине", "forms": ["бачине", "бачуна", "бачина", "бачана", "баче"], "ex": {"av": "газ бачине", "ru": "провести газ"}}], "ex": [{"t": "mcq", "q": "«цӀалун» — это…", "opts": ["деепричастие: «прочитав»", "приказ", "будущее"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в прошедшее время", "ans": "цӀалана"}, {"t": "mcq", "q": "Инфинитив «приходить» —", "opts": ["вачӀине (на ‑ине)", "вачӀизе", "вачӀула"], "a": 0}, {"t": "mcq", "q": "бахъизе и бахъине —", "opts": ["разные слова (получаться / вставать)", "одно и то же", "опечатка"], "a": 0}, {"t": "say", "q": "Поставь «цӀализе» в будущее время", "ans": "цӀалила"}, {"t": "mcq", "q": "Масдар (имя действия) от «цӀализе» —", "opts": ["цӀали (чтение)", "цӀале", "цӀалана"], "a": 0}], "drill": {"gen": "vform"}, "lvl": "B1"}, {"id": "cases", "emoji": "📦", "t": "Падежи существительных", "sub": "Продвинуто: кто/кого/где/куда/откуда", "teach": "\n<p class=\"lead\">Главное правило аварского предложения: <b>падеж подлежащего выбирает глагол</b>.\nЭто сердце языка — от него зависит, как строить любую фразу.</p>\n<h3>Кто что делает: падеж подлежащего зависит от глагола</h3>\n<table class=\"vguide\">\n<tr><td>непереходный (идти, прийти)</td><td>подлежащее в <b>именительном</b></td><td>Вас <b>вачӀана</b> «мальчик пришёл»</td></tr>\n<tr><td>переходный (пахать, читать)</td><td>подлежащее в <b>эргативе</b></td><td><b>Инсуца</b> хур бекьана «отец вспахал поле»</td></tr>\n<tr><td>любить, хотеть</td><td>подлежащее в <b>дательном ‑е</b></td><td><b>Инсуе</b> вас вокьула «отец любит сына»</td></tr>\n<tr><td>видеть, знать, мочь</td><td>подлежащее в <b>местном ‑да</b></td><td><b>Дида</b> Загьра йихьана «я увидел Захру»</td></tr>\n</table>\n<h3>Эргатив: три окончания (не только ‑ца!)</h3>\n<table class=\"vguide\">\n<tr><td>I класс (мужчины) <b class=\"v\">‑ас</b></td><td class=\"v\">вас→вас<b>ас</b> · вац→вац<b>ас</b> · чи→чи<b>яс</b></td></tr>\n<tr><td>II/III класс (женщины, вещи) <b class=\"v\">‑алъ</b></td><td class=\"v\">яс→яс<b>алъ</b> · квер→квер<b>алъ</b></td></tr>\n<tr><td>имена и <b>конкретные</b> вещи <b class=\"v\">‑ца</b></td><td class=\"v\">Муса→Муса<b>ца</b> · тӀехь→тӀохь<b>оца</b></td></tr>\n</table>\n<div class=\"callout b\">По Атаеву <b>‑ца</b> — у имён и <b>конкретных</b> предметов (книга, камень), а <b>абстрактные</b>\nпонятия (радость, ум) берут <b>‑алъ</b>. «Отец» склоняется по особой основе <b>инс‑</b>: эрг. <b>инсуца</b>,\nрод. <b>инсул</b>, дат. <b>инсуе</b>, мест. <b>инсуда</b>. У «я»: эрг. <b>дица</b>, род. <b>дир</b>, дат. <b>дие</b>, мест. <b>дида</b>.</div>\n<h3>Переходный глагол согласуется с ДОПОЛНЕНИЕМ (по классу), а не с подлежащим</h3>\n<table class=\"vguide\">\n<tr><td>увидел мальчика (I)</td><td class=\"v\"><b>в</b>ихьана</td></tr>\n<tr><td>увидел девочку (II)</td><td class=\"v\"><b>й</b>ихьана</td></tr>\n<tr><td>увидел книгу/вещь (III)</td><td class=\"v\"><b>б</b>ихьана</td></tr>\n</table>\n<div class=\"callout g\">«Дица Загьра <b>й</b>ихьана» — «я увидел Захру»: показатель <b>й</b> согласуется с «Загьра»\n(женщина, II класс), а не с «дица». Скажешь про мальчика — «<b>в</b>ихьана».</div>\n<h3>Местные падежи (где / куда / откуда)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">столалда</td><td>на столе (где?)</td></tr>\n<tr><td class=\"v\">столалде</td><td>на стол (куда?)</td></tr>\n<tr><td class=\"v\">столалдаса</td><td>со стола (откуда?)</td></tr>\n</table>\n<p>Полная таблица 5 серий (на / у / в среде / под / внутри) — в разделе «Справка → Грамматика».</p>\n", "words": [{"ru": "отец (эрг.)", "av": "инсуца"}, {"ru": "отцу (дат.)", "av": "инсуе"}, {"ru": "у отца (мест.)", "av": "инсуда"}, {"ru": "мальчик (эрг.)", "av": "васас"}, {"ru": "девочка (эрг.)", "av": "ясалъ"}, {"ru": "я (эрг.)", "av": "дица", "ex": {"av": "дица кинабго бицина", "ru": "я всё расскажу"}, "alts": [{"av": "дун", "ex": {"av": "дун ячӀана", "ru": "я пришла"}}]}, {"ru": "мне", "av": "дие", "ex": {"av": "дие дой йокьула", "ru": "я её люблю"}}, {"ru": "на столе", "av": "столалда"}, {"ru": "со стола", "av": "столалдаса"}], "ex": [{"t": "mcq", "q": "Подлежащее переходного глагола (пахать, читать) — в падеже", "opts": ["эргатив", "именительный", "дательный"], "a": 0}, {"t": "mcq", "q": "«видеть, знать, мочь» — подлежащее в падеже", "opts": ["местном ‑да (дида)", "эргативе", "именительном"], "a": 0}, {"t": "mcq", "q": "Эргатив от «вас» (мальчик, I класс) —", "opts": ["васас", "васца", "васалъ"], "a": 0}, {"t": "mcq", "q": "Эргатив от «яс» (девочка) —", "opts": ["ясалъ", "ясас", "ясца"], "a": 0}, {"t": "mcq", "q": "«увидел девочку» — глагол согласуется с дополнением:", "opts": ["йихьана", "вихьана", "бихьана"], "a": 0}, {"t": "say", "q": "Скажи «со стола» (откуда?)", "ans": "столалдаса"}], "drill": {"gen": "casemix"}, "lvl": "B1"}, {"id": "cond", "emoji": "🔀", "t": "Условное наклонение", "sub": "Продвинуто: если… / если бы…", "teach": "\n<p class=\"lead\">«Если» по-аварски — это окончания на глаголе, отдельного слова не нужно.</p>\n<h3>Реальное условие: ‑ни</h3>\n<p>От основы прошедшего (без ‑на) + <b>‑ни</b>:</p>\n<table class=\"vguide\">\n<tr><td>цӀала‑на → цӀала<b class=\"v\">ни</b></td><td>если прочтёт</td></tr>\n<tr><td>вачӀа‑на → вачӀа<b class=\"v\">ни</b></td><td>если придёт</td></tr>\n</table>\n<h3>Отрицательное условие: ‑чӀони</h3>\n<table class=\"vguide\">\n<tr><td>цӀаличӀо → цӀаличӀо<b class=\"v\">ни</b></td><td>если не прочтёт</td></tr>\n</table>\n<h3>Нереальное («если бы»): ‑арабани / ‑ебани</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">букӀарабани</td><td>если бы было</td></tr>\n<tr><td class=\"v\">букӀинчӀебани</td><td>если бы не было</td></tr>\n<tr><td class=\"v\">лъалеб букӀарабани</td><td>если бы знал(а)</td></tr>\n</table>\n<div class=\"callout g\"><b>Пример:</b> «<b>Дица гьикъарабани, дида лъалаан</b>» — «Если бы я спросил(а),\n[я] знал(а) бы». <span class=\"az\">(‑аан — ирреальный результат: <b>лъалаан</b> «знал бы».)</span></div>\n", "words": [{"ru": "если прочтёт", "av": "цӀалани"}, {"ru": "если придёт", "av": "вачӀани"}, {"ru": "если не прочтёт", "av": "цӀаличӀони"}, {"ru": "если бы было", "av": "букӀарабани"}, {"ru": "если бы не было", "av": "букӀинчӀебани"}, {"ru": "если бы знал(а)", "av": "лъалеб букӀарабани"}], "ex": [{"t": "mcq", "q": "«если прочтёт» —", "opts": ["цӀалани", "цӀалила", "цӀалула"], "a": 0}, {"t": "say", "q": "Скажи «если придёт» (вачӀине)", "ans": "вачӀани"}, {"t": "mcq", "q": "«если бы было» —", "opts": ["букӀарабани", "букӀани", "букӀуна"], "a": 0}, {"t": "mcq", "q": "Отрицательное условие («если не…») — окончание", "opts": ["‑чӀони", "‑ни", "‑ила"], "a": 0}, {"t": "say", "q": "Скажи «если не прочтёт»", "ans": "цӀаличӀони"}, {"t": "mcq", "q": "Реальное условие «если» — окончание", "opts": ["‑ни", "‑ге", "‑ун"], "a": 0}], "drill": {"gen": "cond"}, "lvl": "B1"}, {"id": "conj", "emoji": "➕", "t": "Союзы: и, или, но", "sub": "ва, ‑ги, ‑гун, я·ялъуни, амма, гӀадин", "teach": "\n<p class=\"lead\">Союзов в аварском немного. «И» говорят двумя способами: заимствованным\n<b>ва</b> (из арабского) или исконным <b>‑ги</b>, которое вешается на <u>каждое</u> слово.</p>\n<h3>«И» — соединение</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">ва</td><td>и <span class=\"az\">(заимств.)</span></td><td>гӀака <b>ва</b> бече «корова и телёнок»</td></tr>\n<tr><td class=\"v\">‑ги … ‑ги</td><td>и <span class=\"az\">(исконное, на каждом слове)</span></td><td>дун<b>ги</b> мун<b>ги</b> «я и ты»</td></tr>\n</table>\n<div class=\"callout b\">Исконный способ — повторить <b>‑ги</b> после каждого слова: «вац<b>ги</b> яц<b>ги</b>» —\n«брат и сестра»; «гьаниб<b>ги</b> доба<b>ги</b>» — «и здесь, и там».</div>\n<h3>«С, вместе с» — послелог ‑гун / ‑гин</h3>\n<p>Исконное <b>‑гун</b> (вариант <b>‑гин</b>) — это «с / вместе с»; вешается на существительное и часто связывает слова, как «и»:</p>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑гун · ‑гин</td><td>с, вместе с</td><td>вац<b>гун</b> «с братом»; тушбаби<b>гун</b> рагъизе «воевать с врагами»</td></tr>\n</table>\n<h3>«Или», «но», «как»</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">я … я · ялъуни · яги</td><td>или · или же</td><td><b>я</b> дун, <b>я</b> мун «или я, или ты»</td></tr>\n<tr><td class=\"v\">амма</td><td>но, однако <span class=\"az\">(араб.)</span></td><td>… <b>амма</b> хехго вусса «… но быстро возвращайся»</td></tr>\n<tr><td class=\"v\">гӀадин</td><td>как, словно</td><td>дов <b>гӀадин</b> «как он»</td></tr>\n</table>\n<div class=\"callout b\"><b>Короче и исконнее:</b> «или же» — есть короткое <b>яги</b> (= ялъуни). «Но» <b>амма</b> —\nарабское слово; исконное <b>хӀо</b> почти не встречается (его любят пуристы).</div>\n<div class=\"callout g\"><b>Важно:</b> русские «когда, если, чтобы, хотя» в аварском — это\n<u>не</u> отдельные союзы, а окончания глагола (см. урок «Деепричастия и связки»):\nвачӀи<b>ндал</b> «когда пришёл», цӀали<b>зелъун</b> «чтобы прочитать». А «потому что» есть и словом:\n<b>щайгурелъул</b> (и окончание ‑лъул: буге<b>лъул</b> «поскольку есть»).</div>\n", "words": [{"ru": "и (араб.)", "av": "ва", "ex": {"av": "гӀака ва бече", "ru": "корова и телёнок"}}, {"ru": "я и ты", "av": "дунги мунги"}, {"ru": "с братом", "av": "вацгун"}, {"ru": "или же", "av": "ялъуни", "alts": [{"av": "я", "ex": {"av": "досдасан я хабар гуро, я кагъат гуро", "ru": "от него нет ни ответа, ни привета; от него нет ни вести, ни письма"}}]}, {"ru": "или же (коротко)", "av": "яги", "alts": [{"av": "яда"}]}, {"ru": "но, однако", "av": "амма", "ex": {"av": "амма хӀакъаб рагӀи", "ru": "в самом деле"}, "alts": [{"av": "но"}]}, {"ru": "потому что", "av": "щайгурелъул", "alts": [{"av": "гьелдалъун"}]}, {"ru": "как, словно", "av": "гӀадин", "ex": {"av": "рохь гӀадин", "ru": "очень много; много, как деревья в лесу"}, "alts": [{"av": "бицанихъе", "ex": {"av": "бицанихъе дос жеги лъади ячун гьечӀо", "ru": "говорят, что он ещё не женат"}}]}], "ex": [{"t": "mcq", "q": "Исконное «и» — вешается на каждое слово:", "opts": ["‑ги", "ва", "амма"], "a": 0}, {"t": "mcq", "q": "«я и ты» (исконно) —", "opts": ["дунги мунги", "дун ва мун", "дун мун"], "a": 0}, {"t": "mcq", "q": "«с братом» (вместе с) —", "opts": ["вацгун", "вацги", "вац ва"], "a": 0}, {"t": "mcq", "q": "«но, однако» —", "opts": ["амма", "ялъуни", "гӀадин"], "a": 0}, {"t": "mcq", "q": "«или же» —", "opts": ["ялъуни", "ва", "‑ги"], "a": 0}, {"t": "say", "q": "Скажи «корова и телёнок» (через ва)", "ans": "гӀака ва бече"}], "lvl": "B1"}, {"id": "converb", "emoji": "🔗", "t": "Деепричастия и связки", "sub": "B2: сделав, чтобы, поскольку, когда…", "teach": "\n<p class=\"lead\">Чтобы связывать части предложения, аварский вешает окончания прямо на глагол —\nполучаются деепричастия и «связки» (соответствуют русским «сделав», «чтобы», «поскольку»…).</p>\n<h3>Деепричастия</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑ун / ‑н</td><td>сделав (прош.)</td><td>цӀал<b>ун</b> «прочитав»</td></tr>\n<tr><td class=\"v\">‑го</td><td>делая (наст.)</td><td>цӀалула<b>го</b> «читая»</td></tr>\n</table>\n<h3>Связки (обстоятельства)</h3>\n<table class=\"vguide\">\n<tr><td class=\"v\">‑зелъун</td><td>чтобы (цель)</td><td>цӀали<b>зелъун</b> «чтобы прочитать»</td></tr>\n<tr><td class=\"v\">‑лъул</td><td>поскольку (причина)</td><td>буге<b>лъул</b> «поскольку есть»</td></tr>\n<tr><td class=\"v\">‑идал / ‑ндал</td><td>когда</td><td>вачӀи<b>ндал</b> «когда пришёл»</td></tr>\n<tr><td class=\"v\">‑зегӀан</td><td>пока не</td><td>цӀали<b>зегӀан</b> «пока не прочтёт»</td></tr>\n<tr><td class=\"v\">‑ниги</td><td>хотя</td><td>буго<b>ниги</b> «хотя есть»</td></tr>\n<tr><td class=\"v\">‑лде</td><td>до того как</td><td>кквела<b>лде</b> «до того как попало»</td></tr>\n</table>\n<div class=\"callout g\"><b>Пример:</b> «хӀалтӀулареб къо буге<b>лъул</b>, кеп гьабулел ратила» —\n«Поскольку день нерабочий, они, наверное, отдыхают».</div>\n<div class=\"callout b\">Это уже настоящий B2. Не обязательно учить всё сразу — достаточно узнавать\nэти хвостики в чужой речи и постепенно вставлять в свою.</div>\n", "words": [{"ru": "прочитав (деепр.)", "av": "цӀалун"}, {"ru": "читая (деепр.)", "av": "цӀалулаго"}, {"ru": "чтобы прочитать", "av": "цӀализелъун"}, {"ru": "поскольку есть", "av": "бугелъул"}, {"ru": "когда пришёл", "av": "вачӀиндал"}, {"ru": "пока не прочтёт", "av": "цӀализегӀан"}, {"ru": "хотя есть", "av": "бугониги"}, {"ru": "до того как", "av": "кквелалде"}], "ex": [{"t": "mcq", "q": "«прочитав» (деепричастие) —", "opts": ["цӀалун", "цӀале", "цӀалила"], "a": 0}, {"t": "mcq", "q": "«чтобы прочитать» — окончание", "opts": ["‑зелъун", "‑лъул", "‑ниги"], "a": 0}, {"t": "mcq", "q": "«поскольку, так как» — окончание", "opts": ["‑лъул", "‑идал", "‑лде"], "a": 0}, {"t": "say", "q": "Скажи «когда пришёл» (вачӀине → …ндал)", "ans": "вачӀиндал"}, {"t": "mcq", "q": "«хотя» —", "opts": ["‑ниги", "‑зегӀан", "‑го"], "a": 0}, {"t": "mcq", "q": "«читая» (одновременно) —", "opts": ["цӀалулаго", "цӀалун", "цӀалани"], "a": 0}], "drill": {"gen": "converb"}, "lvl": "B2"}, {"id": "local", "emoji": "🧭", "t": "Местные падежи: 5 серий", "sub": "B2: где именно — на/у/в/под/внутри", "teach": "\n<p class=\"lead\">Главная «фишка» аварского: локализация — где именно находится предмет.\n<b>5 серий</b> (на / у / в среде / под / внутри полого), у каждой свой суффикс, и к нему\nдобавляется направление: <b>где</b> (базовое) · <b>куда</b> (+е) · <b>откуда</b> (+а/‑са) · <b>насквозь</b> (+н).</p>\n<table class=\"vguide\">\n<tr class=\"head\"><td>Серия</td><td>где?</td><td>куда?</td><td>откуда?</td></tr>\n<tr><td><b>I</b> на, поверх <span class=\"v\">‑да</span></td><td>гъотӀо<b>да</b> «на дереве»</td><td>стол<b>алде</b></td><td>стол<b>алдаса</b></td></tr>\n<tr><td><b>II</b> у, при <span class=\"v\">‑хъ</span></td><td>къватӀа<b>хъ</b> «на улице»</td><td>…хъе</td><td>…хъа</td></tr>\n<tr><td><b>III</b> в среде <span class=\"v\">‑лъ</span></td><td>ро­су<b>лъ</b> «в селе»</td><td>лъада<b>лъе</b> «в воду»</td><td>ро­су<b>лъа</b> «из села»</td></tr>\n<tr><td><b>IV</b> под <span class=\"v\">‑кь</span></td><td>гъотӀо<b>кь</b> «под деревом»</td><td>гъотӀо<b>кье</b> «под дерево»</td><td>…кьа</td></tr>\n<tr><td><b>V</b> внутри полого <span class=\"v\">‑лъу‑</span></td><td>бочка<b>лъуб</b> «в бочке»</td><td>тумбочка<b>лъубе</b> «в тумбочку»</td><td>…лъуса</td></tr>\n</table>\n<div class=\"callout g\"><b>Как выбрать серию?</b> Смотри, ГДЕ предмет: на поверхности → ‑да, рядом → ‑хъ,\nвнутри вещества/массы → ‑лъ, под → ‑кь, внутри полого (ящик, комната, бочка) → ‑лъу‑.\nПотом добавь направление.</div>\n<div clas : "в тумбочку (внутрь, ‑лъубе)", "av": "тумбочкалъубе"}]}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('appdata').textContent);

/* ---------------- state ---------------- */
const S = JSON.parse(localStorage.getItem('avk_state')||'{}');
if(S.ipa===undefined)S.ipa=true; if(!S.gender)S.gender='m'; if(!S.tab)S.tab='home';
function save(){localStorage.setItem('avk_state',JSON.stringify(S));}
const PROG = JSON.parse(localStorage.getItem('avk_prog')||'{}');
if(!PROG.lessons)PROG.lessons={}; if(!PROG.drill)PROG.drill={a:0,c:0,byKey:{}};
function saveProg(){localStorage.setItem('avk_prog',JSON.stringify(PROG));}
const SRS = JSON.parse(localStorage.getItem('avk_srs')||'{}');
function saveSrs(){localStorage.setItem('avk_srs',JSON.stringify(SRS));}

/* ---------------- helpers ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
// scroll just enough to lift an element above the fixed bottom nav (~96px)
function revealScroll(el){ if(!el||!el.getBoundingClientRect)return;
  setTimeout(()=>{ const r=el.getBoundingClientRect(); const overflow=r.bottom-(window.innerHeight-96);
    if(overflow>0) window.scrollBy({top:overflow+16,behavior:'smooth'}); },60); }

/* class agreement */
const CM={I:'в',II:'й',III:'б',PL:'р'};
const COP={I:'вуго',II:'йиго',III:'буго',PL:'руго'};
const DEM={I:'дов',II:'дой',III:'доб'};          // «тот»
function cop(cls){return COP[cls];}
function selfCls(){return S.gender==='f'?'II':'I';}   // класс говорящего о себе
function agreeAdj(adjB,cls){return adjB.slice(0,-1)+ (cls==='I'?'в':cls==='II'?'й':cls==='III'?'б':'л');}
const P=DATA.pools;   // {I:[{av,ru}],II,III,adj}

/* ---- Cyrillic -> IPA transliterator (built from the alphabet's own IPA map) ---- */
const nk=s=>s.toLowerCase().replace(/ӏ/g,'Ӏ');   // lowercase + canonical palochka (U+04C0)
const IPA=(()=>{
  const m={};
  const clean=ipa=>ipa.split('/')[0].trim();      // "e / je" -> "e"
  const put=(L,ipa)=>{L.split(' ').forEach(p=>{if(p)m[nk(p)]=clean(ipa);});};
  DATA.special.forEach(x=>put(x.L,x.ipa));
  DATA.alphabet.forEach(x=>put(x.L,x.ipa));
  Object.assign(m,{'е':'e','э':'e','я':'ja','ю':'ju','ё':'jo','ы':'ɨ','ь':'ʲ','ф':'f','ъ':'ʔ'});
  return m;
})();
function translit(word){
  if(!word)return '';
  const s=word.replace(/ӏ/g,'Ӏ'); let out=''; let i=0;
  while(i<s.length){
    const two=nk(s.substr(i,2));
    const one=nk(s[i]);
    if(/\s/.test(s[i])){out+=' ';i++;continue;}
    if(/[.,!?;:—…()«»"'-]/.test(s[i])){out+=s[i];i++;continue;}
    if(IPA[two]){out+=IPA[two];i+=2;}
    else if(IPA[one]){out+=IPA[one];i+=1;}
    else {out+=s[i];i++;}
  }
  return out;
}
// pronunciation span (hidden when the "Произношение" toggle is off, via .hide-ipa)
function pron(av){return `<span class="ipa">[${esc(translit(av))}]</span>`;}

/* ---------------- audio ---------------- */
let _audio=null;
function playAudio(file,btn){
  if(!file)return;
  try{ if(_audio){_audio.pause();} _audio=new Audio(file); _audio.play().catch(()=>{});
    if(btn){btn.textContent='🔊';setTimeout(()=>btn.textContent='▶',700);} }catch(e){}
}

/* ---------------- toggles ---------------- */
function applyToggles(){
  document.body.classList.toggle('hide-ipa',!S.ipa);
  $('ipaState').textContent=S.ipa?'ON':'OFF';
  $('tgIpa').classList.toggle('on',S.ipa);
  $('genState').textContent=S.gender==='m'?'♂ м':'♀ ж';
  $('tgGen').classList.toggle('on',S.gender==='f');
}
function toggleIpa(){S.ipa=!S.ipa;save();applyToggles();}
function toggleGender(){S.gender=S.gender==='m'?'f':'m';save();applyToggles();renderAll();}

/* ---------------- progress ---------------- */
function lp(id){return PROG.lessons[id]||(PROG.lessons[id]={seen:false,done:false,a:0,c:0,miss:0});}
function recLesson(id,ok){const l=lp(id);l.seen=true;l.a++;ok?l.c++:l.miss++;recDay();saveProg();}
function recDrill(key,label,ok){const d=PROG.drill;d.a++;if(ok)d.c++;
  const e=d.byKey[key]||(d.byKey[key]={a:0,c:0,miss:0,label});e.label=label;e.a++;e[ok?'c':'miss']++;recDay();saveProg();}
/* daily streak + goal */
const DAILY_GOAL=20;
function dkey(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function recDay(){if(!PROG.days)PROG.days={};const t=dkey(new Date());PROG.days[t]=(PROG.days[t]||0)+1;}
function todayCount(){return (PROG.days&&PROG.days[dkey(new Date())])||0;}
function streak(){if(!PROG.days)return 0;let s=0;const d=new Date();
  if(!PROG.days[dkey(d)])d.setDate(d.getDate()-1);        // grace: today not yet done
  while(PROG.days[dkey(d)]){s++;d.setDate(d.getDate()-1);}
  return s;}
function lessonsDone(){return Object.values(PROG.lessons).filter(l=>l.done).length;}
function acc(){const d=PROG.drill;return d.a?Math.round(100*d.c/d.a):0;}

/* wordbank of every taught item (for cards) */
function allVocab(){
  const out=[]; const seen=new Set();
  DATA.themes.forEach(t=>t.words.forEach(w=>{const k=w.av+'|'+w.ru;if(!seen.has(k)){seen.add(k);out.push({av:w.av,ru:w.ru,tag:t.title});}}));
  DATA.lessons.forEach(l=>(l.words||[]).forEach(w=>{const k=w.av+'|'+w.ru;if(!seen.has(k)){seen.add(k);out.push({av:w.av,ru:w.ru,tag:l.t});}}));
  return out;
}

/* ================= DRILL GENERATORS ================= */
/* each returns {ru, av, tag} — ru shown, av produced */
const GEN={
 alpha(){const x=pick(DATA.special.concat(DATA.alphabet.filter(a=>a.audio)));
   return {ru:'Как звучит «'+x.L.split(' ')[0]+'»? (пример: '+x.ex+' — '+x.exru+')',
           av:x.hint+'  ['+x.ipa+']', tag:'звук', audio:x.audio};},
 copula(){const r=Math.random();
   if(r<0.5){const c=selfCls();const w=pick(c==='II'?P.selfII:P.selfI);
     return {ru:'Я '+w.ru,av:'Дун '+w.av+' '+cop(c),tag:'вуго/йиго'};}
   const cls=pick(['I','II','III']);const w=pick(P[cls]);
   return {ru:(cls==='I'?'Он ':cls==='II'?'Она ':'Это ')+w.ru,av:DEM[cls]+' '+w.av+' '+cop(cls),tag:'классы'};},
 greet(){const g=pick([
     {ru:'Здравствуй (девочке)',av:'ЙорчӀами!'},{ru:'Здравствуй (мальчику)',av:'ВорчӀами!'},
     {ru:'Здравствуйте (многим)',av:'РорчӀами!'},{ru:'Как тебя зовут?',av:'Дуда цӀар щиб?'},
     {ru:'Спасибо',av:'Баркала'},{ru:'Как дела?',av:'Щиб хӀал бугеб?'},{ru:'Хорошо',av:'ЛъикӀ буго'},
     {ru:'Я '+(S.gender==='f'?'(девочка)':'(мальчик)')+' — Муса/Аминат',av:'Дун '+(S.gender==='f'?'Аминат йиго':'Муса вуго')}]);
   return {...g,tag:'приветствие'};},
 thisis(){const w=pick(P.III);return {ru:'Это '+w.ru,av:'Гьаб '+w.av+' буго',tag:'это…'};},
 possess(){const cls=pick(['I','II','III']);const w=pick(P[cls]);
   return {ru:'У меня есть '+w.ru,av:'Дир '+w.av+' '+cop(cls),tag:'дир…'};},
 adj(){const cls=pick(['I','II','III']);const w=pick(P[cls]);
   const pool=cls==='III'?P.adj:P.adj.filter(a=>a.p);const a=pick(pool);
   // predicative: [noun] [agreed adjective] [copula] = «Вас гьитӀинав вуго» (Мальчик маленький)
   return {ru:cap(w.ru)+' — '+a.ru+' (какой?)',av:cap(w.av)+' '+agreeAdj(a.av,cls)+' '+cop(cls),tag:'сказуемое'};},
 num(){const num=pick(DATA.numbers);const w=pick(P.III);
   return {ru:num.ru+' × '+w.ru,av:num.av+' '+w.av,tag:'счёт'};},
 verbpres(){const v=pick(DATA.verbs);
   if(v.tr)return {ru:'Я '+v.presRu+' '+v.objRu,av:'Дица '+v.obj+' '+v.pres,tag:'наст. время'};
   return {ru:'Я '+v.presRu,av:'Дун '+v.pres,tag:'наст. время'};},
 want(){if(Math.random()<0.5){const v=pick(DATA.verbs.filter(v=>v.tr));
     return {ru:'Я хочу '+v.objRu,av:'Дие '+v.obj+' бокьун буго',tag:'хочу'};}
   const v=pick(DATA.verbs);return {ru:'Я умею '+v.ru,av:'Дида '+v.inf+' кӀола',tag:'могу'};},
 neg(){if(Math.random()<0.5){const cls=pick(['I','II','III']);const w=pick(P[cls]);
     return {ru:cap(w.ru)+' отсутствует (нет)',av:cap(w.av)+' гьечӀо',tag:'нет'};}
   const v=pick(DATA.verbs);return {ru:'Я не '+v.presRu,av:'Дун '+v.pres+'ро',tag:'‑ро'};},
 past(){if(Math.random()<0.55){const c=selfCls();
     return {ru:'Я '+(S.gender==='f'?'пришла':'пришёл'),av:'Дун '+(c==='II'?'ячӀана':'вачӀана'),tag:'прош. время'};}
   const v=pick(DATA.verbs.filter(v=>v.tr));return {ru:'Я '+v.pastRu+' '+v.objRu,av:'Дица '+v.obj+' '+v.past,tag:'прош. время'};},
 imper(){const g=pick([{ru:'Возьми!',av:'Босе!'},{ru:'Смотри!',av:'Балагье!'},{ru:'Кушай!',av:'Кванай!'},
     {ru:'Приходи!',av:'ВачӀа!'},{ru:'Пиши!',av:'Хъвай!'},{ru:'Читай!',av:'ЦӀале!'},
     {ru:'Вставай!',av:'Вахъа!'},{ru:'Не читай!',av:'ЦӀалуге!'},{ru:'Давай! (дай)',av:'Кье!'}]);return {...g,tag:'просьба'};},
 future(){const v=pick(DATA.verbs.filter(x=>x.fut));
   if(v.tr)return {ru:'Я '+v.futRu+' '+v.objRu,av:'Дица '+v.obj+' '+v.fut,tag:'буд. время'};
   return {ru:'Я '+v.futRu,av:'Дун '+v.fut,tag:'буд. время'};},
 vform(){const v=pick(DATA.verbs);
   const F=[['настоящее (делает)',v.pres],['прошедшее (сделал)',v.past],['приказ (сделай!)',v.imp],
     ['отрицание наст. (не делает)',v.pres+'ро'],['если … (условное)',v.past.replace(/на$/,'ни')]];
   if(v.fut)F.push(['будущее (сделает)',v.fut]);
   if(v.conv)F.push(['деепричастие (сделав)',v.conv]);
   if(v.part)F.push(['причастие (…ющий)',v.part]);
   const f=pick(F);
   return {ru:v.ru+' («'+v.inf+'») → '+f[0],av:f[1],tag:'формы глагола'};},
 cases(){const p=pick(DATA.cases.pron);const c=pick(p.forms);
   return {ru:p.ru+' → '+c[0],av:c[1],tag:'падежи'};},
 localcase(){const nn=pick(DATA.cases.local);const c=pick(nn.forms);
   return {ru:nn.ru+' → '+c[0],av:c[1],tag:'местные падежи'};},
 cond(){return {...pick(DATA.conds),tag:'условное'};},
 casemix(){return Math.random()<0.5?GEN.cases():GEN.localcase();},
 series(){const s=pick(DATA.series);return {ru:s.ru,av:s.av,tag:'местные падежи'};},
 converb(){return {...pick([
     {ru:'прочитав (деепр.)',av:'цӀалун'},{ru:'читая (деепр.)',av:'цӀалулаго'},
     {ru:'чтобы прочитать',av:'цӀализелъун'},{ru:'поскольку есть',av:'бугелъул'},
     {ru:'когда пришёл',av:'вачӀиндал'},{ru:'пока не прочтёт',av:'цӀализегӀан'},
     {ru:'хотя есть',av:'бугониги'},{ru:'до того как попало',av:'кквелалде'}]),tag:'связки'};},
 quest(){const g=pick([{ru:'что?',av:'щиб?'},{ru:'кто? (о мужчине)',av:'щив?'},{ru:'кто? (о женщине)',av:'щий?'},
     {ru:'где?',av:'киб?'},{ru:'когда?',av:'кида?'},{ru:'как?',av:'кин?'},{ru:'почему?',av:'щай?'},{ru:'сколько?',av:'чан?'}]);
   return {...g,tag:'вопрос'};},
 place(){const g=pick([{ru:'здесь',av:'гьаниб'},{ru:'там',av:'гьениб'},{ru:'сюда',av:'гьанибе'},{ru:'туда',av:'гьанире'},
     {ru:'Я иду',av:'Дун ине'},{ru:'Она идёт',av:'Дой ине'}]);return {...g,tag:'место'};},
 loan(){return {...pick([
     {ru:'Я хочу проверить (провер‑изе)',av:'Дие проверизе бокьун буго'},
     {ru:'Я хочу погуглить (гугл‑изе)',av:'Дие гуглизе бокьун буго'},
     {ru:'сделать ремонт',av:'ремонт гьабизе'},
     {ru:'позвонить (звонок сделать)',av:'звонок гьабизе'},
     {ru:'в документе',av:'документалда'},{ru:'в интернете',av:'интернеталда'},
     {ru:'что написано? (написано ли)',av:'Щиб хъван бугебали?'},
     {ru:'например',av:'масала'},{ru:'но, однако',av:'амма'},{ru:'или',av:'яги'},
     {ru:'потом, затем',av:'цинги'},{ru:'конечно',av:'узухъда'},{ru:'поэтому, значит',av:'гьединлъидал'}]),tag:'заимствования'};},
 talk(){return pick([GEN.greet(),GEN.copula(),GEN.possess(),GEN.num(),GEN.past(),GEN.quest(),GEN.loan()]);},
 vocab(words){const w=pick(words);return {ru:w.ru,av:w.av,tag:'слова'};},
};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function capital(s){return cap(s);}
function ruObj(v){return v.ru==='читать'?'книгу':v.ru==='писать'?'письмо':v.ru==='есть'?'хлеб':v.ru==='пить'?'воду':'';}
function plural(ru,num){return ru;} // keep russian noun simple in gloss

function genFor(spec){
  if(!spec) return GEN.vocab(allVocab());
  if(spec.gen==='vocab') return GEN.vocab(spec.words&&spec.words.length?spec.words:allVocab());
  const f=GEN[spec.gen]; return f?f():GEN.vocab(allVocab());
}

const drills={};
function drillHTML(id){return `
 <div class="chips" style="justify-content:center;margin-bottom:2px">
   <span class="chip on" id="${id}_mSay" onclick="drillMode('${id}',false)">🗣️ Сказать</span>
   <span class="chip b" id="${id}_mType" onclick="drillMode('${id}',true)">⌨️ Печатать</span>
 </div>
 <div class="stage" id="${id}_stage"></div>
 <div class="feedback" id="${id}_fb" style="text-align:center"></div>
 <div id="${id}_type" style="display:none">
   <input type="text" id="${id}_in" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Напиши по-аварски…" onkeydown="if(event.key==='Enter')drillCheck('${id}')">
   <div class="btnrow" style="margin-top:8px">
     <button class="btn blue" onclick="drillCheck('${id}')">Проверить</button>
     <button class="btn ghost" onclick="drillNew('${id}')">↻ Дальше</button></div>
 </div>
 <div id="${id}_reveal">
   <div class="btnrow">
     <button class="btn blue" onclick="drillShow('${id}')" id="${id}_show">Показать ответ</button>
     <button class="btn ghost" onclick="drillNew('${id}')">↻ Дальше</button>
   </div>
   <div class="grade" id="${id}_grade">
     <button class="btn blk" style="flex:1" onclick="drillGrade('${id}',0)">Не смог</button>
     <button class="btn grn" style="flex:1" onclick="drillGrade('${id}',1)">Смог ✓</button>
   </div>
 </div>
 <div class="note" id="${id}_sess" style="text-align:center">0 сделано</div>`;}
function drillMount(id,spec,key,label){drills[id]={spec,key:key||'G:'+(spec&&spec.gen||'mix'),label:label||'Тренировка',cur:null,shown:false,typing:false,sess:{a:0,c:0}};drillNew(id);}
function normAns(s){return (s||'').toLowerCase().replace(/ӏ/g,'').replace(/ё/g,'е').replace(/[^а-я]/g,'');}
function drillMode(id,typing){const d=drills[id];if(!d)return;d.typing=typing;
  $(id+'_mSay').classList.toggle('on',!typing);$(id+'_mType').classList.toggle('on',typing);
  $(id+'_type').style.display=typing?'':'none';$(id+'_reveal').style.display=typing?'none':'';
  drillNew(id);}
function drillNew(id){const d=drills[id];d.cur=genFor(d.spec);d.shown=false;
  const inp=$(id+'_in');if(inp)inp.value='';const fb=$(id+'_fb');if(fb){fb.textContent='';fb.className='feedback';}
  drillRender(id);if(inp&&d.typing)inp.focus();}
function drillRender(id){const d=drills[id],c=d.cur;
  $(id+'_stage').innerHTML=`<div class="tasktag">${esc(c.tag||'')}</div>
    <div class="prompt">${esc(c.ru)}</div>`+
    (d.shown?`<div class="ans">${esc(c.av)}</div><div class="ipa" style="font-size:.95rem">[${esc(translit(c.av))}]</div>`+(c.audio?`<div><button class="play" onclick="playAudio('${c.audio}',this)">▶</button></div>`:''):'');
  const show=$(id+'_show');if(show)show.style.display=d.shown?'none':'';
  $(id+'_grade').classList.toggle('on',d.shown&&!d.typing);
  $(id+'_sess').textContent=d.sess.a+' сделано · '+(d.sess.a?Math.round(100*d.sess.c/d.sess.a):0)+'% верно';
}
function drillShow(id){drills[id].shown=true;drillRender(id);if(drills[id].cur.audio)playAudio(drills[id].cur.audio);
  revealScroll($(id+'_grade'));}
function drillGrade(id,ok){const d=drills[id];d.sess.a++;if(ok)d.sess.c++;recDrill(d.key,d.label,!!ok);drillNew(id);}
function drillCheck(id){const d=drills[id];const inp=$(id+'_in');const val=inp?inp.value:'';
  if(!val.trim())return;
  const ok=normAns(val)===normAns(d.cur.av);
  d.shown=true;d.sess.a++;if(ok)d.sess.c++;recDrill(d.key,d.label,ok);
  drillRender(id);
  const fb=$(id+'_fb');if(fb){fb.textContent=ok?'Верно! ✓ '+d.cur.av:'Не совсем. Правильно: '+d.cur.av;fb.className='feedback '+(ok?'ok':'no');}
}

/* ---- CARDS (SRS) ---- */
let deck=[],ci=0,flipped=false,cmode='all',cardDir='ru2av';
function everyWord(){
  const out=allVocab(); const map=new Map(out.map(w=>[w.av+'|'+w.ru,w]));
  (DATA.freq||[]).forEach(L=>L.words.forEach(w=>{const key=w.av+'|'+w.ru;
    const e=map.get(key);
    if(e){ if(w.ex&&!e.ex)e.ex=w.ex; if(w.forms&&!e.forms)e.forms=w.forms; if(w.alts&&!e.alts)e.alts=w.alts; }
    else { const n={...w,tag:L.title}; map.set(key,n); out.push(n); }
  }));
  return out;
}
function renderCards(){
  const freqChips=(DATA.freq||[]).map(L=>`<span class="chip b ${cmode==='freq:'+L.id?'on':''}" onclick="cmSet('freq:${L.id}')">${esc(L.title)} (${L.words.length})</span>`).join('');
  $('v-cards').innerHTML=`<h2>Картал · Карточки</h2>
    <p class="lead">По частотности (реальный аварский, без русских заимствований) или по темам.
    На обороте — синонимы, формы и пример из словаря.</p>
    <div class="chips">
      <span class="chip b ${cardDir==='ru2av'?'on':''}" onclick="cardDirSet('ru2av')">Рус → Авар</span>
      <span class="chip b ${cardDir==='av2ru'?'on':''}" onclick="cardDirSet('av2ru')">Авар → Рус</span>
    </div>
    <div class="chips">
      <span class="chip ${cmode==='all'?'on':''}" onclick="cmSet('all')">Все слова</span>
      ${freqChips}
    </div>
    <div class="chips">
      ${DATA.themes.map(t=>`<span class="chip ${cmode===t.id?'on':''}" onclick="cmSet('${t.id}')">${t.emoji} ${esc(t.title)}</span>`).join('')}
    </div>
    <div id="cardbox"></div>`;
  buildDeck();showCard();
}
function cmSet(m){cmode=m;renderCards();}
function cardDirSet(d){cardDir=d;flipped=false;renderCards();}
function buildDeck(){
  let src;
  if(cmode==='all') src=everyWord();
  else if(cmode.startsWith('freq:')){const L=(DATA.freq||[]).find(x=>'freq:'+x.id===cmode);src=(L?L.words:[]).map(w=>({...w,tag:L?L.title:''}));}
  else src=(DATA.themes.find(t=>t.id===cmode)?.words||[]).map(w=>({...w,tag:cmode}));
  // spaced: prioritise low box
  deck=shuffle(src).sort((a,b)=>(SRS[a.av+'|'+a.ru]||0)-(SRS[b.av+'|'+b.ru]||0));
  ci=0;flipped=false;
}
function altStr(a){return (typeof a==='string')?{av:a}:a;}   // back-compat
function cardReveal(c){
  // rich back of the card: pronunciation, usage example, forms, synonyms (each with its example)
  let h=`<div class="ipa" style="font-size:1rem">[${esc(translit(c.av))}]</div>`;
  if(c.ex) h+=`<div class="divider"></div><div class="av" style="font-size:1.05rem">${esc(c.ex.av)}</div><div class="az">${esc(c.ex.ru)}</div>`;
  if(c.forms&&c.forms.length>1) h+=`<div class="divider"></div><div class="az" style="font-size:.78rem">формы: <span class="av" style="font-weight:400">${c.forms.slice(0,6).map(esc).join(' · ')}</span></div>`;
  const senses=(c.senses||[]).filter(Boolean);
  if(senses.length>1){
    h+=`<div class="divider"></div><div class="az" style="font-size:.78rem">значения слова «${esc(c.av)}»:</div>`
      +`<div class="az" style="font-size:.8rem;font-weight:400;color:var(--fg)">${senses.slice(0,4).map((s,i)=>`${i+1}. ${esc(s)}`).join('<br>')}</div>`;
  }
  const alts=(c.alts||[]).map(altStr).filter(a=>a.av&&a.av!==c.av);
  if(alts.length){
    h+=`<div class="divider"></div><div class="az" style="font-size:.78rem">синонимы:</div>`;
    alts.forEach(a=>{
      h+=`<div style="margin-top:3px"><span class="av" style="font-weight:600">${esc(a.av)}</span>`
        +(a.ex?` <span class="az">— ${esc(a.ex.av)} <i>(${esc(a.ex.ru)})</i></span>`:'')+`</div>`;
    });
  }
  h+=`<div class="az" style="margin-top:8px;font-size:.72rem">${esc(c.tag||'')}</div>`;
  return h;
}
function showCard(){
  const box=$('cardbox');if(!deck.length){box.innerHTML='<div class="card">Нет карточек</div>';return;}
  const c=deck[ci%deck.length];const key=c.av+'|'+c.ru;const box_=SRS[key]||0;
  const front = cardDir==='av2ru' ? c.av : c.ru;
  const back  = cardDir==='av2ru' ? c.ru : c.av;
  box.innerHTML=`<div class="note" style="text-align:center">${(ci%deck.length)+1} / ${deck.length} · уровень ${box_}</div>
   <div class="flash" onclick="flipCard()">
     <div class="kind">${flipped?(cardDir==='av2ru'?'перевод':'аварский'):(cardDir==='av2ru'?'аварский':'русский')}</div>
     <div class="big">${esc(flipped?back:front)}${(!flipped&&cardDir==='av2ru')?`<div class="ipa" style="font-size:.9rem">[${esc(translit(c.av))}]</div>`:''}</div>
     ${flipped?cardReveal(c):'<div class="tap">нажми, чтобы перевернуть</div>'}
   </div>
   ${flipped?`<div class="btnrow" id="cardGrade">
     <button class="btn blk" onclick="gradeCard(0)">Снова</button>
     <button class="btn" onclick="gradeCard(1)">Норм</button>
     <button class="btn grn" onclick="gradeCard(2)">Легко</button></div>`:
     `<div class="btnrow"><button class="btn blue" onclick="flipCard()">Перевернуть</button></div>`}`;
}
function flipCard(){flipped=!flipped;showCard();
  if(flipped)revealScroll($('cardGrade'));}
function gradeCard(g){const c=deck[ci%deck.length];const key=c.av+'|'+c.ru;
  let b=SRS[key]||0; b=g===0?Math.max(0,b-1):g===2?Math.min(5,b+2):Math.min(5,b+1);
  SRS[key]=b;saveSrs(); recDay();saveProg(); ci++;flipped=false;showCard();}

function vocSearch(){const q=($('vocq')?.value||'').trim().toLowerCase();

/* ---------------- install / platform ---------------- */
function platform(){
  const ua=(navigator.userAgent||'');
  if(/iphone|ipad|ipod/i.test(ua) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) return 'ios';
  if(/android/i.test(ua)) return 'android';
  return 'desktop';
}
function isStandalone(){
  return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
}
let deferredPrompt=null;
if(window.addEventListener) window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const b=$('installBtn'); if(b)b.style.display='';});
function doInstall(){ if(deferredPrompt){deferredPrompt.prompt();
  if(deferredPrompt.userChoice)deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderHome();}); } }
function installHTML(){
  if(isStandalone()) return '';
  const p=platform();
  if(p==='ios') return `<div class="callout b" style="text-align:left"><b>📲 Установить как приложение (iPhone / iPad):</b>
    <div style="margin-top:4px">1. Нажми <b>Поделиться</b> <span style="font-size:1.1em">􀈂</span> (квадрат со стрелкой ⬆️, внизу Safari).<br>
    2. Пролистай и выбери <b>«На экран «Домой»»</b>.<br>
    3. Нажми <b>«Добавить»</b> — иконка появится на рабочем столе!</div></div>`;
  if(p==='android') return `<div class="callout b" style="text-align:left"><b>📲 Установить как приложение (Android):</b>
    <div style="margin-top:4px">Нажми кнопку ниже, либо меню <b>⋮</b> в Chrome → <b>«Установить приложение»</b> (или «Добавить на главный экран»).</div>
    <button class="btn grn" id="installBtn" style="margin-top:8px;display:${deferredPrompt?'':'none'}" onclick="doInstall()">📲 Установить</button></div>`;
  return `<div class="callout b" style="text-align:left"><b>📲 Установить на компьютер:</b>
    <div style="margin-top:4px">Нажми значок установки <b>⊕</b> в адресной строке браузера (или меню → «Установить приложение…»).</div>
    <button class="btn grn" id="installBtn" style="margin-top:8px;display:${deferredPrompt?'':'none'}" onclick="doInstall()">📲 Установить</button></div>`;
}

/* ---------------- onboarding ---------------- */

  o.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(8,11,17,.92);display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow-y:auto';
  o.innerHTML=`<div class="card" style="max-width:380px;text-align:center;margin:auto">
    <div style="font-size:2.4rem">🏔️</div>
    <h2>ВорчӀами! Добро пожаловать</h2>
    <p class="lead">Это курс аварского для русскоговорящих. Ты заговоришь с первого урока.</p>
    <p class="lead">Курс подстраивается под тебя: когда говоришь <b>о себе</b>, окончания зависят от того,
      парень ты (класс I «<b>в</b>»: Дун вуго) или девушка (класс II «<b>й</b>»: Дун йиго).</p>
    <div class="btnrow" style="margin-top:6px">
      <button class="btn" onclick="pickGender('m')">♂ Я парень</button>
      <button class="btn blue" onclick="pickGender('f')">♀ Я девушка</button>

    ${installHTML()}
    <p class="note" style="margin-top:10px">Пол можно поменять кнопкой «Я» вверху справа.

  document.body.appendChild(o);
}
function pickGender(g){S.gender=g;S.onboarded=true;save();applyToggles();const o=$('onb');if(o&&o.remove)o.remove();renderAll();}

/* ---------------- boot ---------------- */
applyToggles();renderAll();go(S.tab);maybeOnboard();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
